ans:1,exp:'<strong>Aurora 兼容 MySQL 和 PostgreSQL。</strong><br><br>• Aurora MySQL 兼容：现有 MySQL 驱动/代码无需修改即可连接<br>• Aurora PostgreSQL 兼容：现有 PostgreSQL 驱动/代码无需修改<br><br>Aurora 是 AWS 专有（Proprietary）技术，不是开源的，但与这两种开源数据库保持 API 兼容。Oracle 和 MS SQL Server 只能在标准 RDS 上运行，不在 Aurora 支持范围内。',ww:'MariaDB 是 RDS 支持的引擎，不是 Aurora 兼容的目标（A、C 错）。Oracle/MS SQL Server 只在标准 RDS 支持（D 错）。',rule:'Aurora 只兼容 MySQL 和 PostgreSQL（两种）。Oracle / MariaDB / MS SQL Server 不在 Aurora 兼容范围内。'},

{id:'udemy_ec_21',topic:'ElastiCache',diff:'high',
text:'游戏公司需要<em>实时对玩家排名</em>，设计一个高效且高可用的游戏排行榜。应该用什么？',
en:'You work as a Solutions Architect for a gaming company. Players are ranked in real-time based on their score. Design an effective and highly available gaming leaderboard. What should you use?',
ch:['RDS for MySQL','Amazon Aurora','ElastiCache for Memcached','ElastiCache for Redis — Sorted Sets'],
ench:['Use RDS for MySQL','Use an Amazon Aurora','Use ElastiCache for Memcached','Use ElastiCache for Redis - Sorted Sets'],
ans:3,exp:'<strong>ElastiCache Redis — Sorted Sets</strong> 是游戏排行榜的标准方案：<br><br>📊 <strong>Redis Sorted Sets 特性：</strong><br>• 每个元素包含 member（玩家ID）和 score（分数）<br>• 自动按 score 排序，保证<strong>唯一性</strong><br>• 新增/更新分数后，<strong>实时重新排序</strong><br>• O(log N) 时间复杂度，高效处理百万玩家<br>• ZRANK 命令直接获取排名，ZRANGE 获取排行榜<br><br>高可用：Redis 支持 Multi-AZ + Auto-Failover。<br><br>RDS/Aurora 每次排名需要 ORDER BY 查询，高并发下性能差（A、B 错）。Memcached 不支持 Sorted Set（C 错）。',ww:'RDS/Aurora ORDER BY 查询在高并发实时场景性能差（A、B 错）。Memcached 只支持 String，无 Sorted Set（C 错）。',rule:'实时游戏排行榜 → ElastiCache Redis Sorted Sets（实时排序 + 唯一性 + 高可用）。'},

{id:'udemy_rds_22',topic:'RDS',diff:'high',
text:'你需要对 AWS 上的 Oracle 数据库进行<em>完全自定义</em>，同时希望能使用 AWS 服务的优势。推荐什么？',
en:'You need full customization of an Oracle Database on AWS. You would like to benefit from using the AWS services. What do you recommend?',
ch:['RDS for Oracle','RDS Custom for Oracle','在 EC2 上部署 Oracle'],
ench:['RDS for Oracle','RDS Custom for Oracle','Deploy Oracle on EC2'],
ans:1,exp:'<strong>RDS Custom for Oracle</strong> 是"完全自定义 + 使用 AWS 服务"的最佳平衡：<br><br>• <strong>RDS for Oracle</strong>：托管服务，但 AWS 管理底层，你<strong>无法自定义 OS 和 DB</strong><br>• <strong>RDS Custom for Oracle</strong>：在 RDS 的托管基础上，提供<strong>底层 OS 和 DB 的完整访问权限</strong>，支持 SSH / SSM Session Manager<br>• <strong>EC2 部署 Oracle</strong>：完全控制，但要自己管理一切，无法受益于 AWS RDS 服务<br><br>关键：题目要求"完全自定义 + 享受 AWS 服务" → RDS Custom 是唯一同时满足两者的选项。',ww:'RDS for Oracle 无法完全自定义（A 错）。EC2 部署无法享受 RDS 托管服务优势（C 错）。',rule:'需要 Oracle 完全自定义 + AWS 托管服务 → RDS Custom for Oracle。'},

{id:'udemy_rds_23',topic:'RDS',diff:'high',
text:'你需要为 Aurora 数据库存储<em>长期备份</em>，用于灾难恢复和审计目的。推荐什么？',
en:'You need to store long-term backups for your Aurora database for disaster recovery and audit purposes. What do you recommend?',
ch:['启用自动备份（Automated Backups）','执行按需备份（On-Demand Backups / Manual Snapshots）','使用 Aurora Database Cloning'],
ench:['Enable Automated Backups','Perform On Demand Backups','Use Aurora Database Cloning'],
ans:1,exp:'<strong>On-Demand Backups（手动快照）</strong> 是长期备份的正确选择：<br><br>• <strong>自动备份（Automated Backups）</strong>：最多只能保留 <strong>1–35 天</strong>，超过后自动删除，<strong>不适合长期保存</strong><br>• <strong>手动快照（On-Demand / Manual Snapshots）</strong>：保留时间<strong>无限制</strong>，用户手动触发，<strong>想删时才删</strong>，非常适合灾难恢复和审计<br>• <strong>Aurora Cloning</strong>：用于快速创建测试环境，不是备份工具<br><br>关键词：<em>长期 / Long-term / 审计 / Audit → Manual Snapshot</em>',ww:'自动备份最多 35 天，不满足长期需求（A 错）。Aurora Cloning 是克隆数据库，不是备份（C 错）。',rule:'长期备份（超过 35 天）→ On-Demand / Manual Snapshot（无限期保留）。自动备份最多 35 天。'},

{id:'udemy_rds_24',topic:'RDS',diff:'high',
text:'开发团队需要对生产 Aurora 数据库执行<em>读写测试</em>，并且<em>需要尽快访问生产数据</em>。你建议什么？',
en:'Development team would like to perform read and write tests against production Aurora database because they need access to production data as soon as possible. What do you advise?',
ch:['为他们创建 Aurora Read Replica','直接在生产数据库上测试','拍 DB Snapshot 并恢复到新数据库','使用 Aurora Cloning 功能'],
ench:['Create an Aurora Read Replica for them','Do the test against the production database','Make a DB Snapshot and Restore it into a new database','Use the Aurora Cloning feature'],
ans:3,exp:'<strong>Aurora Database Cloning</strong> 是这个场景的最佳方案：<br><br>• 使用 <strong>Copy-on-write</strong> 协议，初始<strong>共享存储卷</strong>，几乎瞬间创建完成（比 Snapshot 快得多）<br>• <strong>不影响生产数据库</strong>（共享只读数据，写入时才分离）<br>• 开发团队获得<strong>完整的读写权限</strong>（包括写），这是 Read Replica 做不到的<br>• 数据和生产数据库完全相同，满足"尽快访问生产数据"的要求<br><br>Read Replica 只支持 SELECT（A 错）。直接测试生产库风险极高（B 错）。Snapshot 恢复比 Cloning 慢很多（C 可行但不是最优）。',ww:'Read Replica 只读，无法做写测试（A 错）。直接在生产 DB 上测试危险（B 错）。Snapshot 恢复更慢（C 错）。',rule:'需要读写测试 + 使用生产数据 + 快速 + 不影响生产 → Aurora Cloning（Copy-on-write，秒级完成）。'},


/* ── Route 53 ── */
{id:'r53_01',topic:'Route 53',diff:'high',
text:'公司想把根域名 <span class="code-inline">example.com</span> 指向 Application Load Balancer。应使用哪种 DNS 记录类型？',
en:'A company wants to point the root domain <span class="code-inline">example.com</span> to an Application Load Balancer. Which DNS record type should be used?',
ch:['CNAME 记录','A 记录（普通）','Alias 记录（A 类型）','NS 记录'],
ench:['CNAME record','A record (regular)','Alias record (type A)','NS record'],
ans:2,exp:'<strong>Alias 记录</strong>是正确答案：<br><br>• CNAME <strong>不能用于根域名（Zone Apex）</strong>，如 example.com<br>• Alias 是 Route 53 对 DNS 的扩展，<strong>可以指向根域名</strong>（Zone Apex）<br>• Alias 指向 AWS 资源（ALB、CloudFront 等），类型为 A 或 AAAA<br>• Alias 免费，且自动跟踪 ALB IP 变化<br>• 普通 A 记录需要填写静态 IP，ALB 没有固定 IP',ww:'CNAME 不能用于根域名（A 错）。普通 A 记录无法指向域名（B 错）。NS 是 Name Server 记录，用途不同（D 错）。',rule:'根域名（Zone Apex）指向 AWS 资源 → Alias 记录。子域名才可以用 CNAME。'},

{id:'r53_02',topic:'Route 53',diff:'high',
text:'全球用户访问部署在 us-east-1 和 ap-southeast-1 的应用。要求<em>将用户路由到响应速度最快的 Region</em>。应使用哪种路由策略？',
en:'Global users access an application deployed in us-east-1 and ap-southeast-1. The requirement is to <em>route users to the Region with the fastest response time</em>. Which routing policy should be used?',
ch:['Geolocation','Weighted','Latency-based','Failover'],
ench:['Geolocation','Weighted','Latency-based','Failover'],
ans:2,exp:'<strong>Latency-based（延迟路由）</strong>：<br><br>• 根据用户到各 AWS Region 的<strong>实际网络延迟</strong>来路由<br>• 不是地理位置路由 — 德国用户可能被路由到 us-east-1（如果那里延迟更低）<br>• 可与 Health Check 结合，具备故障转移能力<br><br>Geolocation 按用户<strong>物理位置</strong>路由，不保证最低延迟（A 错）。Weighted 按权重比例分配（B 错）。Failover 是主备模式（D 错）。',ww:'Geolocation 是按地理位置路由，不是按速度（A 错）。Weighted 与速度无关（B 错）。Failover 是主备容灾而非性能优化（D 错）。',rule:'最低延迟 / 最佳性能 → Latency-based。用户位置 → Geolocation。'},

{id:'r53_03',topic:'Route 53',diff:'high',
text:'电商平台需要根据<em>用户所在国家</em>提供本地化内容，欧洲用户访问欧洲服务器，亚洲用户访问亚洲服务器。应使用哪种路由策略？',
en:'An e-commerce platform needs to serve localized content based on <em>the country of the user</em>. European users go to European servers, Asian users go to Asian servers. Which routing policy should be used?',
ch:['Latency-based','Geoproximity','Geolocation','Multi-Value Answer'],
ench:['Latency-based','Geoproximity','Geolocation','Multi-Value Answer'],
ans:2,exp:'<strong>Geolocation（地理位置路由）</strong>：<br><br>• 根据用户的<strong>物理地理位置（国家/大洲）</strong>来路由<br>• 适合：本地化内容、法规合规、区域内容限制<br>• 可以设置默认记录（当位置不匹配时使用）<br><br><strong>Geoproximity</strong>（A 错）：按资源位置路由，可用 bias 调整边界，不是按用户国家精确匹配<br><strong>Latency</strong>（A 错）：按速度，不保证用户访问本国服务器',ww:'Latency 按延迟，不保证地理匹配（A 错）。Geoproximity 按资源位置而非用户国家（B 错）。Multi-Value 是简单负载分散（D 错）。',rule:'用户所在国家 / 地区 / 合规 → Geolocation。资源位置 + 调整流量边界 → Geoproximity。'},

{id:'r53_04',topic:'Route 53',diff:'high',
text:'公司部署了主站点和备用站点。<em>主站点正常时所有流量走主站点；主站点故障时自动切换到备用站点</em>。应使用哪种路由策略？',
en:'A company has a primary site and a backup site. <em>All traffic goes to the primary site when it is healthy; it automatically switches to the backup when the primary fails.</em> Which routing policy should be used?',
ch:['Weighted（权重 99/1）','Latency-based','Simple','Failover'],
ench:['Weighted (weight 99/1)','Latency-based','Simple','Failover'],
ans:3,exp:'<strong>Failover（故障转移路由）</strong>：<br><br>• 专为 <strong>Active-Passive</strong> 架构设计<br>• 必须配合 <strong>Health Check</strong> 使用<br>• Primary 记录挂载 Health Check → 失败时自动切换到 Secondary<br>• Secondary 可以是 S3 静态页面、EC2、ALB 等<br><br>考试场景关键词：<strong>primary/backup、active-passive、主备切换 → Failover</strong>',ww:'Weighted 99/1 仍会有 1% 流量到备用，不是真正的主备（A 错）。Latency 按速度路由（B 错）。Simple 没有健康检查（C 错）。',rule:'主备切换 / Active-Passive / 故障自动转移 → Failover + Health Check。'},

{id:'r53_05',topic:'Route 53',diff:'high',
text:'Route 53 Health Check 无法直接监控私有 VPC 内的资源。公司想用 Health Check 实现 DNS 故障转移，目标是 VPC 私有子网中的 EC2。最佳方案是？',
en:'Route 53 Health Checkers cannot directly access private VPC resources. A company wants DNS failover using Health Checks for an EC2 in a private subnet. What is the best solution?',
ch:['将 EC2 移到公有子网','创建 VPC Peering 连接 Route 53','在 EC2 上创建 CloudWatch Metric + CloudWatch Alarm，再创建监控该 Alarm 的 Route 53 Health Check','不可能实现，Route 53 不支持私有资源'],
ench:['Move EC2 to a public subnet','Create VPC Peering with Route 53','Create a CloudWatch Metric and Alarm for the EC2, then create a Route 53 Health Check that monitors the Alarm','It is not possible — Route 53 does not support private resources'],
ans:2,exp:'<strong>CloudWatch Alarm + Route 53 Health Check</strong> 是标准解决方案：<br><br>① EC2 推送 Metrics 到 <strong>CloudWatch</strong>（在 VPC 内部）<br>② 创建 <strong>CloudWatch Alarm</strong>（如 CPU > 90% 或自定义健康指标）<br>③ 创建 Route 53 Health Check，设置为监控 <strong>CloudWatch Alarm 状态</strong><br>④ Alarm ALARM 状态 → Health Check 失败 → DNS 故障转移<br><br>Route 53 Health Checkers 位于 VPC <strong>外部</strong>，无法直接访问私有 IP（A 可行但破坏架构）',ww:'EC2 移公有子网破坏了私有架构（A 可行但不是最佳）。Route 53 和 VPC Peering 无关（B 错）。D 完全错误，有间接方案。',rule:'私有资源 Health Check → CloudWatch Metric + Alarm → Route 53 Health Check 监控 Alarm。'},

{id:'r53_06',topic:'Route 53',diff:'mid',
text:'运维团队计划在 48 小时后将 <span class="code-inline">api.example.com</span> 的 IP 从旧服务器切换到新服务器。为确保切换后<em>大多数用户能快速看到新 IP</em>，应提前做什么？',
en:'The ops team plans to change the IP of <span class="code-inline">api.example.com</span> in 48 hours. To ensure that <em>most users quickly resolve the new IP after the change</em>, what should be done in advance?',
ch:['切换时将 TTL 调高到 86400（24 小时）','切换前几天将 TTL 调低到 60 秒','在 Route 53 开启 Health Check','不需要任何准备，DNS 会自动更新'],
ench:['Increase TTL to 86400 (24 hours) at switch time','Lower TTL to 60 seconds a few days before the switch','Enable Health Check in Route 53','No preparation needed — DNS updates automatically'],
ans:1,exp:'<strong>提前降低 TTL</strong> 是 DNS 迁移的标准操作：<br><br>• TTL = 客户端和 DNS Resolver 缓存 DNS 结果的时长<br>• 高 TTL（如 86400 秒）= 记录变更后，旧 IP 仍被缓存 24 小时<br>• 提前将 TTL 调低到 60 秒 → 切换后 1 分钟内大多数用户可以解析到新 IP<br>• <strong>TTL 降低需要传播时间</strong>，所以要提前几天操作，而非切换时才改<br><br>切换时才调高 TTL 会让旧 IP 缓存更久（A 错）。',ww:'切换时才调高 TTL 会使旧缓存维持更久（A 错）。Health Check 与 TTL 无关（C 错）。DNS 不会自动绕过 TTL 缓存（D 错）。',rule:'DNS 迁移前 → 提前降低 TTL（如 60 秒）。迁移后稳定再升回高 TTL。'},

{id:'r53_07',topic:'Route 53',diff:'mid',
text:'以下哪个目标<em>不能</em>作为 Route 53 Alias 记录的指向？',
en:'Which of the following targets CANNOT be used as the target of a Route 53 Alias record?',
ch:['Application Load Balancer','Amazon CloudFront Distribution','EC2 实例的 DNS 名称（如 ec2-1-2-3-4.compute.amazonaws.com）','S3 静态网站端点'],
ench:['Application Load Balancer','Amazon CloudFront Distribution','EC2 instance DNS name (e.g. ec2-1-2-3-4.compute.amazonaws.com)','S3 static website endpoint'],
ans:2,exp:'<strong>EC2 DNS 名称不能作为 Alias 记录目标</strong>：<br><br>Alias 记录<strong>支持</strong>的目标：<br>• Elastic Load Balancers（ALB/NLB/CLB）<br>• CloudFront Distributions<br>• API Gateway<br>• Elastic Beanstalk environments<br>• S3 Websites<br>• VPC Interface Endpoints<br>• Global Accelerator<br>• Route 53 record in same Hosted Zone<br><br>❌ <strong>EC2 实例 DNS 名称</strong>不在支持列表中，必须使用 A 记录 + EC2 公网 IP',ww:'ALB、CloudFront、S3 静态网站都是 Alias 的合法目标（A/B/D 均正确，是干扰项）。',rule:'Alias 不能指向 EC2 DNS 名称。EC2 → 用普通 A 记录 + 弹性 IP。'},

{id:'r53_08',topic:'Route 53',diff:'mid',
text:'公司在 AWS VPC 内运行微服务，各服务需要通过域名相互调用（如 <span class="code-inline">payment.internal</span>），但这些域名<em>不应在公网暴露</em>。应使用哪种 Route 53 Hosted Zone 类型？',
en:'A company runs microservices in an AWS VPC. Services need to call each other by domain name (e.g., <span class="code-inline">payment.internal</span>), but these names <em>must not be exposed on the public internet</em>. Which Route 53 Hosted Zone type should be used?',
ch:['Public Hosted Zone（公共托管区）','Private Hosted Zone（私有托管区）绑定到 VPC','为每个服务创建单独的 Route 53 账号','使用 Elastic IP 替代域名'],
ench:['Public Hosted Zone','Private Hosted Zone bound to a VPC','Create separate Route 53 accounts per service','Use Elastic IPs instead of domain names'],
ans:1,exp:'<strong>Private Hosted Zone</strong> 是正确方案：<br><br>• 存储只在 VPC 内部可解析的 DNS 记录<br>• 域名（如 payment.internal）<strong>只能从绑定的 VPC 内部查询</strong><br>• 公网无法解析这些域名，天然隔离<br>• 收费标准：$0.50/月/Hosted Zone（同 Public）<br><br>Public Hosted Zone 的记录对互联网开放，不符合要求（A 错）',ww:'Public Hosted Zone 在公网可见（A 错）。Route 53 是 Account 级别服务，无需多账号（C 错）。Elastic IP 无法替代域名功能（D 错）。',rule:'VPC 内部服务间 DNS 通信 → Private Hosted Zone（绑定 VPC，公网不可见）。'},


{id:'r53_09',topic:'Route 53',diff:'mid',
text:'公司在 us-east-1 和 eu-west-1 各部署了一套应用。希望平时 us-east-1 承接所有流量，但 us-east-1 <em>故障时自动切到 eu-west-1</em>。应使用哪种路由策略？',
en:'A company runs applications in us-east-1 and eu-west-1. All traffic should go to us-east-1 normally, but <em>automatically failover to eu-west-1 when us-east-1 is unhealthy</em>. Which routing policy should be used?',
ch:['Weighted（权重 100/0）','Latency-based','Failover','Geolocation'],
ench:['Weighted (100/0)','Latency-based','Failover','Geolocation'],
ans:2,exp:'<strong>Failover</strong> 是 Active-Passive 主备切换的专用策略：<br><br>• Primary 记录挂载 <strong>Health Check</strong>（必须）<br>• Primary 健康 → 所有流量走 us-east-1<br>• Primary 不健康 → Route 53 自动切换到 Secondary（eu-west-1）<br>• Secondary 记录不需要 Health Check（也可以加）<br><br>Weighted 100/0 虽然平时也能全走主，但无法在故障时自动切换（A 错）。<br>Latency 会根据实测延迟路由，不保证主备逻辑（B 错）。<br>Geolocation 按用户位置，不按健康状态（D 错）。',ww:'Weighted 100/0 没有 Health Check 驱动的自动故障转移（A 错）。Latency 按延迟不按健康（B 错）。Geolocation 按地理位置（D 错）。',rule:'主备切换 / 灾难恢复 → Failover（Active-Passive）+ Health Check 必须配置在 Primary 记录上。'},

{id:'r53_10',topic:'Route 53',diff:'high',
text:'公司同时在多个 AWS Region 运行 Web 服务器，希望 Route 53 <em>返回多个 IP，只返回健康的端点</em>，客户端随机选一个。这不是负载均衡，只是简单的健康过滤。应使用哪种路由策略？',
en:'A company runs web servers in multiple AWS Regions. They want Route 53 to <em>return multiple IPs and only return healthy endpoints</em>. The client randomly picks one. This is not load balancing, just health filtering. Which routing policy?',
ch:['Simple（多值模式）','Weighted','Multi-Value Answer','ALB + Geolocation'],
ench:['Simple (multi-value mode)','Weighted','Multi-Value Answer','ALB + Geolocation'],
ans:2,exp:'<strong>Multi-Value Answer</strong> 符合所有要求：<br><br>• 返回多个记录（最多 8 条）<br>• 可绑定 Health Check，<strong>只返回健康的端点</strong><br>• 客户端从健康列表中随机选一个<br>• 不是真正的负载均衡器，是 DNS 层的多值响应<br><br>Simple 多值模式：可返回多个 IP，但<strong>不支持 Health Check</strong>，无法过滤不健康端点（A 错）。<br>Weighted：按权重分配，不是返回全部让客户端选（B 错）。',ww:'Simple 多值不支持 Health Check（A 错）。Weighted 是按比例路由，不是返回多值（B 错）。ALB 是流量层负载均衡，不是 DNS 多值（D 错）。',rule:'多个健康 IP 供客户端随机选 → Multi-Value。注意：Multi-Value 不能替代 ELB 做真正的负载均衡。'},

{id:'r53_11',topic:'Route 53',diff:'high',
text:'公司需要根据<em>用户来源 IP 段（CIDR）</em>，将不同 ISP 的用户路由到不同的服务器端点，以降低网络传输成本。应使用哪种路由策略？',
en:'A company needs to route users from different ISPs to specific server endpoints based on their <em>source IP CIDR ranges</em>, in order to reduce network transfer costs. Which routing policy should be used?',
ch:['Geolocation','IP-based Routing','Latency-based','Geoproximity'],
ench:['Geolocation','IP-based Routing','Latency-based','Geoproximity'],
ans:1,exp:'<strong>IP-based Routing</strong> 是正确答案：<br><br>• 你预先定义 CIDR 集合（IP 段）和对应的端点映射<br>• Route 53 根据客户端的<strong>实际 IP 地址</strong>来决定路由<br>• 典型场景：特定 ISP 用户 → 与该 ISP 有 Peering 的服务器，减少跨网费用<br>• 也可用于性能优化（某些 IP 段访问特定 Region 更快）<br><br>Geolocation 按国家/大洲，粒度较粗，无法精确到 CIDR（A 错）。<br>Latency 按实测延迟，不能按 IP 段精确控制（C 错）。',ww:'Geolocation 粒度是国家级，不能按 IP 段（A 错）。Latency 不能控制 IP 来源（C 错）。Geoproximity 按资源位置（D 错）。',rule:'按客户端 IP 段（CIDR）路由 → IP-based Routing。场景：ISP 流量分流、降低网络成本。'},

{id:'r53_12',topic:'Route 53',diff:'mid',
text:'公司机房（On-Premises）的 DNS 服务器需要解析 AWS 私有托管区中的域名（如 <span class="code-inline">app.internal.aws</span>）。应该配置哪种 Route 53 Resolver Endpoint？',
en:'An on-premises DNS server needs to resolve domain names in an AWS Private Hosted Zone (e.g., <span class="code-inline">app.internal.aws</span>). Which type of Route 53 Resolver Endpoint should be configured?',
ch:['Outbound Endpoint','Inbound Endpoint','Public Hosted Zone','Route 53 Traffic Flow'],
ench:['Outbound Endpoint','Inbound Endpoint','Public Hosted Zone','Route 53 Traffic Flow'],

/* ═══════════════ QUIZ STATE ═══════════════ */
let qz=null,lastPool=null;
const Store={
  key:'saa_v5',data:{a:{},hist:[]},
  async load(){try{const r=await window.storage.get(this.key);if(r?.value)this.data=JSON.parse(r.value)}catch(e){}},
  async save(){try{await window.storage.set(this.key,JSON.stringify(this.data))}catch(e){}},
  record(id,ok){
    if(!this.data.a[id])this.data.a[id]={t:0,c:0,last:null};
    this.data.a[id].t++;
    if(ok)this.data.a[id].c++;
    this.data.a[id].last=ok;
    this.save();
  },
  saveSession(pool,score,wrongIds){
    if(!this.data.hist)this.data.hist=[];
    this.data.hist.unshift({
      date:new Date().toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}),
      total:pool.length,score,wrongIds:[...wrongIds],
      topics:[...new Set(pool.map(q=>q.topic))]
    });
    if(this.data.hist.length>20)this.data.hist=this.data.hist.slice(0,20);
    this.save();
  },
  get(id){return this.data.a[id]||null},
  topicStats(tp){const qs=QS.filter(q=>q.topic===tp);let done=0,cor=0,tot=0;qs.forEach(q=>{const a=this.data.a[q.id];if(a?.t>0){done++;cor+=a.c;tot+=a.t}});const rate=tot>0?Math.round(cor/tot*100):null;return{count:qs.length,done,cor,tot,rate}},
  overall(){let done=0,cor=0,tot=0;QS.forEach(q=>{const a=this.data.a[q.id];if(a?.t>0){done++;cor+=a.c;tot+=a.t}});return{done,rate:tot>0?Math.round(cor/tot*100):null}},
  wrongs(){return QS.filter(q=>{const a=this.data.a[q.id];return a?.t>0&&a.c<a.t})},
  weakTopics(){
    const topics=[...new Set(QS.map(q=>q.topic))];
    return topics.map(tp=>{const s=this.topicStats(tp);const rate=s.tot>0?Math.round(s.cor/s.tot*100):null;return{tp,rate,done:s.done,count:s.count}}).filter(x=>x.done>0).sort((a,b)=>(a.rate??100)-(b.rate??100));
  },
  async reset(){this.data={a:{},hist:[]};try{await window.storage.delete(this.key)}catch(e){}}
};

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

function go(id,btn){
  document.querySelectorAll('.sb-item').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  else{const m=document.querySelector(`.sb-item[onclick*="'${id}'"]`);if(m)m.classList.add('active')}
  // update mobile nav
  document.querySelectorAll('.mobile-nav-btn').forEach(b=>b.classList.remove('active'));
  const mmap={'home':0,'compare':1,'quiz-home':2,'records':3};
  const mi=mmap[id];if(mi!==undefined){const mb=document.querySelectorAll('.mobile-nav-btn')[mi];if(mb)mb.classList.add('active');}
  const renders={home:pgHome,compare:pgCompare,'quiz-home':pgQuizHome,records:pgRecords,iam:pgIAM,'instance-types':pgInstanceTypes,'security-groups':pgSecurityGroups,purchasing:pgPurchasing,'ec2-network':pgEC2Network,scalability:pgScalability,elb:pgELB,asg:pgASG,ebs:pgEBS,'ebs-types':pgEBSTypes,snapshot:pgSnapshot,istore:pgIStore,efs:pgEFS,ami:pgAMI,rds:pgRDS,elasticache:pgElastiCache,route53:pgRoute53};

}

function updateSbProgress(){
  const ov=Store.overall();
  const pct=QS.length>0?Math.round(ov.done/QS.length*100):0;
  const bar=document.getElementById('sb-pct-bar');
  const txt=document.getElementById('sb-pct-text');
  if(bar)bar.style.width=pct+'%';
  if(txt)txt.textContent=pct+'% · '+ov.done+'/'+QS.length;
  // per-topic rates in sidebar
  const tmap={'IAM':'sp-iam','Security Group':'sp-sg','Load Balancer':'sp-lb','Auto Scaling Group':'sp-asg','EBS':'sp-ebs','扩展性与高可用':'sp-ha','RDS':'sp-rds','ElastiCache':'sp-elasticache','Route 53':'sp-r53'};
  Object.entries(tmap).forEach(([tp,elId])=>{
    const el=document.getElementById(elId);
    if(!el)return;
    const s=Store.topicStats(tp);
    if(s.done>0){el.textContent=' '+s.rate+'%';el.style.cssText='margin-left:auto;font-size:10px;font-weight:700;color:'+(s.rate>=80?'var(--green)':s.rate>=60?'var(--amber)':'var(--red)');}
  });
}

function setExamDate(){
  const d=prompt('设置考试日期（格式：YYYY-MM-DD，如 2025-06-15）：',localStorage.getItem('saa_exam_date')||'');
  if(d){localStorage.setItem('saa_exam_date',d);updateCountdown();}
}

function updateCountdown(){
  const el=document.getElementById('sb-countdown-text');if(!el)return;
  const d=localStorage.getItem('saa_exam_date');
  if(!d){el.textContent='设置考试日期';return;}
  const diff=Math.ceil((new Date(d)-new Date())/(1000*60*60*24));
  if(diff<0)el.textContent='考试已过 — 加油继续！';
  else if(diff===0)el.textContent='⚡ 今天就是考试日！';
  else el.textContent=`距考试还有 ${diff} 天`;
}

/* ═══════════════ QUIZ ENGINE ═══════════════ */
function startQuiz(tp){
  const pool=tp==='all'?QS:QS.filter(q=>q.topic===tp);
  lastPool=pool;beginQuiz(shuffle(pool));
}
function startReview(){const pool=Store.wrongs();if(!pool.length)return;lastPool=pool;beginQuiz(shuffle(pool))}
function beginQuiz(pool){qz={pool,cur:0,score:0,wrongIds:[],done:false,streak:0};renderQuiz();setupKbd();}

function setupKbd(){
  document.onkeydown=function(e){
    if(!qz)return;
    const map={a:0,b:1,c:2,d:3,A:0,B:1,C:2,D:3};
    if(map[e.key]!==undefined&&!qz.done)pickAns(map[e.key]);
    if((e.key==='ArrowRight'||e.key===' ')&&qz.done){e.preventDefault();nextQ();}
  };
}

function renderQuiz(){
  const v=document.getElementById('view');
  v.innerHTML=buildQuizQ();
}

function buildQuizQ(){
  const q=qz.pool[qz.cur];const n=qz.pool.length;
  const pct=Math.round(qz.cur/n*100);
  const streakHtml=qz.streak>=2?`<span style="background:linear-gradient(135deg,#F97316,#E8501A);color:#fff;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700">🔥 ${qz.streak} 连对</span>`:'';
  return`
<div class="qz-header">
  <button class="btn btn-ghost" style="padding:6px 10px;font-size:12px" onclick="go('quiz-home')">← 返回</button>
  <div class="qz-prog-wrap"><div class="qz-prog-fill" id="qpf" style="width:${pct}%"></div></div>
  <span class="qz-label">${qz.cur+1}<span style="color:var(--ink3)">/${n}</span></span>
  ${streakHtml}
  <span class="qz-score">✓ ${qz.score}</span>
</div>
<div class="q-card">
  <div class="q-meta">
    <span class="q-topic">${q.topic}</span>
    <span class="q-diff">${q.diff==='high'?'⚡ 高频考点':q.diff==='mid'?'📋 常见考点':'📗 基础概念'}</span>
    <span style="margin-left:auto;font-size:11px;color:var(--ink3)">题 ${q.id}</span>
  </div>
  <div class="q-text">${q.text}</div>
  ${q.en?`<div style="margin-top:12px;padding:10px 14px;background:var(--surface2);border-radius:8px;border-left:3px solid var(--blue-border);font-size:13.5px;color:var(--ink3);line-height:1.7"><span style="font-size:10px;font-weight:700;background:var(--blue-bg);color:var(--blue);padding:1px 6px;border-radius:3px;margin-right:7px">EN</span>${q.en}</div>`:''}
</div>
<div class="choices" id="choices">
  ${'ABCD'.split('').map((k,i)=>`<div class="choice" data-i="${i}" onclick="pickAns(${i})">
    <span class="ck">${k}</span>
    <div style="flex:1">
      <div>${q.ch[i]}</div>
      ${q.ench&&q.ench[i]?`<div style="font-size:12.5px;color:var(--ink3);margin-top:3px">${q.ench[i]}</div>`:''}
    </div>
  </div>`).join('')}
</div>
<div style="text-align:right;margin-bottom:12px"><span class="kbd-hint">键盘快捷键：<kbd>A</kbd><kbd>B</kbd><kbd>C</kbd><kbd>D</kbd> 选择 · <kbd>→</kbd> 下一题</span></div>
<div class="hidden" id="exp-box"></div>
<div class="btn-row hidden" id="next-row">
  <button class="btn btn-primary" onclick="nextQ()" id="next-btn">下一题 →</button>
  <button class="btn btn-ghost" style="font-size:13px" onclick="go('compare')">📊 查对比表</button>
</div>`;
}

function pickAns(idx){
  if(qz.done)return;qz.done=true;
  const q=qz.pool[qz.cur];const ok=idx===q.ans;
  if(ok){qz.score++;qz.streak=(qz.streak||0)+1;}else{qz.wrongIds.push(q.id);qz.streak=0;}
  Store.record(q.id,ok);
  document.querySelectorAll('.choice').forEach(c=>c.classList.add('disabled'));
  document.querySelector(`.choice[data-i="${idx}"]`).classList.add(ok?'correct':'wrong');
  if(!ok)document.querySelector(`.choice[data-i="${q.ans}"]`).classList.add('reveal');
  const eb=document.getElementById('exp-box');
  eb.className=`exp-box ${ok?'c':'w'}`;
  eb.innerHTML=`<div class="exp-title">${ok?'✓ 答对了！':'✗ 答错了'}</div>
    <div class="exp-body">${q.exp}</div>
    ${!ok&&q.ww?`<div class="why-wrong-box">${q.ww}</div>`:''}
    <div class="exp-rule-box">${q.rule}</div>`;
  eb.classList.remove('hidden');
  const nr=document.getElementById('next-row');nr.classList.remove('hidden');
  document.getElementById('next-btn').textContent=qz.cur<qz.pool.length-1?'下一题 →':'查看结果';
}

function nextQ(){
  qz.cur++;
  if(qz.cur>=qz.pool.length)showResult();
  else{qz.done=false;document.getElementById('view').innerHTML=buildQuizQ();}
}

function showResult(){
  const n=qz.pool.length,pct=Math.round(qz.score/n*100);
  Store.saveSession(qz.pool,qz.score,qz.wrongIds);
  const cls=pct===100?'p':pct>=80?'g':pct>=60?'a':'r';
  const msgs={100:'全部答对！这套题的陷阱对你完全没效果。',80:'非常不错，回顾一下错题解析。',60:'基本掌握，重点复习错题对应知识点。',0:'建议先巩固概念再来做题。'};
  const msg=Object.entries(msgs).reverse().find(([t])=>pct>=Number(t))[1];
  const wrongHtml=qz.wrongIds.length>0?`
    <div style="margin-bottom:20px">
      <div style="font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px">本次答错的题目</div>
      ${qz.wrongIds.map(id=>{const q=QS.find(x=>x.id===id);return`<div class="wi"><span class="wi-t">${q.topic}</span>${q.text.replace(/<[^>]+>/g,'').substring(0,80)}...</div>`}).join('')}
    </div>`:'';
  document.getElementById('view').innerHTML=`
<div class="res-card">
  <div style="font-size:13px;color:var(--ink3);margin-bottom:12px;font-weight:600;text-transform:uppercase;letter-spacing:.8px">${qz.pool[0]?.topic||'练习'} 完成</div>
  <div class="res-num ${cls}">${qz.score}<span style="font-size:32px;opacity:.5"> / ${n}</span></div>
  <div class="res-pct">正确率 <strong style="font-size:20px">${pct}%</strong></div>
  <div style="height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin:14px 40px">
    <div style="width:${pct}%;height:100%;background:${pct===100?'var(--green)':pct>=80?'var(--blue)':pct>=60?'var(--amber)':'var(--red)'};border-radius:4px;transition:width .8s ease"></div>
  </div>
  <div class="res-msg">${msg}</div>
  ${qz.streak>=3?`<div style="margin-top:10px;color:#F97316;font-weight:700">🔥 最高连对 ${qz.streak} 题！</div>`:''}
</div>
${wrongHtml}
<div class="btn-row">
  <button class="btn btn-primary" onclick="beginQuiz(shuffle(lastPool))">↺ 重新作答</button>
  ${qz.wrongIds.length>0?`<button class="btn btn-sec" onclick="beginQuiz(shuffle(qz.wrongIds.map(id=>QS.find(q=>q.id===id)).filter(Boolean)))">📖 只练错题 (${qz.wrongIds.length})</button>`:''}
  <button class="btn btn-sec" onclick="go('compare')">🗺️ 查对比图谱</button>
  <button class="btn btn-ghost" onclick="go('quiz-home')">返回题库</button>
</div>`;
}

function pgSnapshot(){return`${back()}

  <p style="font-size:16px;color:var(--ink2);line-height:1.8">Snapshot 是 EBS 在某一时刻的<strong>完整备份</strong>，存于 S3（AWS 管理）。它是 <strong>Region 级别</strong>的资源，是解决「EBS 绑定 AZ」限制的唯一标准手段。</p>
</div>

  <div class="flow">
    <div class="flow-step"><div class="flow-n">1</div><div class="flow-body">（建议）先 <strong>Stop EC2 或 Detach EBS</strong>，确保数据一致性</div></div>
    <div class="flow-step"><div class="flow-n">2</div><div class="flow-body">对 EBS 创建 <strong>Snapshot</strong>（快照存至 S3，Region 级别）</div></div>
    <div class="flow-step"><div class="flow-n">3</div><div class="flow-body">在目标 AZ，从 Snapshot <strong>Restore（还原）出新 EBS</strong></div></div>
    <div class="flow-step"><div class="flow-n">4</div><div class="flow-body">将新 EBS <strong>挂载到目标 AZ 的 EC2</strong></div></div>

</div>

  <tr><th>功能</th><th>Archive</th><th>Recycle Bin</th><th>Fast Snapshot Restore（FSR）</th></tr>

  <tr><td>保留期</td><td>长期</td><td>1 天 ~ 1 年</td><td>持续启用</td></tr>
  <tr><td>考试关键词</td><td>省钱 + 不急用</td><td>防误删 + 可恢复</td><td>还原后立即全速</td></tr>

function pgIStore(){return`${back()}
<div class="pg-hdr">
  <div class="pg-icon">⚡</div>
  <div class="pg-title">EC2 Instance Store</div>
  <div class="pg-sub">本地物理磁盘 · 极高 IOPS · 临时存储（Ephemeral）</div>
  <div class="pg-tags"><span class="pg-tag" style="background:var(--red-bg);color:var(--red)">Ephemeral</span><span class="pg-tag" style="background:var(--amber-bg);color:var(--amber)">极高 IOPS</span></div>
</div>
<div class="s-card">
  <h3>一句话理解</h3>
  <p style="font-size:16px;color:var(--ink2);line-height:1.8">Instance Store 是<strong>直接连接到宿主机的物理磁盘</strong>，不经过网络，I/O 性能远超 EBS。<strong>代价：Stop 或 Terminate 后数据永久消失，没有办法恢复。</strong></p>
</div>

<div class="s-card" style="background:var(--amber-bg);border-color:var(--amber-border)">
  <h3 style="color:var(--amber)">🏎️ 为什么 Instance Store 比 EBS 快那么多？</h3>
  <div style="font-size:15px;color:var(--ink2);line-height:1.8">
    EBS 是<strong>网络磁盘</strong>，你的数据要先经过网络传输才能读写，哪怕延迟只有几毫秒，对于需要数百万次 IOPS 的场景来说也是巨大的瓶颈。<br><br>
    Instance Store 的磁盘<strong>直接焊在宿主机主板上</strong>，读写数据不走网络，延迟是微秒级的（比 EBS 快 10–100 倍），IOPS 可以达到 EBS 的十几倍。<br><br>
    <strong>代价是什么？</strong> 正因为是物理直连，当这台机器被关机、AWS 把你的实例迁移到别的主机、或者硬件故障时，你对那块磁盘的访问就永久断开了——数据消失。
  </div>
</div>

<div class="s-card">
  <h3>数据生命周期（最重要的规则）</h3>
  <div class="tbl-wrap"><table class="tbl">
  <tr><th>操作</th><th>数据是否保留</th><th>原因</th></tr>
  <tr><td>Reboot（重启）</td><td class="good">✅ 保留</td><td>仍在同一台物理主机上，磁盘未断开</td></tr>
  <tr><td>Stop → Start</td><td class="bad">❌ 丢失</td><td>Stop 后 AWS 可能把实例迁移到另一台物理主机</td></tr>
  <tr><td>Terminate（终止）</td><td class="bad">❌ 永久丢失</td><td>宿主机资源被彻底回收</td></tr>
  <tr><td>硬件故障</td><td class="bad">❌ 丢失</td><td>物理磁盘损坏，AWS 无法救回</td></tr>
  </table></div>
  <div style="background:var(--red-bg);border:1.5px solid var(--red-border);border-radius:var(--r);padding:14px 16px;margin-top:12px;font-size:14px;color:var(--ink2)">
    <strong style="color:var(--red)">💡 Reboot vs Stop 的本质区别：</strong><br>
    Reboot = 重启这台物理机，实例还在原地，Instance Store 磁盘没有断开。<br>
    Stop = 暂停实例，AWS 有权把你的实例「搬家」到另一台物理服务器，Instance Store 就断开了。
  </div>
</div>

<div class="s-card">
  <h3>🎬 什么时候该用 Instance Store？（真实场景）</h3>
  <div style="display:grid;gap:10px">
    <div style="background:var(--green-bg);border:1.5px solid var(--green-border);border-radius:var(--r);padding:14px 16px">
      <div style="font-weight:700;color:var(--green);margin-bottom:6px">✅ 适合：AI/ML 训练的临时数据集</div>
      <div style="font-size:14px;color:var(--ink2);line-height:1.7">训练神经网络时，每个 epoch 都要从磁盘读取大量图片。这些图片在训练开始前从 S3 下载到 Instance Store，训练结束后结果再存回 S3。Instance Store 极高的 IOPS 让数据加载速度大幅提升，训练完后实例可以终止，临时数据自然消失。</div>
    </div>
    <div style="background:var(--green-bg);border:1.5px solid var(--green-border);border-radius:var(--r);padding:14px 16px">
      <div style="font-weight:700;color:var(--green);margin-bottom:6px">✅ 适合：数据库的本地 Buffer Cache</div>
      <div style="font-size:14px;color:var(--ink2);line-height:1.7">MySQL 或 PostgreSQL 有内存缓冲区，Instance Store 可以作为超大型的二级缓存，把热数据存在本地磁盘。即使实例停止缓存消失，下次启动时数据库会自动重建缓存，不影响数据完整性（数据本体在 EBS 或 RDS 上）。</div>
    </div>
    <div style="background:var(--red-bg);border:1.5px solid var(--red-border);border-radius:var(--r);padding:14px 16px">
      <div style="font-weight:700;color:var(--red);margin-bottom:6px">❌ 不适合：用户上传的文件、订单数据、日志</div>
      <div style="font-size:14px;color:var(--ink2);line-height:1.7">任何不能丢失的数据都不能存在 Instance Store。用户上传的图片、订单记录、系统日志——这些都应该存在 EBS、EFS 或 S3，不能依赖 Instance Store。</div>
    </div>
  </div>
</div>

<div class="s-card">

  <tr><td>计费</td><td class="mid">按容量（GB）单独计费</td><td class="good">包含在实例价格内</td></tr>
  <tr><td>适合场景</td><td>数据库、Boot Volume、持久化存储</td><td>Cache、Buffer、临时高 IOPS 处理</td></tr>
  </table></div>
</div>
<div class="s-card">
  <h3>⚠️ 考试高频陷阱</h3>
  ${trapdiv('red','高频','Stop ≠ Reboot：Stop 后 Instance Store 数据丢失','Stop 可能导致实例迁移物理主机，Instance Store 数据消失。只有 Reboot 才保留。这是最容易答错的地方。')}
  ${trapdiv('red','高频','310,000 IOPS → Instance Store，不是 io2','io2 Block Express 最高 256,000 IOPS。题目若给出超过 256K 的 IOPS 需求，只有 Instance Store 能满足。')}
  ${trapdiv('amber','中频','极高 IOPS + 数据可以丢失 → Instance Store','两个关键词一起出现才选 Instance Store。只有"高 IOPS"没有"可以丢失" → 选 io2。只有"可以丢失"没有说 IOPS 超高 → 不一定选 Instance Store。')}
</div>`}

/* ═══════════════ RECORDS PAGE ═══════════════ */
function pgRecords(){
  const ov=Store.overall();
  const hist=Store.data.hist||[];
  const weak=Store.weakTopics();
  const allDone=QS.map(q=>{
    const a=Store.data.a[q.id];
    if(!a||!a.t)return null;
    const rate=Math.round(a.c/a.t*100);
    return{q,rate,t:a.t,c:a.c,last:a.last};
  }).filter(Boolean);
  const neverDone=QS.filter(q=>!Store.data.a[q.id]||Store.data.a[q.id].t===0);

  return`
<div class="pg-hdr">
  <div class="pg-icon">📊</div>
  <div class="pg-title">答题记录</div>
  <div class="pg-sub">所有练习数据跨 session 自动保存，关闭页面后仍然保留</div>
</div>

${ov.done===0?`<div class="s-card" style="text-align:center;padding:40px"><div style="font-size:36px;margin-bottom:12px">📝</div><div style="font-size:16px;color:var(--ink3)">还没有答题记录</div><div style="margin-top:16px"><button class="btn btn-primary" onclick="go('quiz-home')">去做练习题 →</button></div></div>`:`

<div class="g3" style="margin-bottom:20px">
  <div class="s-card" style="text-align:center;padding:20px">
    <div style="font-size:32px;font-weight:700;color:var(--aws)">${ov.done}</div>
    <div style="font-size:13px;color:var(--ink3);margin-top:4px">已练习题数 / ${QS.length}</div>
  </div>
  <div class="s-card" style="text-align:center;padding:20px">
    <div style="font-size:32px;font-weight:700;color:${ov.rate>=80?'var(--green)':ov.rate>=60?'var(--amber)':'var(--red)'}">${ov.rate}%</div>
    <div style="font-size:13px;color:var(--ink3);margin-top:4px">整体正确率</div>
  </div>
  <div class="s-card" style="text-align:center;padding:20px">
    <div style="font-size:32px;font-weight:700;color:var(--blue)">${Store.wrongs().length}</div>
    <div style="font-size:13px;color:var(--ink3);margin-top:4px">当前错题数</div>
  </div>
</div>

${weak.length>0?`<div class="s-card" style="margin-bottom:12px">
  <h3>📉 薄弱主题（正确率从低到高）</h3>
  <div style="display:grid;gap:8px;margin-top:4px">
    ${weak.map(w=>{
      const bar=w.rate??0;
      const col=w.rate>=80?'var(--green)':w.rate>=60?'var(--amber)':'var(--red)';
      return`<div style="display:flex;align-items:center;gap:12px;font-size:14px">
        <span style="min-width:100px;color:var(--ink);font-weight:600">${w.tp}</span>

        </div>
        <span style="min-width:48px;text-align:right;color:${col};font-weight:700">${w.rate??0}%</span>
        <span style="color:var(--ink3);font-size:12px">${w.done}/${w.count} 题</span>
        <button class="btn btn-sec" style="padding:4px 12px;font-size:12px" onclick="startQuiz('${w.tp}')">练习</button>
      </div>`;
    }).join('')}
  </div>
</div>`:''}

${hist.length>0?`<div class="s-card" style="margin-bottom:12px">

  <div style="display:grid;gap:8px;margin-top:4px">
    ${hist.map((h,i)=>{
      const pct=Math.round(h.score/h.total*100);
      const col=pct===100?'var(--green)':pct>=80?'var(--blue)':pct>=60?'var(--amber)':'var(--red)';
      return`<div style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--surface2);border-radius:var(--r);font-size:13px">
        <span style="color:var(--ink3);min-width:88px">${h.date}</span>
        <span style="flex:1;color:var(--ink2)">${h.topics.join(' · ')}</span>
        <span style="font-weight:700;color:${col}">${h.score}/${h.total}</span>
        <span style="background:${col}18;color:${col};padding:2px 8px;border-radius:5px;font-weight:700">${pct}%</span>
        ${h.wrongIds.length>0?`<span style="color:var(--red);font-size:12px">✗ ${h.wrongIds.length} 错</span>`:'<span style="color:var(--green);font-size:12px">✓ 全对</span>'}

<div class="s-card" style="margin-bottom:12px">

    <div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface2);border-radius:var(--r);font-size:13px;cursor:pointer" onclick="go('quiz-home')">
      <span style="width:8px;height:8px;border-radius:50%;background:${last?'var(--green)':'var(--red)'};flex-shrink:0"></span>
      <span style="background:var(--aws-bg);color:var(--aws);font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;flex-shrink:0">${q.topic}</span>
      <span style="flex:1;color:var(--ink2);line-height:1.4">${q.text.replace(/<[^>]+>/g,'').substring(0,60)}...</span>
      <span style="color:var(--ink3);font-size:12px">${c}/${t} 次对</span>
      <span style="font-weight:700;color:${rate>=80?'var(--green)':rate>=60?'var(--amber)':'var(--red)'}">${rate}%</span>
    </div>`).join('')}
    ${neverDone.slice(0,5).map(q=>`
    <div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface2);border-radius:var(--r);font-size:13px;opacity:.5">
      <span style="width:8px;height:8px;border-radius:50%;background:var(--border);flex-shrink:0"></span>
      <span style="background:var(--surface2);color:var(--ink3);font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;border:1px solid var(--border);flex-shrink:0">${q.topic}</span>
      <span style="flex:1;color:var(--ink3)">未作答</span>
    </div>`).join('')}
    ${neverDone.length>5?`<div style="text-align:center;font-size:13px;color:var(--ink3);padding:6px">还有 ${neverDone.length-5} 道题未作答</div>`:''}
  </div>
</div>

<div class="btn-row">
  <button class="btn btn-primary" onclick="go('quiz-home')">继续练习</button>
  ${Store.wrongs().length>0?`<button class="btn btn-sec" onclick="startReview()">📖 复习错题（${Store.wrongs().length}）</button>`:''}
  <button class="btn btn-ghost" onclick="if(confirm('确定清空所有答题记录？'))Store.reset().then(()=>go('records'))">重置记录</button>
</div>
`}`;
}

  <div class="pg-sub">EC2 的「防火墙」· Stateful · 只含 Allow 规则 · Region/VPC 级别</div>
</div>

<div class="s-card">
  <h3>一句话理解</h3>
  <p style="font-size:16px;color:var(--ink2);line-height:1.8">Security Group 就是套在 EC2 外面的<strong>智能防火墙</strong>，控制什么流量可以进来（Inbound）和什么流量可以出去（Outbound）。它<strong>只包含 Allow 规则</strong>，没有 Deny 规则——不在规则里的流量默认全部拒绝。</p>
</div>

<div class="s-card">
  <h3>核心特性</h3>
  <div class="pl">
    <div class="pl-row"><span class="pl-k">规则类型</span><span class="pl-v">只有 <strong>Allow</strong> 规则，无 Deny 规则（不满足任何 Allow = 自动拒绝）</span></div>
    <div class="pl-row"><span class="pl-k">有状态性</span><span class="pl-v"><strong>Stateful（有状态）</strong>：入站被允许 → 响应流量自动出站，无需额外 Outbound 规则</span></div>
    <div class="pl-row"><span class="pl-k">来源类型</span><span class="pl-v">可以引用 IP 地址、IP 段（CIDR），也可以<strong>引用另一个 Security Group</strong></span></div>
    <div class="pl-row"><span class="pl-k">作用范围</span><span class="pl-v">绑定到 <strong>Region / VPC 组合</strong>，不能跨 Region 或跨 VPC 使用</span></div>
    <div class="pl-row"><span class="pl-k">位置</span><span class="pl-v">运行在 EC2 <strong>外部</strong>，流量被拦截时 EC2 自身完全看不到这些请求</span></div>
    <div class="pl-row"><span class="pl-k">附加数量</span><span class="pl-v">一个 EC2 可以附加<strong>多个</strong> Security Group；同一个 SG 可以附加到多个实例</span></div>
    <div class="pl-row"><span class="pl-k">默认 Inbound</span><span class="pl-v"><span class="bad">全部拒绝</span>（需要手动添加规则放行）</span></div>
    <div class="pl-row"><span class="pl-k">默认 Outbound</span><span class="pl-v"><span class="good">全部允许</span>（可以出站访问任何地址）</span></div>
  </div>
</div>

<div class="s-card">
  <h3>SG 规则的组成要素</h3>
  <div class="tbl-wrap"><table class="tbl">
  <tr><th>字段</th><th>含义</th><th>示例</th></tr>
  <tr><td>Type</td><td>协议类型（预设或自定义）</td><td>HTTP、SSH、Custom TCP</td></tr>
  <tr><td>Protocol</td><td>传输层协议</td><td>TCP、UDP、ICMP</td></tr>
  <tr><td>Port Range</td><td>端口号或端口范围</td><td>22、80、443、0-65535</td></tr>
  <tr><td>Source（Inbound）</td><td>允许来自哪里的流量</td><td>0.0.0.0/0（任意 IP）、122.x.x.x/32（单一 IP）、另一个 SG</td></tr>
  </table></div>
</div>

<div class="s-card">
  <h3>必须记住的常用端口</h3>
  <div class="tbl-wrap"><table class="tbl">
  <tr><th>端口</th><th>协议</th><th>用途</th><th>记忆方法</th></tr>
  <tr><td><strong>22</strong></td><td>SSH / SFTP</td><td>登录 Linux EC2 / 安全文件传输</td><td>SSH = 22，最常用</td></tr>
  <tr><td><strong>21</strong></td><td>FTP</td><td>文件传输（不安全）</td><td>21 比 22 小一个</td></tr>
  <tr><td><strong>80</strong></td><td>HTTP</td><td>访问非加密网站</td><td>HTTP = 80</td></tr>
  <tr><td><strong>443</strong></td><td>HTTPS</td><td>访问加密网站</td><td>HTTPS = 443</td></tr>
  <tr><td><strong>3389</strong></td><td>RDP</td><td>登录 Windows EC2（远程桌面）</td><td>RDP = 3389，Windows 专用</td></tr>
  </table></div>
  <div style="background:var(--amber-bg);border:1.5px solid var(--amber-border);border-radius:var(--r);padding:12px 14px;margin-top:12px;font-size:14px;color:var(--ink2)">
    <strong style="color:var(--amber)">💡 SSH vs RDP 的区别：</strong> 登录 Linux → SSH（端口 22）。登录 Windows → RDP（端口 3389）。考试经常考这个。
  </div>
</div>

<div class="s-card">
  <h3>引用其他 Security Group（高级用法）</h3>
  <p style="font-size:15px;color:var(--ink2);line-height:1.8;margin-bottom:12px">Security Group 规则的 Source 可以填另一个 SG，而不是 IP。效果是：<strong>所有附加了该 SG 的实例，无论 IP 如何变化，都自动获得访问权限。</strong></p>
  <div style="background:var(--green-bg);border:1.5px solid var(--green-border);border-radius:var(--r);padding:14px 16px;font-size:14px;color:var(--ink2)">
    <strong style="color:var(--green)">实际场景：</strong> Load Balancer 前面有 ALB，后面有多台 EC2。EC2 的 SG 不用写 ALB 的 IP（ALB IP 会变），而是直接引用 ALB 的 Security Group——这样任何挂在 ALB SG 下的实例都能访问后端 EC2，IP 变了也不影响。
  </div>
</div>

<div class="s-card">
  <h3>⚠️ 考试高频陷阱</h3>
  ${trapdiv('red','高频','Timeout（超时）vs Connection Refused（连接拒绝）','Timeout = 流量被 SG 拦住，EC2 没看到请求。Connection Refused = 流量到了 EC2，但应用没有响应（程序未运行或端口未监听）。这两种错误对应不同的排查方向。')}
  ${trapdiv('red','高频','SG 是 Stateful，NACL 是 Stateless','SG 入站允许 → 响应自动出站。NACL 必须分别设置入站和出站规则（包括临时端口 1024–65535）。')}
  ${trapdiv('amber','中频','SG 在 EC2 外部运作，不是在操作系统内部','流量被 SG 拦截时，EC2 的操作系统完全感知不到这些连接请求。这是 SG 和 OS 防火墙（iptables）的本质区别。')}
  ${trapdiv('amber','中频','建议为 SSH 单独维护一个 Security Group','这样可以精细控制谁能 SSH 进来，不影响其他服务（HTTP/HTTPS）的规则管理。')}
</div>`}

function pgScalability(){return`${back()}

    </div>
    <div style="background:var(--surface);border-radius:var(--r);padding:14px;text-align:center">

  </div>
</div>

<div class="s-card">
  <h3>三者对比一览</h3>
  <div class="tbl-wrap"><table class="tbl">
  <tr><th>概念</th><th>做什么</th><th>EC2 对应方式</th><th>适用场景</th></tr>
  <tr><td><strong>垂直扩展</strong><br><span style="font-size:11px;color:var(--ink3)">Scale Up / Down</span></td><td>增大单台实例的规格<br>t2.micro → t2.xlarge</td><td>换更大的实例类型</td><td>数据库（RDS、ElastiCache）<br>有硬件上限，不能无限扩</td></tr>

  </table></div>
</div>

<div class="s-card">
  <h3>垂直扩展（Vertical Scalability）</h3>
  <p style="font-size:15px;color:var(--ink2);line-height:1.8;margin-bottom:12px">垂直扩展 = 把你的实例换得更大、更强。就像把一个初级员工（t2.micro）换成一个高级员工（t2.large），同一个位置，但能力更强。</p>

    </div>
  </div>
</div>

<div class="s-card">
  <h3>⚠️ 考试高频陷阱</h3>

    <tr><td><strong>ALB（v2）</strong></td><td class="good">支持多个 Listener + 多个 SSL 证书</td><td class="good">使用 SNI 实现多域名</td></tr>
    <tr><td><strong>NLB（v2）</strong></td><td class="good">支持多个 Listener + 多个 SSL 证书</td><td class="good">使用 SNI 实现多域名</td></tr>
  </table></div>

<div class="s-card">

  ${trapdiv('amber','中频','ALB 后面的 EC2 看不到客户端真实 IP','EC2 收到的请求来自 ALB 的私有 IP。要获取客户端真实 IP，需要从 HTTP 请求头 <strong>X-Forwarded-For</strong> 中读取。')}
  ${trapdiv('red','高频','按 URL 路径路由 → ALB，不是 NLB','NLB 工作在 TCP 层，不解析 HTTP 内容，无法做 URL 路由。只有 ALB 支持基于 URL 路径、域名、Query String 的路由。')}
  ${trapdiv('red','高频','需要固定 IP / Elastic IP → NLB，不是 ALB','ALB 只有 DNS 名称，没有固定 IP。需要 IP Whitelisting（白名单）或固定 IP 地址 → 必须用 NLB。')}
  ${trapdiv('red','高频','NLB 的 Target Group 可以是 ALB（Lambda 不行）','NLB → ALB 组合：先用 NLB 得到静态 IP，再用 ALB 做 URL 路由。Lambda 只能作为 ALB 的 Target，NLB 不支持。')}
  ${trapdiv('red','高频','GENEVE / Port 6081 → 唯一答案是 GWLB','考试只要看到 GENEVE 协议或 Port 6081，不用想直接选 Gateway Load Balancer（GWLB）。')}
  ${trapdiv('amber','中频','Cross-Zone：ALB 默认开启/免费；NLB & GWLB 默认关闭/收费','三种 LB 的 Cross-Zone 默认值和费用都不同，是高频考点。CLB 默认关闭但开启后免费。')}
  ${trapdiv('amber','中频','Sticky Sessions 会导致负载不均衡（Load Imbalance）','Sticky Sessions 的副作用：某些实例被绑定了大流量客户端，导致负载不均。开启时需权衡。')}
  ${trapdiv('amber','中频','健康检查不返回 200 → 实例被踢出流量，但实例本身还在运行','LB 不会关闭不健康的实例，只是停止向其发流量。需要 ASG 等机制来替换故障实例。')}
</div>`}

      <div style="background:var(--amber-bg);border:2px solid var(--amber);color:var(--amber);padding:7px 12px;border-radius:8px;font-weight:600">是否在冷却期？<br>Default Cooldown?</div>

        <div style="display:flex;align-items:center;gap:4px"><span style="color:var(--green);font-weight:700">No →</span><div style="background:var(--red-bg);border:1px solid var(--red-border);color:var(--red);padding:5px 10px;border-radius:6px;font-weight:600">执行：Launch / Terminate</div></div>
        <div style="display:flex;align-items:center;gap:4px"><span style="color:var(--red);font-weight:700">Yes →</span><div style="background:var(--surface);border:1px solid var(--border);color:var(--ink3);padding:5px 10px;border-radius:6px">忽略 Ignore Action</div></div>
      </div>
    </div>
  </div>
</div>

<div class="s-card">
  <h3>四种 Scaling Policy 一眼对比</h3>
  <div class="tbl-wrap"><table class="tbl">
    <tr><th>策略</th><th>触发方式</th><th>响应延迟</th><th>配置难度</th><th>最适合场景</th></tr>
    <tr><td><strong>Target Tracking</strong></td><td>目标指标自动维持</td><td class="good">快（持续调整）</td><td class="good">⭐ 最简单</td><td>不规律动态负载（<strong>首选</strong>）</td></tr>
    <tr><td><strong>Simple / Step</strong></td><td>CloudWatch Alarm</td><td class="mid">中（等Alarm触发）</td><td class="mid">⭐⭐⭐</td><td>需精细控制扩缩步长</td></tr>
    <tr><td><strong>Scheduled</strong></td><td>固定时间计划</td><td class="good">提前，零延迟</td><td class="mid">⭐⭐</td><td>已知时间规律的高峰</td></tr>
    <tr><td><strong>Predictive</strong></td><td>ML 预测历史负载</td><td class="good">提前，自动学习</td><td class="good">⭐⭐ 配好即自动</td><td>周期性规律 + 不想手动配置</td></tr>
  </table></div>
</div>

<div class="s-card">
  <h3>⚠️ 考试高频陷阱</h3>
  ${trapdiv('red','高频','ASG 本身免费，Launch Configurations 已废弃','ASG 是 free service，你只为 EC2 实例付费。旧版 Launch Configurations 已 Deprecated → 考试选 <strong>Launch Template</strong>。')}
  ${trapdiv('red','高频','ELB Health Check 失败 → ASG 终止实例并重建','只用 EC2 Status Check 检测不到应用崩溃。生产环境必须配 <strong>ELB Health Check</strong> 才能实现应用级别自愈。')}
  ${trapdiv('red','高频','Cooldown 默认 300 秒，期间忽略所有扩缩 Alarm','冷却期内 ASG 不会执行任何新的扩缩动作，即使 CloudWatch Alarm 多次触发也会被忽略。')}
  ${trapdiv('red','高频','缩短 Cooldown 的方法 → 使用 Ready-to-use AMI','预装好所有软件的 AMI 让新实例启动更快 → 更快处理流量 → 指标更快稳定 → 可以设置更短的冷却期。')}
  ${trapdiv('amber','中频','RequestCountPerTarget 需要搭配 ALB','这个指标由 ALB 提供，NLB 没有。如果题目说"按每实例请求数扩缩" → ALB + ASG + RequestCountPerTarget。')}
  ${trapdiv('amber','中频','Scale In 默认终止策略：最老配置 + AZ 平衡','ASG 优先终止启动配置最老的实例，并选择实例最多的 AZ 中的实例，以维持跨 AZ 平衡。')}
  ${trapdiv('amber','中频','Predictive Scaling vs Scheduled Scaling 的区别','Scheduled：你手动指定时间和容量。Predictive：AWS ML 自动分析历史 pattern，自动预测并调度——更智能，但需要足够的历史数据。')}
</div>`}

function switchTab(id,btn){

}
