text:'关于 Auto Scaling Group（ASG），以下哪项描述<em>最完整准确</em>？',
en:'Which statement BEST describes an Auto Scaling Group (ASG)?',
ch:['ASG 是一种付费服务，按实例数量计费','ASG 自动增减 EC2 实例数量以匹配负载变化，保证运行在 Min～Max 范围内，并可与 Load Balancer 集成，不健康实例自动替换','ASG 只能用于增加实例，不能减少','ASG 需要手动触发才能扩缩'],
ench:['ASG is a paid service charged per instance count','ASG automatically adds/removes EC2 instances to match load, keeps count between Min~Max, integrates with LB, and replaces unhealthy instances','ASG can only scale out, not in','ASG requires manual triggering to scale'],
ans:1,exp:'Auto Scaling Group 核心能力：① <strong>Scale Out</strong>（增实例）；② <strong>Scale In</strong>（减实例）；③ Min ≤ 实际 ≤ Max 容量保证；④ 新实例自动注册 LB；⑤ <strong>自愈 Self-Healing</strong>（不健康实例被终止并重建）；⑥ <strong>免费</strong>（只为下面的 EC2 付费）。',ww:'ASG 是免费服务（A 错）。ASG 支持双向扩缩（C 错）。ASG 可以自动触发（D 错）。',rule:'ASG = 自动扩缩 + 自愈 + LB 集成 + 免费服务。'},

{id:'asg_02',topic:'Auto Scaling Group',diff:'high',
text:'ASG 配置了 Min=2、Desired=4、Max=8。流量突然极高，Scale Out 反复触发。最终会运行多少台实例？',
en:'ASG is configured with Min=2, Desired=4, Max=8. Traffic surges and Scale Out triggers repeatedly. What is the maximum number of instances ASG will run?',
ch:['2 台（Min 值）','4 台（Desired 值）','8 台（Max 值）——无论 Scale Out 触发多少次都不会超过','实例数量无限增加直到流量降低'],
ench:['2 (Min)','4 (Desired)','8 (Max) — Scale Out will never exceed this no matter how many times it triggers','Instances keep growing until traffic drops'],
ans:2,exp:'<strong>Maximum Capacity</strong> 是 ASG 的硬性上限，ASG 实例数<strong>永远不会超过 Max</strong>。三个参数关系：<br>• <strong>Min</strong>：再闲也不低于此数<br>• <strong>Desired</strong>：目标数量（会被 Scaling Policy 动态调整）<br>• <strong>Max</strong>：硬性上限，防止费用失控',ww:'Desired 是动态目标值（B 错）。实例数不能无限增加（D 错）。',rule:'ASG 实例数范围：Min ≤ 运行中 ≤ Max。Max 是不可逾越的硬性上限。'},

{id:'asg_03',topic:'Auto Scaling Group',diff:'high',
text:'ASG 中某 EC2 实例的<em>应用层崩溃了</em>（OS 正常，但 Web 服务不响应）。ASG 会如何处理？',
en:'An EC2 instance in an ASG has an <em>application crash</em> (OS running, but web service not responding). What will ASG do?',
ch:['什么都不做——ASG 只检查 EC2 OS 级别的状态','如果配置了 ELB Health Check，LB 标记该实例 Unhealthy，ASG 收到通知后终止并替换该实例','ASG 会自动重启该 EC2 的操作系统','需要手动终止实例后 ASG 才会替换'],
ench:['Nothing — ASG only checks EC2 OS-level status','If ELB Health Check is configured, LB marks it Unhealthy, ASG terminates and replaces it','ASG automatically reboots the EC2 OS','ASG only replaces after you manually terminate it'],
ans:1,exp:'ASG 有两种 Health Check 类型：<br>① <strong>EC2 Status Check（默认）</strong>：只检查 EC2 OS 状态。OS 正常但应用挂了 → ASG 不会检测到。<br>② <strong>ELB Health Check</strong>：LB 发 HTTP 请求检查应用响应。应用不响应 → LB 标记 Unhealthy → 通知 ASG → ASG 终止该实例并重建。<br><br>生产环境最佳实践：使用 <strong>ELB Health Check</strong> 实现应用级别自愈。',ww:'EC2 Status Check 检测不到应用崩溃（A 错）。ASG 是终止并重建，不是重启（C 错）。',rule:'应用级别故障自愈 → 必须配置 ELB Health Check。只用 EC2 Status Check 不够。'},

{id:'asg_04',topic:'Auto Scaling Group',diff:'high',
text:'以下哪项<em>不是</em> ASG Launch Template 的内容？',
en:'Which of the following is NOT part of an ASG Launch Template?',
ch:['AMI ID 和 Instance Type','Security Groups 和 SSH Key Pair','IAM Roles（EC2 访问 AWS 服务的权限）','Scaling Policy（如 Target Tracking）'],
ench:['AMI ID and Instance Type','Security Groups and SSH Key Pair','IAM Roles (for EC2 to access AWS services)','Scaling Policy (e.g., Target Tracking)'],
ans:3,exp:'<strong>Launch Template</strong> = 实例配置蓝图，包含：AMI + Instance Type、User Data、EBS Volumes、Security Groups、SSH Key Pair、IAM Roles、VPC + Subnets、LB Info。<br><br><strong>Scaling Policy</strong> 是 ASG 本身的属性，不在 Launch Template 中。Launch Template 定义"实例长什么样"，Scaling Policy 定义"什么时候扩缩"，两者分别配置。',ww:'Scaling Policy 不属于 Launch Template，是 ASG 级别的独立配置。',rule:'Launch Template = 实例蓝图（怎么长）。Scaling Policy = 扩缩规则（什么时候扩）。分开配置。'},

{id:'asg_05',topic:'Auto Scaling Group',diff:'high',
text:'应用流量有明显规律：<em>每天 9 点激增、18 点后骤降</em>。最适合哪种 Scaling Policy？',
en:'Application traffic has a clear pattern: <em>spikes every day at 9 AM, drops after 6 PM</em>. Which Scaling Policy is most appropriate?',
ch:['Target Tracking Scaling — 设目标 CPU 40%，动态调整','Simple Scaling — CPU > 70% 时加 2 台','Scheduled Scaling — 8:50 AM 提前增加 Min 实例数，18:00 降回','Manual Scaling — 每天手动调整'],
ench:['Target Tracking Scaling — set target CPU 40%, adjust dynamically','Simple Scaling — add 2 instances when CPU > 70%','Scheduled Scaling — increase Min at 8:50 AM in advance, reduce at 18:00','Manual Scaling — adjust manually every day'],
ans:2,exp:'<strong>Scheduled Scaling</strong> 最适合<strong>已知时间规律</strong>的流量：提前扩容，不等 CloudWatch Alarm 触发，避免响应延迟。<br><br>对比：<br>• <strong>Scheduled Scaling</strong>：已知规律提前扩缩（如每天 9 点高峰）<br>• <strong>Target Tracking</strong>：最简单，适合不规律的动态负载（设目标指标，自动维持）<br>• <strong>Simple / Step Scaling</strong>：基于 Alarm 触发，有响应延迟',ww:'有明确时间规律 → Scheduled。没有规律但需要弹性 → Target Tracking。',rule:'已知时间周期性高峰 → Scheduled Scaling（提前扩容）。未知动态负载 → Target Tracking Scaling。'},

{id:'asg_06',topic:'Auto Scaling Group',diff:'high',
text:'SNI（Server Name Indication）解决了什么问题？不支持 SNI 的 AWS 服务是？',
en:'What problem does SNI solve? Which AWS service does NOT support SNI?',
ch:['SNI 解决跨 AZ 证书共享；不支持 NLB','SNI 让一台 LB 可以同时持有多个 SSL 证书服务多个域名；<strong>CLB（v1）不支持</strong>，ALB/NLB/CloudFront 支持','SNI 是一种新的加密算法；所有 AWS LB 都支持','SNI 只用于 HTTP 路由；不支持 GWLB'],
ench:['SNI solves cross-AZ cert sharing; NLB does not support it','SNI lets one LB hold multiple SSL certs for multiple domains; <strong>CLB (v1) does NOT support it</strong> — ALB/NLB/CloudFront do','SNI is a new encryption algorithm; all AWS LBs support it','SNI is only for HTTP routing; GWLB does not support it'],
ans:1,exp:'<strong>SNI（Server Name Indication）</strong>：<br>解决问题：一台 LB 同时服务多个不同域名，每个域名需要不同 SSL 证书。SNI 让客户端在 SSL 握手时告知目标 Hostname，LB 返回对应证书。<br><br>支持：✅ ALB（v2）、✅ NLB（v2）、✅ CloudFront<br>不支持：❌ <strong>CLB（v1）</strong>——每个域名需要单独一个 CLB。',ww:'CLB 不支持 SNI，不是 NLB（A 错）。SNI 不是加密算法（C 错）。',rule:'一个 LB + 多个域名 + 多个 SSL → SNI → ALB 或 NLB。CLB 不支持 SNI。'},

{id:'asg_07',topic:'Auto Scaling Group',diff:'high',
text:'ASG 的 <em>Predictive Scaling</em> 与 Scheduled Scaling 的核心区别是什么？',
en:'What is the key difference between ASG <em>Predictive Scaling</em> and Scheduled Scaling?',
ch:['两者完全相同，都是基于时间规律扩缩','Predictive Scaling 由 AWS ML 自动分析历史负载并预测未来流量，自动调度扩缩；Scheduled Scaling 需要手动指定时间和容量','Predictive Scaling 只适用于 NLB，Scheduled 适用于 ALB','Predictive Scaling 无法与 ASG 一起使用'],
ench:['They are identical — both scale based on time patterns','Predictive Scaling uses AWS ML to analyze historical load and forecast future traffic, auto-scheduling scaling; Scheduled requires manual time/capacity specification','Predictive Scaling only works with NLB; Scheduled works with ALB','Predictive Scaling cannot be used with ASG'],
ans:1,exp:'<strong>Predictive Scaling</strong>：AWS ML 模型<strong>持续分析历史负载</strong> → 生成预测曲线 → 提前自动调度扩缩动作。不需要人工维护时间计划，适合有周期性规律但 pattern 复杂的场景。<br><br><strong>Scheduled Scaling</strong>：你手动指定"在什么时间把 Min 设为多少"。适合简单明确的时间规律（如每天9点、每周五），无需历史数据。<br><br>两者都是"提前"扩缩，区别在于是人工计划还是 ML 自动学习。',ww:'两者不同，Predictive 是 ML 驱动（A 错）。没有 NLB/ALB 限制（C 错）。',rule:'Predictive = AWS ML 自动预测 + 调度。Scheduled = 人工指定时间 + 容量。都是提前扩缩。'},

{id:'asg_08',topic:'Auto Scaling Group',diff:'high',
text:'你的 Web 应用使用 ALB + ASG，想通过扩缩保证<em>每台 EC2 实例处理的请求数保持稳定</em>（不被压垮）。应该用哪个 CloudWatch 指标做 Target Tracking？',
en:'Your web app uses ALB + ASG. You want to ensure <em>each EC2 instance handles a stable number of requests</em>. Which CloudWatch metric should you use for Target Tracking?',
ch:['CPUUtilization — 监控 CPU 使用率','RequestCountPerTarget — 确保每台实例的请求数稳定','Average Network In/Out — 监控网络流量','Any Custom Metric — 使用自定义业务指标'],
ench:['CPUUtilization — monitor CPU usage','RequestCountPerTarget — keep request count per instance stable','Average Network In/Out — monitor network traffic','Any Custom Metric — use a custom business metric'],
ans:1,exp:'<strong>RequestCountPerTarget</strong>：由 <strong>ALB</strong> 提供的指标，表示每台 EC2 实例平均接收到的请求数量。配合 Target Tracking，可以设定每台实例的目标请求数（如 1000 req/target），当请求增加超出目标，ASG 自动 Scale Out 加实例；请求减少时 Scale In。<br><br>适合场景：Web 应用需要保证每台实例不被过载，且搭配 ALB 使用。<br>注意：此指标需要 <strong>ALB</strong> 提供，NLB 没有此指标。',ww:'CPUUtilization 是 CPU 维度（A），不直接反映请求压力。网络流量（C）适合视频等网络密集型应用。自定义指标（D）需要额外开发推送。',rule:'ALB + ASG 场景，保证每实例请求数稳定 → Target Tracking + RequestCountPerTarget。'},

{id:'asg_09',topic:'Auto Scaling Group',diff:'high',
text:'ASG 刚刚完成了一次 Scale Out（新增了 2 台实例）。<em>30 秒后</em> CloudWatch Alarm 再次触发，要求再加实例。ASG 会怎么做？',
en:'ASG just completed a Scale Out (added 2 instances). <em>30 seconds later</em>, CloudWatch Alarm triggers again requesting more instances. What will ASG do?',
ch:['立即再次 Scale Out，加更多实例','忽略这次 Alarm——因为还在默认 300 秒冷却期（Cooldown Period）内','先终止刚加的实例，再重新扩缩','抛出错误，无法在 Scale Out 后立即再次扩缩'],
ench:['Immediately scale out again and add more instances','Ignore this Alarm — still within the default 300-second Cooldown Period','Terminate the recently added instances and rescale','Throw an error — cannot scale immediately after a scale-out'],
ans:1,exp:'<strong>Scaling Cooldown（扩缩冷却期）</strong>默认 <strong>300 秒</strong>。每次扩缩动作完成后进入冷却期，在冷却期内 ASG <strong>忽略所有新的扩缩触发</strong>（无论 CloudWatch Alarm 触发多少次）。<br><br>目的：让新实例启动完毕、指标趋于稳定，避免 ASG 反复快速扩缩（Scaling Thrashing）浪费资源。<br><br>30 秒 &lt; 300 秒冷却期 → 此次 Alarm 被忽略（Ignore Action）。',ww:'冷却期内不会立即再次扩缩（A 错）。冷却期不会终止已加实例（C 错）。',rule:'Cooldown 默认 300 秒。冷却期内 Alarm 触发 → 忽略。缩短冷却 → 使用 Ready-to-use AMI。'},

{id:'asg_10',topic:'Auto Scaling Group',diff:'high',
text:'你的应用 Scale Out 后，新实例需要很长时间初始化才能处理请求，导致 Cooldown 期间指标持续高企。最佳解决方案是什么？',
en:'After Scale Out, new instances take a long time to initialize before serving requests, causing metrics to stay high during the Cooldown period. What is the best solution?',
ch:['增加 Cooldown 时间到 600 秒，给实例更多初始化时间','使用预装好所有依赖和配置的 AMI（Ready-to-use AMI / Golden AMI），让实例更快启动和服务','减少 Min Capacity，让 ASG 不需要频繁扩缩','改用 Scheduled Scaling，避免动态扩缩'],
ench:['Increase Cooldown to 600 seconds to give more initialization time','Use a pre-configured AMI (Ready-to-use AMI / Golden AMI) so instances start and serve faster','Reduce Min Capacity so ASG scales less frequently','Switch to Scheduled Scaling to avoid dynamic scaling'],
ans:1,exp:'<strong>Ready-to-use AMI（Golden AMI）</strong>是最佳实践：将所有软件、配置、依赖提前打包进 AMI，新实例启动后无需再安装配置，可以<strong>立即处理请求</strong>。<br><br>好处链：实例启动更快 → 更快服务流量 → 指标（CPU/请求数）更快回落 → 可以使用更短的 Cooldown → ASG 响应更灵敏。<br><br>增加 Cooldown（A）反而让问题持续更久。减少 Min（C）解决不了初始化慢的问题。',ww:'增加 Cooldown 治标不治本（A 错）。减少 Min 不是解决方案（C 错）。',rule:'实例初始化慢 → 用 Golden AMI（Ready-to-use AMI）预装环境 → 加速启动 + 缩短 Cooldown 需求。'},

/* ── HA & Scalability Quiz (Official Udemy) ── */
{id:'ha_01',topic:'扩展性与高可用',diff:'mid',
text:'将 EC2 实例从 <span class="code-inline">r4.large</span> 升级到 <span class="code-inline">r4.4xlarge</span>，这种操作叫做什么？',
en:'Scaling an EC2 instance from <span class="code-inline">r4.large</span> to <span class="code-inline">r4.4xlarge</span> is called ............',
ch:['Horizontal Scalability（水平扩展）','Vertical Scalability（垂直扩展）'],
ench:['Horizontal Scalability','Vertical Scalability'],
ans:1,exp:'<strong>Vertical Scalability（垂直扩展 / Scale Up）</strong> = 把同一台实例变得更大、更强。<br>r4.large → r4.4xlarge：同一个 r4 家族，只是换了更大的规格（实例数量不变，性能提升）。<br><br>对比：<br>• <strong>Vertical</strong>：1台实例，规格变大（Scale Up / Down）<br>• <strong>Horizontal</strong>：增加实例数量（Scale Out / In），需要 ASG',ww:'Horizontal Scalability 是增加实例数量（加更多台），不是升级单台规格（A 错）。',rule:'单台升规格 = Vertical（垂直）。加台数 = Horizontal（水平）。'},

{id:'ha_02',topic:'扩展性与高可用',diff:'mid',
text:'在 Auto Scaling Group 上运行应用程序，ASG 根据负载自动增减 EC2 实例数量，这叫做什么？',
en:'Running an application on an Auto Scaling Group that scales the number of EC2 instances in and out is called ............',
ch:['Horizontal Scalability（水平扩展）','Vertical Scalability（垂直扩展）'],
ench:['Horizontal Scalability','Vertical Scalability'],
ans:0,exp:'<strong>Horizontal Scalability（水平扩展 / Scale Out&In）</strong> = 增减实例数量。<br>ASG 自动 Scale Out（加实例）和 Scale In（减实例）就是水平扩展的典型实现。<br><br>水平扩展需要应用支持分布式架构，AWS 通过 <strong>Auto Scaling Group + Load Balancer</strong> 来实现。',ww:'Vertical 是换更大规格的单台实例（B 错）。',rule:'ASG 增减实例数量 = Horizontal Scalability。换更大实例规格 = Vertical Scalability。'},

{id:'ha_03',topic:'Load Balancer',diff:'high',
text:'Elastic Load Balancer 提供的是什么？',
en:'Elastic Load Balancers provide a ................',
ch:['可以在应用中直接使用的静态 IPv4 地址','可以在应用中使用的静态 DNS 名称（static DNS name）','可以在应用中直接使用的静态 IPv6 地址'],
ench:['A static IPv4 address we can use in our application','A static DNS name we can use in our application','A static IPv6 address we can use in our application'],
ans:1,exp:'<strong>Elastic Load Balancer 提供的是静态 DNS 名称</strong>，而不是静态 IP 地址。<br><br>关键区分：<br>• <strong>ALB</strong>：只有静态 DNS 名称，没有固定 IP<br>• <strong>NLB</strong>：既有静态 DNS 名称，<strong>也有每个 AZ 的静态 IP</strong>（还可以绑定 Elastic IP）<br>• <strong>CLB</strong>：只有静态 DNS 名称<br><br>AWS 设计 ELB 用 DNS 名称而非 IP，是因为底层基础设施会变化，DNS 能始终指向正确的 endpoint。',ww:'ELB 没有静态 IPv4（A 错）。IPv6 也不是 ELB 提供的主要入口（C 错）。',rule:'ELB 整体提供静态 DNS 名称。只有 NLB 额外提供静态 IP（每 AZ 一个）。'},

{id:'ha_04',topic:'Load Balancer',diff:'high',
text:'你用 ALB + 多台 EC2 搭建了网站。用户反映：在网站页面间跳转时，总是被要求<em>重新认证</em>。你在自己的机器和只有 1 台 EC2 的开发环境中测试，完全正常。这是什么原因？',
en:'Your website is hosted on EC2 instances behind an ALB. Users complain they have to re-authenticate when moving between pages. It works fine on your machine and in Dev with 1 EC2 instance. What is the reason?',
ch:['多台 EC2 实例运行时，网站代码存在问题','EC2 实例因为看不到客户端真实 IP（收到的是 ELB 的 IP），所以注销了用户','ELB 没有开启 Sticky Sessions（粘性会话）'],
ench:['Your website must have an issue when hosted on multiple EC2 instances','The EC2 instances log out users because they receive ELB IP addresses instead of client IPs','The Elastic Load Balancer does not have Sticky Sessions enabled'],
ans:2,exp:'<strong>根本原因：没有开启 Sticky Sessions（粘性会话）</strong><br><br>用户登录后，Session 数据保存在某台 EC2 上。下一次请求被 ALB 路由到另一台 EC2，那台 EC2 没有该用户的 Session，于是要求重新认证。<br><br>单机（1台 EC2）没问题，因为每次请求都到同一台实例。多台 EC2 时，没有 Sticky Sessions 就会出现这个问题。<br><br><strong>解决方案</strong>：<br>① 开启 Sticky Sessions（简单但可能造成负载不均衡）<br>② 更好的方案：用 ElastiCache 或 DynamoDB 集中存储 Session，所有 EC2 共享',ww:'代码没问题，本地和 Dev 都正常（A 错）。客户端 IP 问题不会导致注销（B 错，这是另一个知识点）。',rule:'多实例重新认证问题 → Sticky Sessions 未开启。根本解决方案 → 集中 Session 存储（ElastiCache）。'},

{id:'ha_05',topic:'Load Balancer',diff:'high',
text:'你发现 EC2 实例收到的请求都来自 ALB 的私有 IP。如何获取<em>连接到你网站的客户端真实 IP</em>？',
en:'Your website only sees traffic from ALB\'s private IP addresses. What should you do to get the IP address of clients connected to your website?',
ch:['修改前端，让用户每次请求都带上自己的 IP','修改后端，从 <strong>X-Forwarded-For</strong> 请求头中获取客户端 IP','修改后端，从 X-Forwarded-Port 请求头中获取客户端 IP','修改后端，从 X-Forwarded-Proto 请求头中获取客户端 IP'],
ench:['Modify frontend so users send their IP in every request','Modify backend to get client IP from the <strong>X-Forwarded-For</strong> header','Modify backend to get client IP from the X-Forwarded-Port header','Modify backend to get client IP from the X-Forwarded-Proto header'],
ans:1,exp:'使用 ALB 时，EC2 收到的请求来自 ALB 的私有 IP（因为 ALB 做了 SSL Termination 并重新发起连接）。<br><br>ALB 在转发请求时，会在 HTTP 请求头中额外添加：<br>• <strong>X-Forwarded-For</strong>：客户端真实 IP ← <strong>这个是答案</strong><br>• <strong>X-Forwarded-Port</strong>：客户端的端口号<br>• <strong>X-Forwarded-Proto</strong>：客户端使用的协议（HTTP 或 HTTPS）<br><br>后端只需读取 <code>X-Forwarded-For</code> 请求头即可获取真实客户端 IP。',ww:'X-Forwarded-Port 是端口（C 错）。X-Forwarded-Proto 是协议（D 错）。让用户自己传 IP 不现实也不安全（A 错）。',rule:'ALB 后面获取客户端真实 IP → 读 HTTP Header: X-Forwarded-For。'},

{id:'ha_06',topic:'Load Balancer',diff:'high',
text:'你的网站部署在 ELB 后的 EC2 实例上。发现有些 EC2 实例<em>会周期性崩溃</em>，导致用户有时无法正常使用。如何防止用户连接到已崩溃的实例？',
en:'Some EC2 instances behind your ELB crash from time to time, causing users to sometimes experience issues. What should you do to protect users from connecting to crashing instances?',
ch:['Enable ELB Health Checks（开启健康检查）','Enable ELB Stickiness（开启粘性会话）','Enable SSL Termination（开启 SSL 终止）','Enable Cross-Zone Load Balancing（开启跨区域负载均衡）'],
ench:['Enable ELB Health Checks','Enable ELB Stickiness','Enable SSL Termination','Enable Cross-Zone Load Balancing'],
ans:0,exp:'<strong>ELB Health Checks</strong> 是解决方案：<br><br>ELB 定期向每台实例发送 HTTP 请求（如 /health），如果实例不响应或返回非 200 状态码，ELB 将其标记为 Unhealthy，并<strong>停止向其发送新请求</strong>。<br><br>崩溃的实例无法响应 Health Check → 被标记为 Unhealthy → 流量自动切走 → 用户不再连接到该实例。<br><br>注意：ELB 只是停止发流量，不会关闭实例。需要结合 ASG + ELB Health Check 才能自动终止并替换故障实例。',ww:'Stickiness 是让同一用户总到同一台实例（B 错）。SSL Termination 是加密处理（C 错）。Cross-Zone 是跨 AZ 分流（D 错）。',rule:'防止用户连到崩溃实例 → Enable ELB Health Checks。彻底自愈 → ASG + ELB Health Check。'},

{id:'ha_07',topic:'Load Balancer',diff:'high',
text:'ALB 支持以下协议，<em>除了</em>哪个？（EXCEPT）',
en:'Application Load Balancers support the following protocols, EXCEPT:',
ch:['HTTP','HTTPS','TCP','WebSocket'],
ench:['HTTP','HTTPS','TCP','WebSocket'],
ans:2,exp:'<strong>ALB（Application Load Balancer）支持</strong>：HTTP、HTTPS、WebSocket<br><strong>ALB 不支持</strong>：<strong>TCP</strong>（原始 TCP 协议是 NLB 的专属）<br><br>层级记忆：<br>• ALB = <strong>Layer 7</strong>（应用层）→ 理解 HTTP/HTTPS/WebSocket 的内容<br>• NLB = <strong>Layer 4</strong>（传输层）→ 处理 TCP/TLS/UDP，不解析 HTTP 内容<br>• GWLB = <strong>Layer 3</strong>（网络层）→ IP 包级别<br><br>WebSocket 虽然基于 TCP，但它是应用层协议，ALB 原生支持。',ww:'HTTP（A）、HTTPS（B）、WebSocket（D）都是 ALB 支持的协议。TCP 是 NLB 的领域（C 是答案）。',rule:'ALB = HTTP + HTTPS + WebSocket。TCP/UDP → NLB。考试见 TCP → 答 NLB。'},

{id:'ha_08',topic:'Load Balancer',diff:'high',
text:'ALB 可以根据以下条件路由流量到不同 Target Group，<em>除了</em>哪个？（EXCEPT）',
en:'Application Load Balancers can route traffic to different Target Groups based on the following, EXCEPT:',
ch:['客户端的地理位置（Client\'s Location / Geography）','主机名（Hostname）','请求 URL 路径（Request URL Path）','来源 IP 地址（Source IP Address）'],
ench:['Client\'s Location (Geography)','Hostname','Request URL Path','Source IP Address'],
ans:0,exp:'<strong>ALB 支持的路由规则</strong>：<br>• ✅ <strong>URL Path</strong>（路径）：/users → 用户服务，/search → 搜索服务<br>• ✅ <strong>Hostname</strong>（域名）：one.example.com vs other.example.com<br>• ✅ <strong>HTTP Headers</strong>（请求头）<br>• ✅ <strong>Query String</strong>（查询参数）：?platform=mobile<br>• ✅ <strong>Source IP Address</strong>（来源 IP）<br><br>• ❌ <strong>Client\'s Location / Geography</strong>：ALB <strong>不支持</strong>基于地理位置路由！<br><br>地理位置路由需要用 <strong>Route 53</strong> 的 Geolocation Routing Policy，不是 ALB 的功能。',ww:'Hostname（B）、URL Path（C）、Source IP（D）都是 ALB 支持的路由条件。地理位置（A）是 Route 53 的功能，ALB 不支持。',rule:'ALB 路由：URL Path / Hostname / HTTP Headers / Query String / Source IP。❌ 地理位置 → Route 53。'},

{id:'ha_09',topic:'Load Balancer',diff:'high',
text:'ALB 的 Target Group 中，注册的目标类型可以是以下几种，<em>除了</em>哪个？（EXCEPT）',
en:'Registered targets in a Target Group for an Application Load Balancer can be one of the following, EXCEPT:',
ch:['EC2 Instances','Network Load Balancer（NLB）','Private IP Addresses（私有 IP 地址）','Lambda Functions'],
ench:['EC2 Instances','Network Load Balancer (NLB)','Private IP Addresses','Lambda Functions'],
ans:1,exp:'<strong>ALB Target Group 支持的目标类型</strong>：<br>• ✅ EC2 Instances<br>• ✅ IP Addresses（必须是私有 IP）<br>• ✅ Lambda Functions（HTTP 请求转为 JSON 事件）<br>• ✅ ECS Tasks（容器任务）<br><br>• ❌ <strong>Network Load Balancer（NLB）</strong>：ALB 不能以 NLB 作为目标<br><br>注意不要搞反！<strong>NLB 的 Target Group 可以包含 ALB</strong>（NLB→ALB 组合架构，先获得静态IP再做URL路由），但反过来 ALB 不能指向 NLB。',ww:'EC2（A）、Private IP（C）、Lambda（D）都是 ALB Target Group 支持的。NLB 可以指向 ALB，但 ALB 不能指向 NLB（B 是答案）。',rule:'ALB Target Group：EC2 / IP / Lambda / ECS。❌ 不能是 NLB。NLB Target Group 才可以是 ALB。'},

{id:'ha_10',topic:'Load Balancer',diff:'high',
text:'出于合规要求，你需要向终端用户暴露一个<em>固定的静态 IP 地址</em>，让他们可以编写稳定的防火墙规则。应选哪种 ELB？',
en:'For compliance purposes, you need to expose a fixed static IP address to end-users so they can write stable firewall rules. Which Elastic Load Balancer should you choose?',
ch:['Application Load Balancer（附加 Elastic IP）','Network Load Balancer'],
ench:['Application Load Balancer with an Elastic IP attached to it','Network Load Balancer'],
ans:1,exp:'<strong>Network Load Balancer（NLB）</strong> 是唯一能提供固定静态 IP 的 ELB：<br>• 每个 AZ 分配一个<strong>静态 IP 地址（Static IP per AZ）</strong><br>• 还可以绑定 <strong>Elastic IP</strong>（更灵活控制 IP 地址）<br><br>对比：<br>• <strong>ALB / CLB</strong>：只有静态 DNS 名称，<strong>没有固定 IP</strong>，不能绑定 Elastic IP<br><br>合规场景（防火墙规则、IP 白名单）→ 必须用 NLB，因为 ALB 的 IP 会随时变化。',ww:'ALB 没有固定 IP，无法绑定 Elastic IP（A 错）。NLB 才是正确答案。',rule:'需要固定静态 IP 给用户 → NLB（每AZ有静态IP，可绑Elastic IP）。ALB/CLB 只有 DNS 名称，没有固定 IP。'},

{id:'ha_11',topic:'Load Balancer',diff:'high',
text:'你想在 ALB 中创建一个<em>自定义的基于应用的 Cookie（Custom Application-based Cookie）</em>。以下哪个名称可以使用？',
en:'You want to create a custom application-based cookie in your ALB. Which of the following can you use as a cookie name?',
ch:['AWSALBAPP','APPUSERC','AWSALBTG','AWSALB'],
ench:['AWSALBAPP','APPUSERC','AWSALBTG','AWSALB'],
ans:1,exp:'<strong>自定义 Cookie 名称不能使用以下 AWS 保留名称</strong>：<br>• ❌ <strong>AWSALB</strong>（ALB Duration-based Cookie 的保留名）<br>• ❌ <strong>AWSALBAPP</strong>（ALB Application Cookie 的保留名）<br>• ❌ <strong>AWSALBTG</strong>（ALB Target Group Cookie 的保留名）<br>• ❌ <strong>AWSELB</strong>（CLB 的保留名）<br><br>• ✅ <strong>APPUSERC</strong>（不是保留名，可以自由使用）<br><br>记忆规律：以 AWS 开头的 ELB 相关 Cookie 名称都是保留的，自定义名称必须避开这些前缀。',ww:'AWSALBAPP/AWSALBTG/AWSALB 都是 AWS 保留名称，不能用于自定义 Cookie（A/C/D 错）。',rule:'ALB 自定义 Cookie：避开 AWSALB、AWSALBAPP、AWSALBTG 等保留名。用自定义名如 APPUSERC 即可。'},

{id:'ha_12',topic:'Load Balancer',diff:'high',
text:'你有一个 NLB，在 us-east-1 中分配流量。<span class="code-inline">us-east-1b</span> 有 2 台实例，<span class="code-inline">us-east-1e</span> 有 5 台实例。你发现 1b 的实例 CPU 更高，经过调查，流量是<em>均匀分配到两个 AZ</em> 的。如何解决？',
en:'You have a NLB distributing traffic in us-east-1. There are 2 EC2 instances in us-east-1b and 5 in us-east-1e. CPU is higher in us-east-1b instances. Traffic is equally distributed across the two AZs. How do you solve this?',
ch:['Enable Cross-Zone Load Balancing（跨区域负载均衡）','Enable Sticky Sessions（粘性会话）','Enable ELB Health Checks（健康检查）','Enable SSL Termination（SSL 终止）'],
ench:['Enable Cross-Zone Load Balancing','Enable Sticky Sessions','Enable ELB Health Checks','Enable SSL Termination'],
ans:0,exp:'<strong>问题根因：Cross-Zone Load Balancing 未开启</strong><br><br>不开启 Cross-Zone 时，流量被<strong>均匀分到各 AZ</strong>（每个 AZ 各 50%）。但 1b 只有 2 台实例，1e 有 5 台实例，所以：<br>• 1b：50% 流量 ÷ 2台 = <strong>每台 25%</strong><br>• 1e：50% 流量 ÷ 5台 = <strong>每台 10%</strong><br><br>→ 1b 每台实例压力是 1e 的 2.5 倍，CPU 自然更高！<br><br>开启 <strong>Cross-Zone Load Balancing</strong> 后，流量被均匀分配到<strong>所有 AZ 的所有实例</strong>（7台各约14.3%），CPU 压力平衡。<br><br>注意：NLB 的 Cross-Zone 默认关闭，开启后会收费。',ww:'Sticky Sessions 是让同一用户到同一实例（B 错）。Health Checks 是检测健康状态（C 错）。SSL Termination 是加密处理（D 错）。',rule:'各 AZ 实例数量不均 + CPU 不均衡 → 开启 Cross-Zone Load Balancing（均匀分流到所有实例）。'},

{id:'ha_13',topic:'Load Balancer',diff:'high',
text:'ALB 和 NLB 都支持哪个功能，可以在<em>同一个 Listener 上加载多个 SSL 证书</em>？',
en:'Which feature in both ALB and NLB allows you to load multiple SSL certificates on one listener?',
ch:['TLS Termination（TLS 终止）','Server Name Indication（SNI）','SSL Security Policies（SSL 安全策略）','Host Headers（主机头）'],
ench:['TLS Termination','Server Name Indication (SNI)','SSL Security Policies','Host Headers'],
ans:1,exp:'<strong>SNI（Server Name Indication）</strong>让一个 Listener 可以持有<strong>多个 SSL 证书</strong>，服务多个不同域名。<br><br>工作原理：客户端在 SSL 握手时告知目标 Hostname，LB 据此选择正确的证书返回。<br><br>支持 SNI 的 AWS 服务：<br>• ✅ ALB（v2）<br>• ✅ NLB（v2）<br>• ✅ CloudFront<br>• ❌ CLB（v1）—— 不支持 SNI，每个域名需要单独的 CLB<br><br>TLS Termination 是 LB 解密 HTTPS 的功能，不是多证书功能（A 错）。SSL Security Policies 是控制支持哪些 TLS 版本（C 错）。Host Headers 是 ALB 的路由规则之一（D 错）。',ww:'TLS Termination（A）、SSL Security Policies（C）、Host Headers（D）都不是多证书功能。',rule:'一个 Listener 支持多个 SSL 证书服务多域名 → SNI（ALB 和 NLB 都支持，CLB 不支持）。'},

{id:'ha_14',topic:'Auto Scaling Group',diff:'high',
text:'你有 ASG + ALB，配置了使用 ALB Health Checks。一台 EC2 实例刚被 ALB 报告为 Unhealthy（不健康）。ASG 会怎么处理？',
en:'You have ASG + ALB with ALB Health Checks configured. One EC2 instance is reported unhealthy by the ALB. What will the ASG do?',
ch:['ASG 保持实例运行，然后重启其中的应用程序','ASG 将该实例从组中分离（Detach），但保持其运行','ASG 终止（Terminate）该 EC2 实例，并启动新实例替换'],
ench:['The ASG will keep the instance running and re-start the application','The ASG will detach the EC2 instance and leave it running','The ASG will terminate the EC2 instance and launch a new one'],
ans:2,exp:'配置 ASG 使用 <strong>ALB Health Checks</strong> 后，当 ALB 检测到某实例不健康：<br>① ALB 停止向该实例发送流量<br>② ALB 将健康状态报告给 ASG<br>③ ASG <strong>终止（Terminate）该实例</strong><br>④ ASG 自动启动一个新实例替换，维持 Desired Capacity<br><br>ASG <strong>不会</strong>尝试重启应用（A 错）——它不知道是什么应用出了问题。<br>ASG <strong>不会</strong>只是 Detach（B 错）——Detach 是手动操作，自动处理是 Terminate + Replace。<br><br>这就是 ELB + ASG 实现<strong>自愈（Self-Healing）</strong>的机制。',ww:'ASG 不重启应用（A 错）。自动处理是终止并重建，不是分离（B 错）。',rule:'ASG + ALB Health Check：不健康实例 → ASG 自动 Terminate → 启动新实例替换 → 自愈完成。'},

{id:'ha_15',topic:'Load Balancer',diff:'high',
text:'你的 ALB 配置了路由到 3 个 Target Group，分别对应域名：<strong>users.example.com</strong>、<strong>api.external.example.com</strong>、<strong>checkout.example.com</strong>。你需要为每个域名配置 HTTPS。如何配置 ALB？',
en:'Your ALB routes to 3 Target Groups based on hostnames: users.example.com, api.external.example.com, and checkout.example.com. You want HTTPS for each hostname. How do you configure the ALB?',
ch:['使用 HTTP to HTTPS redirect rule（重定向规则）','使用 Security Group SSL Certificate','使用 Server Name Indication（SNI）'],
ench:['Use an HTTP to HTTPS redirect rule','Use a security group SSL certificate','Use Server Name Indication (SNI)'],
ans:2,exp:'<strong>SNI（Server Name Indication）</strong>正是为这种场景设计的——一个 ALB 的同一个 HTTPS Listener，通过 SNI 可以同时持有<strong>多个 SSL 证书</strong>，每个域名对应自己的证书。<br><br>• users.example.com → 证书 A<br>• api.external.example.com → 证书 B<br>• checkout.example.com → 证书 C<br><br>客户端在 SSL 握手时声明目标 Hostname，ALB 自动选择对应证书返回。<br><br>HTTP→HTTPS redirect 是强制跳转协议，不解决多证书问题（A 错）。Security Group 是网络访问控制，和证书无关（B 错）。',ww:'Redirect（A）是协议跳转。Security Group（B）是防火墙，不管证书。',rule:'一个 ALB + 多个域名 + 每个域名需要自己的 SSL 证书 → SNI。'},

{id:'ha_16',topic:'Auto Scaling Group',diff:'high',
text:'ASG 配置了 <em>Desired = 3，Maximum = 3</em>。同时创建了 CloudWatch Alarm：CPU 达到 60% 时触发 Scale Out。应用突然收到大量流量，CPU 升到 80%。会发生什么？',
en:'ASG has Desired=3 and Maximum=3. A CloudWatch Alarm is set to scale out at 60% CPU. The app suddenly gets huge traffic and CPU hits 80%. What will happen?',
ch:['什么都不发生——ASG 不能超过 Maximum Capacity（最大容量）','Desired 增加到 4，Maximum 保持在 3','Desired 增加到 4，Maximum 也增加到 4'],
ench:['Nothing — ASG cannot exceed the Maximum Capacity you configured','The desired capacity will go up to 4 and the maximum capacity will stay at 3','The desired capacity will go up to 4 and the maximum capacity will stay at 4'],
ans:0,exp:'<strong>关键规则：ASG 实例数永远不能超过 Maximum Capacity（最大容量）</strong><br><br>当前配置：Desired = 3，Max = 3<br>CloudWatch Alarm 触发 Scale Out → 想把 Desired 从 3 增加到 4<br><strong>但 Max = 3</strong>，ASG 不允许实例数超过 Max → <strong>什么都不发生</strong><br><br>即使 CPU 再高、Alarm 触发再多次，也无法突破 Maximum Capacity 上限。<br><br>Max 是保护性上限，防止无限扩展导致费用失控。如果想让 Scale Out 成功，必须先把 Max 调整到 &gt; 3（如改为 Max=6）。',ww:'ASG 不能自动修改 Maximum Capacity（B/C 错）。Max 是硬性上限，Alarm 无法突破它。',rule:'当前实例数 = Max 时，即使 Alarm 触发，ASG 也无法 Scale Out。Max 是不可逾越的硬上限。'},

{id:'ha_17',topic:'Auto Scaling Group',diff:'high',
text:'老板让你根据<em>应用每分钟向数据库发出的请求数</em>来扩缩 ASG。应该怎么做？',
en:'Your boss wants you to scale your ASG based on the number of requests per minute your application makes to the database. What should you do?',
ch:['创建 CloudWatch Custom Metric，然后基于该指标创建 CloudWatch Alarm 来触发 ASG 扩缩','礼貌地告诉老板这是不可能实现的','开启 EC2 Detailed Monitoring，然后创建 CloudWatch Alarm'],
ench:['Create a CloudWatch custom metric, then create a CloudWatch Alarm on it to scale your ASG','Politely tell him it\'s impossible','Enable Detailed Monitoring then create a CloudWatch Alarm to scale your ASG'],
ans:0,exp:'CloudWatch <strong>没有内置</strong>的"每分钟数据库请求数"指标（不是标准的 AWS 指标）。<br><br>解决方案：<strong>CloudWatch Custom Metric（自定义指标）</strong><br>① 在应用代码中统计每分钟的数据库请求数<br>② 通过 <strong>CloudWatch PutMetricData API</strong> 将这个指标推送到 CloudWatch<br>③ 基于这个自定义指标创建 CloudWatch Alarm<br>④ Alarm 触发 ASG Scaling Policy<br><br>这完全可以实现——ASG 可以基于任何 CloudWatch 指标扩缩，包括自定义指标（B 错）。Detailed Monitoring 只是让内置 EC2 指标从 5 分钟变成 1 分钟粒度，无法创建新的业务指标（C 错）。',ww:'这是完全可以实现的，不是不可能（B 错）。Detailed Monitoring 不能创建"DB请求数"指标（C 错）。',rule:'需要基于业务自定义指标扩缩 → CloudWatch Custom Metric（PutMetricData） + Alarm + ASG Scaling Policy。'},

{id:'ha_18',topic:'Auto Scaling Group',diff:'high',
text:'应用部署在 ALB + ASG 上。你希望定义 Scaling Policy，确保<em>每台 EC2 实例的平均连接数保持在 1000 左右</em>。应选哪种 Scaling Policy？',
en:'An app is on ALB + ASG. You want a Scaling Policy to ensure the average number of connections per EC2 instance stays around 1000. Which Scaling Policy should you use?',
ch:['Simple Scaling Policy','Step Scaling Policy','Target Tracking Policy（目标追踪策略）','Scheduled Scaling Policy'],
ench:['Simple Scaling Policy','Step Scaling Policy','Target Tracking Policy','Scheduled Scaling Policy'],
ans:2,exp:'<strong>Target Tracking Policy（目标追踪）</strong>完美匹配这个场景：你设定一个目标值（如平均连接数 = 1000），ASG 自动维持在目标附近，自动 Scale Out 或 Scale In。<br><br>具体指标：可以使用 <code class="code-inline">ALBRequestCountPerTarget</code>（ALB 提供），设定目标为每实例 1000 连接。<br><br>对比：<br>• Simple / Step：需要手动设定阈值 + 触发步长，不会"自动维持目标"<br>• Scheduled：基于时间，和连接数无关<br>• Target Tracking：最简单，直接设定目标值，AWS 自动计算扩缩步长',ww:'Simple（A）和 Step（B）需要手动配置 Alarm 和步长，不是"维持目标"。Scheduled（D）是时间驱动。',rule:'想维持某个指标在目标值附近 → Target Tracking Policy（最简单，设目标值即可）。'},

{id:'ha_19',topic:'Load Balancer',diff:'high',
text:'你有 ASG + NLB。应用支持 HTTP 协议，目前 NLB 使用 TCP Health Check。你想<em>迁移到 HTTP Health Check</em>。怎么做？',
en:'You have ASG + NLB. The app supports HTTP. NLB currently uses TCP health checks. You want to migrate to HTTP health checks. What do you do?',
ch:['迁移到 Application Load Balancer（ALB）','直接将 Health Check 修改为 HTTP'],
ench:['Migrate to an Application Load Balancer','Migrate the health check to HTTP'],
ans:1,exp:'<strong>NLB 的 Health Check 支持三种协议：TCP、HTTP 和 HTTPS</strong><br><br>很多人以为 NLB 只支持 TCP 健康检查（因为 NLB 是 Layer 4），但实际上 NLB 的 Target Group Health Check 支持：<br>• TCP<br>• HTTP ← 可以直接改<br>• HTTPS<br><br>因此，不需要迁移到 ALB，直接在 NLB 的 Target Group 配置中，<strong>把 Health Check Protocol 从 TCP 改为 HTTP 即可</strong>。<br><br>这是一个常见的误解——NLB 虽然是 Layer 4 LB，但健康检查协议可以是 HTTP/HTTPS，以更准确地检测应用层是否正常。',ww:'不需要迁移到 ALB（A 错）。NLB 本身就支持 HTTP Health Check，直接改配置即可。',rule:'NLB Health Check 支持：TCP / HTTP / HTTPS（三种）。不需要换 ALB 就能用 HTTP 健康检查。'},

{id:'ha_20',topic:'Load Balancer',diff:'high',
text:'网站部署在 ASG + ALB 上，目前用 HTTP 访问。你已在 ACM 中创建了证书并附加到 ALB。如何<em>强制用户只能用 HTTPS 访问</em>（而不是 HTTP）？',
en:'Website on ASG + ALB. Currently served over HTTP. You created a certificate in ACM and attached it to the ALB. How do you force users to access using HTTPS instead of HTTP?',
ch:['给所有用户发邮件，告知他们改用 HTTPS','配置 ALB 将 HTTP 流量重定向（Redirect）到 HTTPS','配置 DNS 记录将 HTTP 重定向到 HTTPS'],
ench:['Send an email to all customers to use HTTPS instead of HTTP','Configure the Application Load Balancer to redirect HTTP to HTTPS','Configure the DNS record to redirect HTTP to HTTPS'],
ans:1,exp:'<strong>在 ALB 上配置 HTTP → HTTPS Redirect Rule</strong>是正确方案：<br><br>ALB 支持配置 <strong>Listener Rules</strong>，可以将 80 端口（HTTP）的所有请求自动重定向到 443 端口（HTTPS），返回 301/302 重定向响应。用户访问 HTTP → 被 ALB 自动跳转到 HTTPS，无需改动任何代码或 DNS。<br><br>这样配置后：<br>• ALB 80 端口 Listener：收到 HTTP 请求 → 返回 301 重定向到 HTTPS<br>• ALB 443 端口 Listener：处理 HTTPS 请求（使用 ACM 证书）<br><br>发邮件（A）是不可能的方案。DNS 无法做协议级别的重定向（C 错，DNS 只能做域名解析）。',ww:'发邮件完全不现实（A 错）。DNS 不能做 HTTP→HTTPS 的协议重定向（C 错）。',rule:'强制 HTTPS → 在 ALB 配置 HTTP 80 端口 Listener Rule：将所有 HTTP 请求 Redirect 到 HTTPS（301）。'},

/* ── RDS 题目 ── */
{id:'rds_01',topic:'RDS',diff:'high',
text:'一家公司有 RDS MySQL 数据库，<em>需要在不影响写操作的情况下运行报表查询</em>。最合适的方案是？',
en:'A company has an RDS MySQL DB. They need to run reporting queries <em>without affecting write operations</em>. What is the best solution?',
ch:['创建 Multi-AZ 部署，将报表指向 Standby 实例','创建 Read Replica，将报表查询指向它','将 RDS 放在 ALB 后面做水平扩展','升级 RDS 实例到更大规格'],
ench:['Create Multi-AZ deployment and point reporting to Standby','Create a Read Replica and point reporting queries to it','Put RDS behind an ALB for horizontal scaling','Upgrade the RDS instance to a larger size'],
ans:1,exp:'<strong>Read Replica（只读副本）</strong>专为分担读流量设计：<br><br>• 使用 <strong>异步复制</strong>，不影响主实例写入性能<br>• 可以有独立的 Endpoint，应用直接连接 Read Replica 跑报表<br>• 最多可创建 <strong>5 个</strong> Read Replica（MySQL/PostgreSQL）<br><br>Multi-AZ 的 Standby 是 <strong>同步复制的 HA 待机节点</strong>，<strong>不对外提供读服务</strong>，客户端无法连接它查询。这是最高频的考试陷阱。',ww:'Multi-AZ Standby 不可读（A 错）。ALB 不支持数据库连接的负载均衡（C 错）。升级规格不能隔离读写流量（D 错）。',rule:'分担读流量 / 报表查询 → Read Replica（异步，可读）。高可用故障转移 → Multi-AZ（同步，Standby 不可读）。'},

{id:'rds_02',topic:'RDS',diff:'high',
text:'Multi-AZ RDS 部署的主要目的是什么？当主实例发生故障时，<em>自动故障转移大约需要多久</em>？',
en:'What is the main purpose of Multi-AZ RDS? When the primary fails, approximately how long does automatic failover take?',
ch:['提升读取性能，故障转移约 10 秒','提供高可用性，故障转移约 60–120 秒','跨 Region 容灾，故障转移约 5 分钟','降低存储成本，故障转移约 30 秒'],
ench:['Improve read performance, failover ~10 seconds','Provide high availability, failover ~60–120 seconds','Cross-region disaster recovery, failover ~5 minutes','Reduce storage costs, failover ~30 seconds'],
ans:1,exp:'<strong>Multi-AZ 核心目的：高可用性（HA）</strong><br><br>• 主实例在 AZ-A，同步复制到 <strong>Standby</strong> 在 AZ-B<br>• 主实例故障时，AWS 自动将 DNS 切换到 Standby → <strong>约 60–120 秒</strong>完成故障转移<br>• 应用使用同一个 Endpoint（DNS），无需改代码<br>• Standby <strong>不对外提供读服务</strong>，仅作备用<br><br>Multi-AZ 不提升读性能，也不是跨 Region 方案（那是 Read Replica + 跨 Region 复制）。',ww:'Multi-AZ 不提升读性能（A 错）。跨 Region 容灾用 Read Replica Cross-Region（C 错）。不降低成本，反而更贵（D 错）。',rule:'Multi-AZ = HA 高可用（同步复制，Standby 不可读，DNS 自动切换，60–120s 故障转移）。'},

{id:'rds_03',topic:'RDS',diff:'high',
text:'公司需要 EC2 上的应用<em>不使用密码</em>连接 RDS，并要求网络传输加密。应选用什么方案？',
en:'A company needs its EC2 application to connect to RDS <em>without a password</em>, with encrypted network traffic. What should be used?',
ch:['在 RDS 安全组中允许 EC2 的 IP','启用 RDS IAM 数据库身份验证（IAM DB Authentication）','将数据库密码存入 EC2 环境变量','使用 VPC Peering 连接数据库'],
ench:['Allow EC2 IP in RDS security group','Enable RDS IAM Database Authentication','Store DB password in EC2 environment variables','Use VPC Peering to connect to the DB'],
ans:1,exp:'<strong>IAM DB Authentication</strong> 让 EC2 用 IAM Role 生成临时 Token 连接 RDS，无需存储密码：<br><br>• EC2 使用附加的 IAM Role，调用 <code>generate-db-auth-token</code> 获取 <strong>15 分钟有效</strong>的临时 Token<br>• Token 替代密码，通过 <strong>SSL 加密传输</strong>（满足网络加密要求）<br>• 不需要在任何地方存储数据库密码<br>• 支持 MySQL 和 PostgreSQL<br><br>适合场景关键词：<em>无密码、EC2 连 RDS、IAM 托管凭证、临时 Token</em>',ww:'安全组只控制网络访问，不能替代身份验证（A 错）。环境变量存密码是不安全的（C 错）。VPC Peering 是网络连接方案，不涉及身份验证（D 错）。',rule:'EC2 无密码连 RDS → IAM DB Authentication（IAM Role + 临时 Token + SSL）。'},

{id:'rds_04',topic:'RDS',diff:'high',
text:'什么是 <em>RDS Proxy</em>？在什么场景下强烈推荐使用它？',
en:'What is <em>RDS Proxy</em>? In which scenario is it strongly recommended?',
ch:['RDS 的只读副本，用于分担查询负载','管理数据库连接池的代理层，强烈推荐用于 Lambda 访问 RDS','跨 Region 复制 RDS 数据的组件','自动备份 RDS 数据的服务'],
ench:['A read replica for RDS to offload queries','A connection pooling proxy, strongly recommended for Lambda accessing RDS','A component for cross-region RDS replication','A service that automatically backs up RDS data'],
ans:1,exp:'<strong>RDS Proxy</strong> 是全托管的数据库<strong>连接池代理</strong>：<br><br><strong>为什么 Lambda 需要它？</strong><br>• Lambda 是无状态函数，每次调用都会新建数据库连接<br>• 高并发时可能同时有数千个 Lambda，直接连 RDS 会<strong>耗尽连接数</strong>（RDS 连接上限有限）<br>• RDS Proxy 在中间维护连接池，Lambda → Proxy → RDS，大幅减少 RDS 的实际连接数<br><br><strong>额外好处：</strong><br>• 故障转移时间缩短 <strong>66%</strong>（Proxy 自动重定向到新主实例）<br>• 支持 IAM Authentication 和 Secrets Manager<br><br>关键词：<em>Lambda + RDS、连接耗尽、Serverless 访问数据库</em>',ww:'Read Replica 是只读副本不是代理（A 错）。跨 Region 复制是另一功能（C 错）。自动备份是 Automated Backup（D 错）。',rule:'Lambda 访问 RDS → 必用 RDS Proxy（防止连接耗尽，提升故障转移速度）。'},

{id:'rds_05',topic:'RDS',diff:'mid',
text:'Amazon Aurora 相比标准 RDS MySQL/PostgreSQL，最主要的<em>性能和可用性优势</em>是什么？',
en:'Compared to standard RDS MySQL/PostgreSQL, what are Aurora\'s main <em>performance and availability advantages</em>?',
ch:['Aurora 比 RDS 便宜 20%，且不支持 Multi-AZ','Aurora 存储跨 3 个 AZ 6 份副本，性能比 MySQL 快 5x、比 PostgreSQL 快 3x','Aurora 只支持单 AZ 部署，但读写速度更快','Aurora 是 NoSQL 数据库，专为低延迟设计'],
ench:['Aurora is 20% cheaper than RDS and does not support Multi-AZ','Aurora stores 6 copies across 3 AZs, 5x faster than MySQL, 3x faster than PostgreSQL','Aurora only supports single-AZ but with faster read/write','Aurora is a NoSQL DB designed for low latency'],
ans:1,exp:'<strong>Amazon Aurora 核心优势：</strong><br><br>📦 <strong>存储层：</strong><br>• 数据自动跨 <strong>3 个 AZ</strong> 存储 <strong>6 份副本</strong>（2份/AZ）<br>• 4/6 写入成功 = 写入确认；3/6 读取成功 = 读取确认<br>• 自动修复损坏的数据块（Self-Healing）<br><br>⚡ <strong>性能：</strong><br>• 比标准 MySQL <strong>快 5 倍</strong>，比 PostgreSQL <strong>快 3 倍</strong><br>• 存储自动扩展，10GB 起步，最大 <strong>128TB</strong><br><br>🔌 <strong>端点：</strong><br>• Writer Endpoint（主写）<br>• Reader Endpoint（自动负载均衡到所有 Read Replica）<br>• 最多 <strong>15 个</strong> Read Replica（标准 RDS 最多 5 个）',ww:'Aurora 比 RDS 贵约 20%，不是更便宜（A 错）。Aurora 原生支持 Multi-AZ（C 错）。Aurora 是关系型数据库，不是 NoSQL（D 错）。',rule:'Aurora = MySQL/PostgreSQL 兼容 + 6副本3AZ + 5x/3x 性能 + 最多15个 Read Replica + 自动扩展至128TB。'},

{id:'rds_06',topic:'RDS',diff:'high',
text:'一个投票系统在直播期间，EC2 实例向 RDS 高速写入投票数据，<em>数据库无法跟上写入速度</em>。如何解决？',
en:'A voting system during live broadcast: EC2 writes votes to RDS at high speed, <em>the database cannot keep up with write requests</em>. How to fix this?',
ch:['在 RDS 前加 Read Replica 分担写压力','在 RDS 前加 SQS 队列，EC2 写入队列，异步处理写入 RDS','升级 RDS 到 Multi-AZ 部署','给 RDS 加更多 Read Replica'],
ench:['Add Read Replica in front of RDS to offload writes','Add SQS queue in front of RDS; EC2 writes to queue, async writes to RDS','Upgrade RDS to Multi-AZ','Add more Read Replicas to RDS'],
ans:1,exp:'<strong>SQS 队列 + 异步写入</strong> 是解决写入峰值的标准模式：<br><br>• EC2 将投票写入 <strong>SQS 队列</strong>（几乎瞬时完成，不等待 DB）<br>• 后端 Worker（EC2/Lambda）从队列消费，<strong>以数据库能承受的速度</strong>写入 RDS<br>• 峰值流量被队列"削峰填谷"，RDS 不会过载<br><br>这是 SAA 考试非常高频的<strong>解耦（Decoupling）</strong>模式。<br><br>Read Replica 只解决读扩展，对写入瓶颈无效。Multi-AZ 是高可用方案，不提升写入性能。',ww:'Read Replica 只能分担读流量，不能提升写入性能（A 错）。Multi-AZ 是 HA 方案，不解决写入瓶颈（C 错）。更多 Read Replica 同理（D 错）。',rule:'写入瓶颈 → SQS 队列削峰（Decouple）。读取瓶颈 → Read Replica。高可用 → Multi-AZ。'},

/* ── ElastiCache 题目 ── */
{id:'ec_01',topic:'ElastiCache',diff:'high',
text:'需要为 Web 应用实现<em>分布式 Session 管理</em>，要求多个 EC2 实例共享 Session，并支持复杂数据结构。应选用哪种方案？',
en:'Need <em>distributed session management</em> for a web app where multiple EC2 instances share sessions, supporting complex data structures. Which solution?',
ch:['ElastiCache Memcached — 支持复杂数据结构','ElastiCache Redis — 支持复杂数据结构、持久化和 Pub/Sub','RDS MySQL — 将 Session 存入数据库','EC2 本地文件系统存储 Session'],
ench:['ElastiCache Memcached — supports complex data structures','ElastiCache Redis — supports complex data structures, persistence, and Pub/Sub','RDS MySQL — store sessions in database','EC2 local file system to store sessions'],
ans:1,exp:'<strong>Redis vs Memcached 关键区别：</strong><br><br>| 特性 | Redis | Memcached |<br>|------|-------|-----------|<br>| 数据结构 | String/List/Set/Hash/SortedSet | 仅 String |<br>| 持久化 | ✅ AOF/RDB | ❌ |<br>| Pub/Sub | ✅ | ❌ |<br>| 多线程 | ❌ 单线程 | ✅ 多线程 |<br>| Replication | ✅ 主从复制 | ❌ |<br><br>Session 数据通常需要存储对象（Hash），所以选 <strong>Redis</strong>。<br><br>Memcached 适合：纯字符串缓存、需要多线程的极致简单缓存场景。',ww:'Memcached 不支持复杂数据结构（A 错）。RDS 有写入延迟，不适合 Session 高频读写（C 错）。EC2 本地存储无法在多实例间共享（D 错）。',rule:'Session管理/排行榜/复杂结构/持久化/Pub-Sub → Redis。极简缓存/多线程 → Memcached。'},

{id:'ec_02',topic:'ElastiCache',diff:'high',
text:'公司使用 ElastiCache Redis 存储用户 Session。为了实现<em>跨 Region 的灾难恢复</em>，最少运维操作的方案是？',
en:'Company uses ElastiCache Redis for user sessions. For <em>cross-Region DR</em> with least operational effort, what is the best solution?',
ch:['在每个 Region 创建独立 Redis 集群，用 DMS 同步数据','使用 ElastiCache Global Datastore，在其他 Region 创建副本集群','手动拍 Redis 快照并复制到目标 Region，故障时从快照恢复','禁用 Cluster Mode，跨 Region 创建多个复制组'],
ench:['Create separate Redis clusters per region, sync with DMS','Use ElastiCache Global Datastore, create replica clusters in other regions','Manually snapshot Redis and copy to target region, restore when DR needed','Disable Cluster Mode and create multiple replication groups across regions'],
ans:1,exp:'<strong>ElastiCache Global Datastore</strong> 是专为跨 Region 场景设计的全托管方案：<br><br>• 一个主 Region 集群 + 最多 2 个副本 Region 集群<br>• <strong>低延迟跨 Region 复制</strong>（约 1 秒）<br>• 灾难恢复时，将副本 Region 的集群 <strong>Promote 为 Primary</strong><br>• 加密跨 Region 数据传输（满足安全要求）<br>• <strong>最少运维操作</strong>，全托管<br><br>手动快照复制方案（C）可行但运维复杂，且 RPO 较高（最后一次快照到故障时间内的数据会丢失）。',ww:'DMS 方案运维复杂（A 错）。手动快照复制有数据丢失风险且运维繁琐（C 错）。禁用 Cluster Mode 方案同样运维复杂（D 错）。',rule:'ElastiCache 跨 Region 灾难恢复 → Global Datastore（低延迟复制 + Promote + 最少运维）。'},

{id:'ec_03',topic:'ElastiCache',diff:'mid',
text:'一个电商网站数据库压力很大，大量请求是<em>重复读取同一份商品目录</em>。最适合的优化方案是？',
en:'An e-commerce site has heavy DB load. Most requests are <em>repeated reads of the same product catalog</em>. What is the best optimization?',
ch:['将 RDS 升级为 Multi-AZ 部署','在 RDS 前加 ElastiCache，缓存热点商品数据','为 RDS 增加更多 Read Replica','将商品目录迁移到 DynamoDB'],
ench:['Upgrade RDS to Multi-AZ','Add ElastiCache in front of RDS to cache hot product data','Add more Read Replicas to RDS','Migrate product catalog to DynamoDB'],
ans:1,exp:'<strong>ElastiCache 缓存模式（Lazy Loading）：</strong><br><br>1. 应用先查询 ElastiCache → <strong>Cache Hit</strong> → 直接返回，不查 DB<br>2. Cache Miss → 查 RDS → 将结果写入 ElastiCache → 返回给用户<br>3. 下次相同请求 → Cache Hit → 极低延迟<br><br>商品目录是典型的<strong>读多写少</strong>场景，数据变化不频繁，非常适合缓存。可以大幅降低 RDS 负载。<br><br>缓存策略：<br>• <strong>Lazy Loading</strong>：懒加载，有需求才写缓存（最常用）<br>• <strong>Write Through</strong>：写数据库时同步写缓存',ww:'Multi-AZ 是 HA，不降低读取负载（A 错）。Read Replica 有效但 ElastiCache 速度更快（C 可行但不是最优）。迁移到 DynamoDB 改造成本高（D 错）。',rule:'热点数据反复读取 → ElastiCache 缓存（Lazy Loading）。关键词：重复读取/读多写少/降低DB压力。'},

{id:'ec_04',topic:'ElastiCache',diff:'mid',
text:'应用使用 ElastiCache Memcached。随着数据量增长，<em>需要水平扩展缓存容量</em>。Memcached 如何扩展？',
en:'App uses ElastiCache Memcached. As data grows, <em>horizontal scaling of cache capacity</em> is needed. How does Memcached scale?',
ch:['Memcached 不支持水平扩展，必须换 Redis','添加更多 Memcached 节点（多节点集群），数据分片存储','启用 Memcached 主从复制','开启 Memcached Multi-AZ 自动故障转移'],
ench:['Memcached does not support horizontal scaling, must switch to Redis','Add more Memcached nodes (multi-node cluster), data is sharded','Enable Memcached primary-replica replication','Enable Memcached Multi-AZ automatic failover'],
ans:1,exp:'<strong>Memcached 扩展特性：</strong><br><br>✅ <strong>支持多节点水平扩展</strong>：<br>• 添加节点 → 数据通过一致性哈希（Consistent Hashing）分片到不同节点<br>• 总缓存容量 = 所有节点容量之和<br>• 这是 Memcached 相比 Redis 的一个优势（多线程 + 简单水平扩展）<br><br>❌ <strong>Memcached 不支持的：</strong><br>• 没有主从复制<br>• 没有 Multi-AZ 自动故障转移<br>• 节点故障时，该节点上的缓存数据<strong>全部丢失</strong>（无持久化）<br><br>所以 Memcached = <strong>纯缓存，简单粗暴，水平扩展容易，但不可靠</strong>。',ww:'Memcached 支持水平扩展（A 错）。Memcached 没有主从复制功能（C 错）。Memcached 不支持 Multi-AZ（D 错）。',rule:'Memcached 水平扩展 → 加节点 + 数据分片。但无持久化/复制/故障转移。需要这些特性 → 换 Redis。'}
];

let qz=null,lastPool=null;
const Store={
  key:'saa_v5',data:{a:{},hist:[]},
  async load(){try{const r=await window.storage.get(this.key);if(r?.value)this.data=JSON.parse(r.value)}catch(e){}},
  async save(){try{await window.storage.set(this.key,JSON.stringify(this.data))}catch(e){}},
  record(id,ok){
    if(!this.data.a[id])this.data.a[id]={t:0,c:0,last:null};
    this.data.a[id].t++;
    if(ok)this.data.a[id].c++;
    this.data.a[id].last=ok;
    this.save();
  },
  saveSession(pool,score,wrongIds){
    if(!this.data.hist)this.data.hist=[];
    this.data.hist.unshift({
      date:new Date().toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}),
      total:pool.length,score,wrongIds:[...wrongIds],
      topics:[...new Set(pool.map(q=>q.topic))]
    });
    if(this.data.hist.length>20)this.data.hist=this.data.hist.slice(0,20);
    this.save();
  },
  get(id){return this.data.a[id]||null},
  topicStats(tp){const qs=QS.filter(q=>q.topic===tp);let done=0,cor=0,tot=0;qs.forEach(q=>{const a=this.data.a[q.id];if(a?.t>0){done++;cor+=a.c;tot+=a.t}});const rate=tot>0?Math.round(cor/tot*100):null;return{count:qs.length,done,cor,tot,rate}},
  overall(){let done=0,cor=0,tot=0;QS.forEach(q=>{const a=this.data.a[q.id];if(a?.t>0){done++;cor+=a.c;tot+=a.t}});return{done,rate:tot>0?Math.round(cor/tot*100):null}},
  wrongs(){return QS.filter(q=>{const a=this.data.a[q.id];return a?.t>0&&a.c<a.t})},
  weakTopics(){
    const topics=[...new Set(QS.map(q=>q.topic))];
    return topics.map(tp=>{const s=this.topicStats(tp);const rate=s.tot>0?Math.round(s.cor/s.tot*100):null;return{tp,rate,done:s.done,count:s.count}}).filter(x=>x.done>0).sort((a,b)=>(a.rate??100)-(b.rate??100));
  },
  async reset(){this.data={a:{},hist:[]};try{await window.storage.delete(this.key)}catch(e){}}
};

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

function updateSbProgress(){
  const ov=Store.overall();
  const pct=QS.length>0?Math.round(ov.done/QS.length*100):0;
  const bar=document.getElementById('sb-pct-bar');
  const txt=document.getElementById('sb-pct-text');
  if(bar)bar.style.width=pct+'%';
  if(txt)txt.textContent=pct+'% · '+ov.done+'/'+QS.length;
  // per-topic rates in sidebar
  const tmap={'IAM':'sp-iam','Security Group':'sp-sg','Load Balancer':'sp-lb','Auto Scaling Group':'sp-asg','EBS':'sp-ebs','扩展性与高可用':'sp-ha','RDS':'sp-rds','ElastiCache':'sp-elasticache'};
  Object.entries(tmap).forEach(([tp,elId])=>{
    const el=document.getElementById(elId);
    if(!el)return;
    const s=Store.topicStats(tp);
    if(s.done>0){el.textContent=' '+s.rate+'%';el.style.cssText='margin-left:auto;font-size:10px;font-weight:700;color:'+(s.rate>=80?'var(--green)':s.rate>=60?'var(--amber)':'var(--red)');}
  });
}

function setExamDate(){
  const d=prompt('设置考试日期（格式：YYYY-MM-DD，如 2025-06-15）：',localStorage.getItem('saa_exam_date')||'');
  if(d){localStorage.setItem('saa_exam_date',d);updateCountdown();}
}

function updateCountdown(){
  const el=document.getElementById('sb-countdown-text');if(!el)return;
  const d=localStorage.getItem('saa_exam_date');
  if(!d){el.textContent='设置考试日期';return;}
  const diff=Math.ceil((new Date(d)-new Date())/(1000*60*60*24));
  if(diff<0)el.textContent='考试已过 — 加油继续！';
  else if(diff===0)el.textContent='⚡ 今天就是考试日！';
  else el.textContent=`距考试还有 ${diff} 天`;
}

/* ═══════════════ QUIZ ENGINE ═══════════════ */
function startQuiz(tp){
  const pool=tp==='all'?QS:QS.filter(q=>q.topic===tp);
  lastPool=pool;beginQuiz(shuffle(pool));
}
function startReview(){const pool=Store.wrongs();if(!pool.length)return;lastPool=pool;beginQuiz(shuffle(pool))}
function beginQuiz(pool){qz={pool,cur:0,score:0,wrongIds:[],done:false,streak:0};renderQuiz();setupKbd();}

function setupKbd(){
  document.onkeydown=function(e){
    if(!qz)return;
    const map={a:0,b:1,c:2,d:3,A:0,B:1,C:2,D:3};
    if(map[e.key]!==undefined&&!qz.done)pickAns(map[e.key]);
    if((e.key==='ArrowRight'||e.key===' ')&&qz.done){e.preventDefault();nextQ();}
  };
}

function renderQuiz(){
  const v=document.getElementById('view');
  v.innerHTML=buildQuizQ();
}

function buildQuizQ(){
  const q=qz.pool[qz.cur];const n=qz.pool.length;
  const pct=Math.round(qz.cur/n*100);
  const streakHtml=qz.streak>=2?`<span style="background:linear-gradient(135deg,#F97316,#E8501A);color:#fff;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700">🔥 ${qz.streak} 连对</span>`:'';
  return`
<div class="qz-header">
  <button class="btn btn-ghost" style="padding:6px 10px;font-size:12px" onclick="go('quiz-home')">← 返回</button>
  <div class="qz-prog-wrap"><div class="qz-prog-fill" id="qpf" style="width:${pct}%"></div></div>
  <span class="qz-label">${qz.cur+1}<span style="color:var(--ink3)">/${n}</span></span>
  ${streakHtml}
  <span class="qz-score">✓ ${qz.score}</span>
</div>
<div class="q-card">
  <div class="q-meta">
    <span class="q-topic">${q.topic}</span>
    <span class="q-diff">${q.diff==='high'?'⚡ 高频考点':q.diff==='mid'?'📋 常见考点':'📗 基础概念'}</span>
    <span style="margin-left:auto;font-size:11px;color:var(--ink3)">题 ${q.id}</span>
  </div>
  <div class="q-text">${q.text}</div>
  ${q.en?`<div style="margin-top:12px;padding:10px 14px;background:var(--surface2);border-radius:8px;border-left:3px solid var(--blue-border);font-size:13.5px;color:var(--ink3);line-height:1.7"><span style="font-size:10px;font-weight:700;background:var(--blue-bg);color:var(--blue);padding:1px 6px;border-radius:3px;margin-right:7px">EN</span>${q.en}</div>`:''}
</div>
<div class="choices" id="choices">
  ${'ABCD'.split('').map((k,i)=>`<div class="choice" data-i="${i}" onclick="pickAns(${i})">
    <span class="ck">${k}</span>
    <div style="flex:1">
      <div>${q.ch[i]}</div>
      ${q.ench&&q.ench[i]?`<div style="font-size:12.5px;color:var(--ink3);margin-top:3px">${q.ench[i]}</div>`:''}
    </div>
  </div>`).join('')}
</div>
<div style="text-align:right;margin-bottom:12px"><span class="kbd-hint">键盘快捷键：<kbd>A</kbd><kbd>B</kbd><kbd>C</kbd><kbd>D</kbd> 选择 · <kbd>→</kbd> 下一题</span></div>
<div class="hidden" id="exp-box"></div>
<div class="btn-row hidden" id="next-row">
  <button class="btn btn-primary" onclick="nextQ()" id="next-btn">下一题 →</button>
  <button class="btn btn-ghost" style="font-size:13px" onclick="go('compare')">📊 查对比表</button>
</div>`;
}

function pickAns(idx){
  if(qz.done)return;qz.done=true;
  const q=qz.pool[qz.cur];const ok=idx===q.ans;
  if(ok){qz.score++;qz.streak=(qz.streak||0)+1;}else{qz.wrongIds.push(q.id);qz.streak=0;}
  Store.record(q.id,ok);
  document.querySelectorAll('.choice').forEach(c=>c.classList.add('disabled'));
  document.querySelector(`.choice[data-i="${idx}"]`).classList.add(ok?'correct':'wrong');
  if(!ok)document.querySelector(`.choice[data-i="${q.ans}"]`).classList.add('reveal');
  const eb=document.getElementById('exp-box');
  eb.className=`exp-box ${ok?'c':'w'}`;
  eb.innerHTML=`<div class="exp-title">${ok?'✓ 答对了！':'✗ 答错了'}</div>
    <div class="exp-body">${q.exp}</div>
    ${!ok&&q.ww?`<div class="why-wrong-box">${q.ww}</div>`:''}
    <div class="exp-rule-box">${q.rule}</div>`;
  eb.classList.remove('hidden');
  const nr=document.getElementById('next-row');nr.classList.remove('hidden');
  document.getElementById('next-btn').textContent=qz.cur<qz.pool.length-1?'下一题 →':'查看结果';
}

function nextQ(){
  qz.cur++;
  if(qz.cur>=qz.pool.length)showResult();
  else{qz.done=false;document.getElementById('view').innerHTML=buildQuizQ();}
}

function showResult(){
  const n=qz.pool.length,pct=Math.round(qz.score/n*100);
  Store.saveSession(qz.pool,qz.score,qz.wrongIds);
  const cls=pct===100?'p':pct>=80?'g':pct>=60?'a':'r';
  const msgs={100:'全部答对！这套题的陷阱对你完全没效果。',80:'非常不错，回顾一下错题解析。',60:'基本掌握，重点复习错题对应知识点。',0:'建议先巩固概念再来做题。'};
  const msg=Object.entries(msgs).reverse().find(([t])=>pct>=Number(t))[1];
  const wrongHtml=qz.wrongIds.length>0?`
    <div style="margin-bottom:20px">
      <div style="font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px">本次答错的题目</div>
      ${qz.wrongIds.map(id=>{const q=QS.find(x=>x.id===id);return`<div class="wi"><span class="wi-t">${q.topic}</span>${q.text.replace(/<[^>]+>/g,'').substring(0,80)}...</div>`}).join('')}
    </div>`:'';
  document.getElementById('view').innerHTML=`
<div class="res-card">
  <div style="font-size:13px;color:var(--ink3);margin-bottom:12px;font-weight:600;text-transform:uppercase;letter-spacing:.8px">${qz.pool[0]?.topic||'练习'} 完成</div>
  <div class="res-num ${cls}">${qz.score}<span style="font-size:32px;opacity:.5"> / ${n}</span></div>
  <div class="res-pct">正确率 <strong style="font-size:20px">${pct}%</strong></div>
  <div style="height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin:14px 40px">
    <div style="width:${pct}%;height:100%;background:${pct===100?'var(--green)':pct>=80?'var(--blue)':pct>=60?'var(--amber)':'var(--red)'};border-radius:4px;transition:width .8s ease"></div>
  </div>
  <div class="res-msg">${msg}</div>
  ${qz.streak>=3?`<div style="margin-top:10px;color:#F97316;font-weight:700">🔥 最高连对 ${qz.streak} 题！</div>`:''}
</div>
${wrongHtml}
<div class="btn-row">
  <button class="btn btn-primary" onclick="beginQuiz(shuffle(lastPool))">↺ 重新作答</button>
  ${qz.wrongIds.length>0?`<button class="btn btn-sec" onclick="beginQuiz(shuffle(qz.wrongIds.map(id=>QS.find(q=>q.id===id)).filter(Boolean)))">📖 只练错题 (${qz.wrongIds.length})</button>`:''}
  <button class="btn btn-sec" onclick="go('compare')">🗺️ 查对比图谱</button>
  <button class="btn btn-ghost" onclick="go('quiz-home')">返回题库</button>
</div>`;
}

Step 3: 检查 Allow → 若有对应 Allow，结果 = Allow
Step 4: 否则 → Deny（Implicit Deny）

⚠️  有 Explicit Deny = 无论 Allow 多宽泛，都被否决

有效权限 = Identity Policy  ∩  Permission Boundary  ∩  SCP</div>

  ])}
</div>`}

  <div class="pg-tags"><span class="pg-tag" style="background:var(--red-bg);color:var(--red)">Ephemeral</span><span class="pg-tag" style="background:var(--amber-bg);color:var(--amber)">极高 IOPS</span></div>
</div>
<div class="s-card">
  <h3>一句话理解</h3>
  <p style="font-size:16px;color:var(--ink2);line-height:1.8">Instance Store 是<strong>直接连接到宿主机的物理磁盘</strong>，不经过网络，I/O 性能远超 EBS。<strong>代价：Stop 或 Terminate 后数据永久消失，没有办法恢复。</strong></p>
</div>

<div class="s-card" style="background:var(--amber-bg);border-color:var(--amber-border)">
  <h3 style="color:var(--amber)">🏎️ 为什么 Instance Store 比 EBS 快那么多？</h3>
  <div style="font-size:15px;color:var(--ink2);line-height:1.8">
    EBS 是<strong>网络磁盘</strong>，你的数据要先经过网络传输才能读写，哪怕延迟只有几毫秒，对于需要数百万次 IOPS 的场景来说也是巨大的瓶颈。<br><br>
    Instance Store 的磁盘<strong>直接焊在宿主机主板上</strong>，读写数据不走网络，延迟是微秒级的（比 EBS 快 10–100 倍），IOPS 可以达到 EBS 的十几倍。<br><br>
    <strong>代价是什么？</strong> 正因为是物理直连，当这台机器被关机、AWS 把你的实例迁移到别的主机、或者硬件故障时，你对那块磁盘的访问就永久断开了——数据消失。
  </div>
</div>

<div class="s-card">
  <h3>数据生命周期（最重要的规则）</h3>
  <div class="tbl-wrap"><table class="tbl">
  <tr><th>操作</th><th>数据是否保留</th><th>原因</th></tr>
  <tr><td>Reboot（重启）</td><td class="good">✅ 保留</td><td>仍在同一台物理主机上，磁盘未断开</td></tr>
  <tr><td>Stop → Start</td><td class="bad">❌ 丢失</td><td>Stop 后 AWS 可能把实例迁移到另一台物理主机</td></tr>
  <tr><td>Terminate（终止）</td><td class="bad">❌ 永久丢失</td><td>宿主机资源被彻底回收</td></tr>
  <tr><td>硬件故障</td><td class="bad">❌ 丢失</td><td>物理磁盘损坏，AWS 无法救回</td></tr>
  </table></div>
  <div style="background:var(--red-bg);border:1.5px solid var(--red-border);border-radius:var(--r);padding:14px 16px;margin-top:12px;font-size:14px;color:var(--ink2)">
    <strong style="color:var(--red)">💡 Reboot vs Stop 的本质区别：</strong><br>
    Reboot = 重启这台物理机，实例还在原地，Instance Store 磁盘没有断开。<br>
    Stop = 暂停实例，AWS 有权把你的实例「搬家」到另一台物理服务器，Instance Store 就断开了。
  </div>
</div>

<div class="s-card">
  <h3>🎬 什么时候该用 Instance Store？（真实场景）</h3>
  <div style="display:grid;gap:10px">
    <div style="background:var(--green-bg);border:1.5px solid var(--green-border);border-radius:var(--r);padding:14px 16px">
      <div style="font-weight:700;color:var(--green);margin-bottom:6px">✅ 适合：AI/ML 训练的临时数据集</div>
      <div style="font-size:14px;color:var(--ink2);line-height:1.7">训练神经网络时，每个 epoch 都要从磁盘读取大量图片。这些图片在训练开始前从 S3 下载到 Instance Store，训练结束后结果再存回 S3。Instance Store 极高的 IOPS 让数据加载速度大幅提升，训练完后实例可以终止，临时数据自然消失。</div>
    </div>
    <div style="background:var(--green-bg);border:1.5px solid var(--green-border);border-radius:var(--r);padding:14px 16px">
      <div style="font-weight:700;color:var(--green);margin-bottom:6px">✅ 适合：数据库的本地 Buffer Cache</div>
      <div style="font-size:14px;color:var(--ink2);line-height:1.7">MySQL 或 PostgreSQL 有内存缓冲区，Instance Store 可以作为超大型的二级缓存，把热数据存在本地磁盘。即使实例停止缓存消失，下次启动时数据库会自动重建缓存，不影响数据完整性（数据本体在 EBS 或 RDS 上）。</div>
    </div>
    <div style="background:var(--red-bg);border:1.5px solid var(--red-border);border-radius:var(--r);padding:14px 16px">
      <div style="font-weight:700;color:var(--red);margin-bottom:6px">❌ 不适合：用户上传的文件、订单数据、日志</div>
      <div style="font-size:14px;color:var(--ink2);line-height:1.7">任何不能丢失的数据都不能存在 Instance Store。用户上传的图片、订单记录、系统日志——这些都应该存在 EBS、EFS 或 S3，不能依赖 Instance Store。</div>
    </div>
  </div>
</div>

<div class="s-card">
  <h3>EBS vs Instance Store 核心区别</h3>
  <div class="tbl-wrap"><table class="tbl">
  <tr><th>对比项</th><th>EBS</th><th>Instance Store</th></tr>
  <tr><td>Stop 后数据</td><td class="good">保留</td><td class="bad">丢失</td></tr>
  <tr><td>最大 IOPS</td><td class="mid">256,000（io2 Block Express）</td><td class="good">数百万（i3.16xlarge 达 330 万）</td></tr>
  <tr><td>延迟</td><td class="mid">毫秒级（网络）</td><td class="good">微秒级（物理直连）</td></tr>
  <tr><td>备份方式</td><td class="good">Snapshot（AWS 托管）</td><td class="bad">自行负责，无原生备份</td></tr>
  <tr><td>计费</td><td class="mid">按容量（GB）单独计费</td><td class="good">包含在实例价格内</td></tr>
  <tr><td>适合场景</td><td>数据库、Boot Volume、持久化存储</td><td>Cache、Buffer、临时高 IOPS 处理</td></tr>
  </table></div>
</div>
<div class="s-card">
  <h3>⚠️ 考试高频陷阱</h3>
  ${trapdiv('red','高频','Stop ≠ Reboot：Stop 后 Instance Store 数据丢失','Stop 可能导致实例迁移物理主机，Instance Store 数据消失。只有 Reboot 才保留。这是最容易答错的地方。')}
  ${trapdiv('red','高频','310,000 IOPS → Instance Store，不是 io2','io2 Block Express 最高 256,000 IOPS。题目若给出超过 256K 的 IOPS 需求，只有 Instance Store 能满足。')}
  ${trapdiv('amber','中频','极高 IOPS + 数据可以丢失 → Instance Store','两个关键词一起出现才选 Instance Store。只有"高 IOPS"没有"可以丢失" → 选 io2。只有"可以丢失"没有说 IOPS 超高 → 不一定选 Instance Store。')}
</div>`}

function pgSecurityGroups(){return`${back()}
<div class="pg-hdr">
  <div class="pg-icon">🛡️</div>
  <div class="pg-title">Security Groups</div>
  <div class="pg-sub">EC2 的「防火墙」· Stateful · 只含 Allow 规则 · Region/VPC 级别</div>
</div>

<div class="s-card">
  <h3>一句话理解</h3>
  <p style="font-size:16px;color:var(--ink2);line-height:1.8">Security Group 就是套在 EC2 外面的<strong>智能防火墙</strong>，控制什么流量可以进来（Inbound）和什么流量可以出去（Outbound）。它<strong>只包含 Allow 规则</strong>，没有 Deny 规则——不在规则里的流量默认全部拒绝。</p>
</div>

<div class="s-card">
  <h3>核心特性</h3>
  <div class="pl">
    <div class="pl-row"><span class="pl-k">规则类型</span><span class="pl-v">只有 <strong>Allow</strong> 规则，无 Deny 规则（不满足任何 Allow = 自动拒绝）</span></div>
    <div class="pl-row"><span class="pl-k">有状态性</span><span class="pl-v"><strong>Stateful（有状态）</strong>：入站被允许 → 响应流量自动出站，无需额外 Outbound 规则</span></div>
    <div class="pl-row"><span class="pl-k">来源类型</span><span class="pl-v">可以引用 IP 地址、IP 段（CIDR），也可以<strong>引用另一个 Security Group</strong></span></div>
    <div class="pl-row"><span class="pl-k">作用范围</span><span class="pl-v">绑定到 <strong>Region / VPC 组合</strong>，不能跨 Region 或跨 VPC 使用</span></div>
    <div class="pl-row"><span class="pl-k">位置</span><span class="pl-v">运行在 EC2 <strong>外部</strong>，流量被拦截时 EC2 自身完全看不到这些请求</span></div>
    <div class="pl-row"><span class="pl-k">附加数量</span><span class="pl-v">一个 EC2 可以附加<strong>多个</strong> Security Group；同一个 SG 可以附加到多个实例</span></div>
    <div class="pl-row"><span class="pl-k">默认 Inbound</span><span class="pl-v"><span class="bad">全部拒绝</span>（需要手动添加规则放行）</span></div>
    <div class="pl-row"><span class="pl-k">默认 Outbound</span><span class="pl-v"><span class="good">全部允许</span>（可以出站访问任何地址）</span></div>
  </div>
</div>

<div class="s-card">
  <h3>SG 规则的组成要素</h3>
  <div class="tbl-wrap"><table class="tbl">
  <tr><th>字段</th><th>含义</th><th>示例</th></tr>
  <tr><td>Type</td><td>协议类型（预设或自定义）</td><td>HTTP、SSH、Custom TCP</td></tr>
  <tr><td>Protocol</td><td>传输层协议</td><td>TCP、UDP、ICMP</td></tr>
  <tr><td>Port Range</td><td>端口号或端口范围</td><td>22、80、443、0-65535</td></tr>
  <tr><td>Source（Inbound）</td><td>允许来自哪里的流量</td><td>0.0.0.0/0（任意 IP）、122.x.x.x/32（单一 IP）、另一个 SG</td></tr>
  </table></div>
</div>

<div class="s-card">
  <h3>必须记住的常用端口</h3>
  <div class="tbl-wrap"><table class="tbl">
  <tr><th>端口</th><th>协议</th><th>用途</th><th>记忆方法</th></tr>
  <tr><td><strong>22</strong></td><td>SSH / SFTP</td><td>登录 Linux EC2 / 安全文件传输</td><td>SSH = 22，最常用</td></tr>
  <tr><td><strong>21</strong></td><td>FTP</td><td>文件传输（不安全）</td><td>21 比 22 小一个</td></tr>
  <tr><td><strong>80</strong></td><td>HTTP</td><td>访问非加密网站</td><td>HTTP = 80</td></tr>
  <tr><td><strong>443</strong></td><td>HTTPS</td><td>访问加密网站</td><td>HTTPS = 443</td></tr>
  <tr><td><strong>3389</strong></td><td>RDP</td><td>登录 Windows EC2（远程桌面）</td><td>RDP = 3389，Windows 专用</td></tr>
  </table></div>
  <div style="background:var(--amber-bg);border:1.5px solid var(--amber-border);border-radius:var(--r);padding:12px 14px;margin-top:12px;font-size:14px;color:var(--ink2)">
    <strong style="color:var(--amber)">💡 SSH vs RDP 的区别：</strong> 登录 Linux → SSH（端口 22）。登录 Windows → RDP（端口 3389）。考试经常考这个。
  </div>
</div>

<div class="s-card">
  <h3>引用其他 Security Group（高级用法）</h3>
  <p style="font-size:15px;color:var(--ink2);line-height:1.8;margin-bottom:12px">Security Group 规则的 Source 可以填另一个 SG，而不是 IP。效果是：<strong>所有附加了该 SG 的实例，无论 IP 如何变化，都自动获得访问权限。</strong></p>
  <div style="background:var(--green-bg);border:1.5px solid var(--green-border);border-radius:var(--r);padding:14px 16px;font-size:14px;color:var(--ink2)">
    <strong style="color:var(--green)">实际场景：</strong> Load Balancer 前面有 ALB，后面有多台 EC2。EC2 的 SG 不用写 ALB 的 IP（ALB IP 会变），而是直接引用 ALB 的 Security Group——这样任何挂在 ALB SG 下的实例都能访问后端 EC2，IP 变了也不影响。
  </div>
</div>

<div class="s-card">
  <h3>⚠️ 考试高频陷阱</h3>
  ${trapdiv('red','高频','Timeout（超时）vs Connection Refused（连接拒绝）','Timeout = 流量被 SG 拦住，EC2 没看到请求。Connection Refused = 流量到了 EC2，但应用没有响应（程序未运行或端口未监听）。这两种错误对应不同的排查方向。')}
  ${trapdiv('red','高频','SG 是 Stateful，NACL 是 Stateless','SG 入站允许 → 响应自动出站。NACL 必须分别设置入站和出站规则（包括临时端口 1024–65535）。')}
  ${trapdiv('amber','中频','SG 在 EC2 外部运作，不是在操作系统内部','流量被 SG 拦截时，EC2 的操作系统完全感知不到这些连接请求。这是 SG 和 OS 防火墙（iptables）的本质区别。')}
  ${trapdiv('amber','中频','建议为 SSH 单独维护一个 Security Group','这样可以精细控制谁能 SSH 进来，不影响其他服务（HTTP/HTTPS）的规则管理。')}
</div>`}

</div>

<div class="s-card">

<div class="s-card">
  <h3>SSL/TLS 基础</h3>

  </div>

    <div class="pl-row"><span class="pl-k">协议说明</span><span class="pl-v"><strong>SSL</strong>（Secure Sockets Layer）是老版本；<strong>TLS</strong>（Transport Layer Security）是现代版本。现在实际用 TLS，但口语上仍叫 SSL，考试中两者等价</span></div>
    <div class="pl-row"><span class="pl-k">证书类型</span><span class="pl-v">LB 使用 <strong>X.509 Certificate</strong>（即 SSL/TLS Server Certificate）</span></div>
    <div class="pl-row"><span class="pl-k">证书管理</span><span class="pl-v"><strong>ACM（AWS Certificate Manager）</strong>：托管 + 自动续期；也可以上传自己的证书</span></div>
    <div class="pl-row"><span class="pl-k">有效期</span><span class="pl-v">SSL Certificate 有过期日期（Expiration Date），必须定期更新（Renew）</span></div>
    <div class="pl-row"><span class="pl-k">HTTPS Listener</span><span class="pl-v">必须指定一个默认证书（Default Certificate）；可添加多个证书支持多域名；客户端用 <strong>SNI</strong> 指明要访问哪个域名</span></div>
    <div class="pl-row"><span class="pl-k">SSL Termination</span><span class="pl-v">LB 处理 HTTPS → 内网用 HTTP 传给 EC2（用户↔LB 是加密的，LB↔EC2 是私网 HTTP）</span></div>
  </div>
</div>

<div class="s-card">

  <div style="background:var(--amber-bg);border:1.5px solid var(--amber-border);border-radius:var(--r);padding:14px 16px;margin-bottom:14px;font-size:14px;color:var(--ink2);line-height:1.85">

  </div>
  <div class="pl">
    <div class="pl-row"><span class="pl-k">解决什么问题</span><span class="pl-v">让<strong>一台服务器（或 LB）同时挂载多个 SSL 证书</strong>，服务多个不同域名的网站</span></div>

    <tr><td><strong>ALB（v2）</strong></td><td class="good">支持多个 Listener + 多个 SSL 证书</td><td class="good">使用 SNI 实现多域名</td></tr>
    <tr><td><strong>NLB（v2）</strong></td><td class="good">支持多个 Listener + 多个 SSL 证书</td><td class="good">使用 SNI 实现多域名</td></tr>
  </table></div>
</div>

<div class="s-card">
  <h3>⚠️ 考试高频陷阱</h3>
  ${trapdiv('red','高频','CLB 只支持 1 个 SSL 证书，多域名必须用多个 CLB','SNI 不支持 CLB（v1）。如果要在一个 LB 上挂多个域名不同的 SSL 证书 → 必须用 ALB 或 NLB（它们支持 SNI）。CLB 每个域名得单独一个 LB。')}
  ${trapdiv('amber','中频','ALB 后面的 EC2 看不到客户端真实 IP','EC2 收到的请求来自 ALB 的私有 IP。要获取客户端真实 IP，需要从 HTTP 请求头 <strong>X-Forwarded-For</strong> 中读取。')}

  ${trapdiv('red','高频','需要固定 IP / Elastic IP → NLB，不是 ALB','ALB 只有 DNS 名称，没有固定 IP。需要 IP Whitelisting（白名单）或固定 IP 地址 → 必须用 NLB。')}
  ${trapdiv('red','高频','NLB 的 Target Group 可以是 ALB（Lambda 不行）','NLB → ALB 组合：先用 NLB 得到静态 IP，再用 ALB 做 URL 路由。Lambda 只能作为 ALB 的 Target，NLB 不支持。')}
  ${trapdiv('red','高频','GENEVE / Port 6081 → 唯一答案是 GWLB','考试只要看到 GENEVE 协议或 Port 6081，不用想直接选 Gateway Load Balancer（GWLB）。')}
  ${trapdiv('amber','中频','Cross-Zone：ALB 默认开启/免费；NLB & GWLB 默认关闭/收费','三种 LB 的 Cross-Zone 默认值和费用都不同，是高频考点。CLB 默认关闭但开启后免费。')}
  ${trapdiv('amber','中频','Sticky Sessions 会导致负载不均衡（Load Imbalance）','Sticky Sessions 的副作用：某些实例被绑定了大流量客户端，导致负载不均。开启时需权衡。')}
  ${trapdiv('amber','中频','健康检查不返回 200 → 实例被踢出流量，但实例本身还在运行','LB 不会关闭不健康的实例，只是停止向其发流量。需要 ASG 等机制来替换故障实例。')}
</div>`}

      <div class="flow-body">用户请求到达 <strong>Elastic Load Balancer（ELB）</strong></div>
    </div>
    <div class="flow-step">
      <div class="flow-n">2</div>
      <div class="flow-body">ELB 把流量分发到 ASG 内的<strong>所有健康 EC2 实例</strong>（ELB 持续做 Health Check）</div>
    </div>
    <div class="flow-step">
      <div class="flow-n">3</div>
      <div class="flow-body">流量增加 → ASG 触发 Scale Out → 新 EC2 自动启动 → 自动注册到 ELB → 开始接收流量</div>
    </div>
    <div class="flow-step">
      <div class="flow-n">4</div>
      <div class="flow-body">流量减少 → ASG 触发 Scale In → 多余 EC2 被终止 → 从 ELB 自动注销（Deregister）</div>
    </div>
    <div class="flow-step">
      <div class="flow-n">5</div>
      <div class="flow-body">某实例不健康（Health Check 失败）→ ASG 终止该实例 → 在相同 AZ 创建新实例 → 恢复 Desired 数量</div>
    </div>
  </div>
  <div style="background:var(--green-bg);border:1.5px solid var(--green-border);border-radius:var(--r);padding:12px 16px;margin-top:12px;font-size:13.5px;color:var(--ink2)">
    <strong style="color:var(--green)">📌 关键点：</strong> ASG 使用 ELB 的 Health Check 结果来判断实例是否需要替换（不仅仅是 EC2 系统级别的健康）
  </div>
</div>

<div class="s-card">
  <h3>Scaling Policies — 四种扩缩策略</h3>
  <div style="display:grid;gap:10px">

    <div style="border:1.5px solid var(--blue-border);border-radius:var(--r);padding:16px;background:var(--blue-bg)">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        <span style="background:var(--blue);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:5px">① 最常用</span>
        <span style="font-size:15px;font-weight:700;color:var(--blue)">Target Tracking Scaling</span>
      </div>

        例：「I want the average ASG CPU to stay at around 40%」<br>

        <span style="background:var(--surface);border-radius:6px;padding:4px 10px;display:inline-block;margin-top:6px;font-size:12px;color:var(--ink3)">💡 类比：空调恒温模式，设好目标温度，它自动调节</span>

    </div>

    <div style="border:1.5px solid var(--border);border-radius:var(--r);padding:16px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        <span style="background:var(--surface2);color:var(--ink2);font-size:11px;font-weight:700;padding:3px 9px;border-radius:5px;border:1px solid var(--border)">②</span>
        <span style="font-size:15px;font-weight:700">Simple / Step Scaling</span>
      </div>
      <div style="font-size:14px;color:var(--ink2);line-height:1.8">
        基于 <strong>CloudWatch Alarm</strong> 触发，按你定义的规则扩缩：<br>
        • CPU &gt; 70% → Alarm 触发 → 加 2 台实例（Scale Out）<br>
        • CPU &lt; 30% → Alarm 触发 → 减 1 台实例（Scale In）<br>
        <span style="font-size:12px;color:var(--ink3)">Step：超出幅度越大扩越多（分阶梯）；Simple：固定步长</span>
      </div>
    </div>

    <div style="border:1.5px solid var(--amber-border);border-radius:var(--r);padding:16px;background:var(--amber-bg)">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        <span style="background:var(--amber);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:5px">③ 时间规律</span>
        <span style="font-size:15px;font-weight:700;color:var(--amber)">Scheduled Scaling</span>
      </div>
      <div style="font-size:14px;color:var(--ink2);line-height:1.8">
        基于<strong>已知的时间规律</strong>，提前扩缩，不等 Alarm 触发。<br>

        <span style="font-size:12px;color:var(--ink3)">💡 类比：外卖店提前在高峰前备餐，不等订单堆满才开始做</span>
      </div>
    </div>

    <div style="border:1.5px solid var(--purple-bg);border-radius:var(--r);padding:16px;background:var(--purple-bg)">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        <span style="background:var(--purple);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:5px">④ AI预测</span>
        <span style="font-size:15px;font-weight:700;color:var(--purple)">Predictive Scaling</span>

        <div class="g3-sm" style="margin-top:10px">
          <div style="background:var(--surface);border-radius:6px;padding:8px">

          </div>
          <div style="background:var(--surface);border-radius:6px;padding:8px">
            <div style="font-size:16px">🔮</div>
            <div style="font-weight:700;color:var(--ink);margin:2px 0">Forecast</div>
            <div style="color:var(--ink3)">生成预测曲线</div>
          </div>
          <div style="background:var(--surface);border-radius:6px;padding:8px">
            <div style="font-size:16px">⚡</div>
            <div style="font-weight:700;color:var(--ink);margin:2px 0">Schedule</div>
            <div style="color:var(--ink3)">提前扩缩动作</div>
          </div>
        </div>
        <span style="font-size:12px;color:var(--purple);font-weight:600">适合：有周期性规律但 pattern 复杂，懒得手动配 Scheduled Scaling 的场景</span>

<div class="s-card">
  <h3>Good Metrics to Scale On — 扩缩的好指标</h3>
  <p style="font-size:14px;color:var(--ink3);margin-bottom:14px">选对 Metric 是 ASG 精准扩缩的关键。以下是 SAA 考试中最常见的 4 种指标：</p>
  <div class="tbl-wrap"><table class="tbl">
    <tr><th>指标名称</th><th>English Name</th><th>监控的内容</th><th>适合场景</th></tr>
    <tr>
      <td><strong>CPU 使用率</strong></td>
      <td><code class="code-inline">CPUUtilization</code></td>

      <td>最通用，大多数计算密集型应用</td>
    </tr>
    <tr>
      <td><strong>每目标请求数</strong></td>
      <td><code class="code-inline">RequestCountPerTarget</code></td>
      <td>每台 EC2 实例收到的<strong>平均请求数</strong>（由 ALB 提供）</td>
      <td>Web 应用 + ALB 场景，保证每台实例请求数稳定</td>
    </tr>
    <tr>
      <td><strong>网络流量</strong></td>
      <td><code class="code-inline">Average Network In / Out</code></td>
      <td>所有实例的平均<strong>入站/出站网络流量</strong></td>
      <td>应用是 Network Bound（网络密集型），如视频流</td>
    </tr>
    <tr>
      <td><strong>自定义指标</strong></td>
      <td><code class="code-inline">Any Custom Metric</code></td>
      <td>你通过 <strong>CloudWatch PutMetricData</strong> 推送的任意业务指标</td>

  </div>
</div>

<div class="s-card">

  <div style="background:var(--blue-bg);border:1.5px solid var(--blue-border);border-radius:var(--r);padding:14px 16px;margin-bottom:14px;font-size:14px;color:var(--ink2);line-height:1.85">
    <strong style="color:var(--blue)">💡 类比：健身后的冷却时间</strong><br>
    你刚做完剧烈运动（扩缩动作），身体需要时间恢复（指标稳定）再决定下一步。Cooldown 就是让 ASG"等一等"，不要马上再次扩缩。
  </div>
  <div class="pl">
    <div class="pl-row"><span class="pl-k">默认冷却时间</span><span class="pl-v"><strong>300 秒（5 分钟）</strong>—— 每次扩缩动作后进入冷却期</span></div>
    <div class="pl-row"><span class="pl-k">冷却期间行为</span><span class="pl-v">ASG <strong>不会启动或终止</strong>额外的实例（即使 Alarm 再次触发），等待指标稳定后再决策</span></div>
    <div class="pl-row"><span class="pl-k">为什么需要它</span><span class="pl-v">防止 ASG 反复快速扩缩（称为 Scaling Thrashing 或 Flapping），避免浪费资源</span></div>
    <div class="pl-row"><span class="pl-k">如何缩短冷却</span><span class="pl-v">使用<strong>预装好环境的 AMI（Ready-to-use AMI）</strong>——新实例启动更快，更快开始处理请求，指标更快稳定，冷却期可以更短</span></div>
  </div>
  <!-- Cooldown flow diagram -->
  <div style="background:var(--surface2);border-radius:var(--r);padding:14px;margin-top:12px">
    <div style="font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px">冷却期决策流程</div>
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px">
      <div style="background:var(--blue);color:#fff;padding:7px 12px;border-radius:8px;font-weight:600">Scaling Action<br>扩缩动作触发</div>
      <div style="font-size:18px;color:var(--ink3)">→</div>
      <div style="background:var(--amber-bg);border:2px solid var(--amber);color:var(--amber);padding:7px 12px;border-radius:8px;font-weight:600">是否在冷却期？<br>Default Cooldown?</div>
      <div style="display:flex;flex-direction:column;gap:6px;font-size:12px">
        <div style="display:flex;align-items:center;gap:4px"><span style="color:var(--green);font-weight:700">No →</span><div style="background:var(--red-bg);border:1px solid var(--red-border);color:var(--red);padding:5px 10px;border-radius:6px;font-weight:600">执行：Launch / Terminate</div></div>
        <div style="display:flex;align-items:center;gap:4px"><span style="color:var(--red);font-weight:700">Yes →</span><div style="background:var(--surface);border:1px solid var(--border);color:var(--ink3);padding:5px 10px;border-radius:6px">忽略 Ignore Action</div></div>
      </div>
    </div>
  </div>
</div>

<div class="s-card">
  <h3>四种 Scaling Policy 一眼对比</h3>
  <div class="tbl-wrap"><table class="tbl">
    <tr><th>策略</th><th>触发方式</th><th>响应延迟</th><th>配置难度</th><th>最适合场景</th></tr>
    <tr><td><strong>Target Tracking</strong></td><td>目标指标自动维持</td><td class="good">快（持续调整）</td><td class="good">⭐ 最简单</td><td>不规律动态负载（<strong>首选</strong>）</td></tr>
    <tr><td><strong>Simple / Step</strong></td><td>CloudWatch Alarm</td><td class="mid">中（等Alarm触发）</td><td class="mid">⭐⭐⭐</td><td>需精细控制扩缩步长</td></tr>
    <tr><td><strong>Scheduled</strong></td><td>固定时间计划</td><td class="good">提前，零延迟</td><td class="mid">⭐⭐</td><td>已知时间规律的高峰</td></tr>
    <tr><td><strong>Predictive</strong></td><td>ML 预测历史负载</td><td class="good">提前，自动学习</td><td class="good">⭐⭐ 配好即自动</td><td>周期性规律 + 不想手动配置</td></tr>
  </table></div>
</div>

<div class="s-card">
  <h3>⚠️ 考试高频陷阱</h3>
  ${trapdiv('red','高频','ASG 本身免费，Launch Configurations 已废弃','ASG 是 free service，你只为 EC2 实例付费。旧版 Launch Configurations 已 Deprecated → 考试选 <strong>Launch Template</strong>。')}
  ${trapdiv('red','高频','ELB Health Check 失败 → ASG 终止实例并重建','只用 EC2 Status Check 检测不到应用崩溃。生产环境必须配 <strong>ELB Health Check</strong> 才能实现应用级别自愈。')}
  ${trapdiv('red','高频','Cooldown 默认 300 秒，期间忽略所有扩缩 Alarm','冷却期内 ASG 不会执行任何新的扩缩动作，即使 CloudWatch Alarm 多次触发也会被忽略。')}
  ${trapdiv('red','高频','缩短 Cooldown 的方法 → 使用 Ready-to-use AMI','预装好所有软件的 AMI 让新实例启动更快 → 更快处理流量 → 指标更快稳定 → 可以设置更短的冷却期。')}
  ${trapdiv('amber','中频','RequestCountPerTarget 需要搭配 ALB','这个指标由 ALB 提供，NLB 没有。如果题目说"按每实例请求数扩缩" → ALB + ASG + RequestCountPerTarget。')}
  ${trapdiv('amber','中频','Scale In 默认终止策略：最老配置 + AZ 平衡','ASG 优先终止启动配置最老的实例，并选择实例最多的 AZ 中的实例，以维持跨 AZ 平衡。')}
  ${trapdiv('amber','中频','Predictive Scaling vs Scheduled Scaling 的区别','Scheduled：你手动指定时间和容量。Predictive：AWS ML 自动分析历史 pattern，自动预测并调度——更智能，但需要足够的历史数据。')}
</div>`}

    <strong style="color:var(--amber)">💡 生活类比：</strong> Public IP 就像你家的门牌号（全世界唯一）；Private IP 就像楼层房间号（不同小区可以都有 302 室）。要从房间出门上街（访问互联网），你需要经过大门（Internet Gateway）。

function switchTab(id,btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-'+id).classList.add('active');
