<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AWS SAA 备考手册</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5F3EE;--surface:#FFFFFF;--surface2:#F9F8F5;--border:#E2DED6;--border2:#CBC6BC;
  --ink:#1C1A17;--ink2:#4A4740;--ink3:#8A8680;
  --aws:#E8501A;--aws-bg:#FEF0EB;--aws-border:#F5C4B0;
  --blue:#1D5FBF;--blue-bg:#EBF2FF;--blue-border:#BFCFE8;
  --green:#1A7A4A;--green-bg:#EBF7F1;--green-border:#A8DABC;
  --red:#C0392B;--red-bg:#FEF0EE;--red-border:#F5B8B2;
  --amber:#B45309;--amber-bg:#FEF9EB;--amber-border:#E8D49A;
  --purple:#5B3FA6;--purple-bg:#F2EEFF;
  --r:10px;--r2:14px;
  --font:'Outfit',system-ui,sans-serif;
  --font-serif:'DM Serif Display',Georgia,serif
}
body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;font-size:16px;line-height:1.7}
button,input{font-family:var(--font)}
.hidden{display:none!important}

/* ── LAYOUT ── */
#app{display:flex;min-height:100vh}
.sidebar{width:240px;flex-shrink:0;background:var(--surface);border-right:1.5px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.main{flex:1;overflow-x:hidden;background:var(--bg)}
.view{max-width:860px;padding:40px 44px 80px;animation:fadeUp .2s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ── SIDEBAR ── */
.sb-top{padding:22px 20px 18px;border-bottom:1.5px solid var(--border)}
.sb-logo{display:flex;align-items:center;gap:10px}
.sb-badge{background:var(--aws);color:#fff;font-size:11px;font-weight:700;padding:4px 9px;border-radius:6px;letter-spacing:.4px}
.sb-title{font-size:15px;font-weight:700;color:var(--ink)}
.sb-subtitle{font-size:12px;color:var(--ink3);margin-top:2px}

.sb-section{padding:16px 12px 8px}
.sb-label{font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:1px;padding:0 8px 6px}
.sb-item{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:8px;border:none;background:none;color:var(--ink2);font-size:14px;font-weight:500;cursor:pointer;text-align:left;transition:all .13s}
.sb-item:hover{background:var(--surface2);color:var(--ink)}
.sb-item.active{background:var(--aws-bg);color:var(--aws);font-weight:600}
.sb-item.active .si-dot{background:var(--aws)}
.si-dot{width:7px;height:7px;border-radius:50%;background:var(--border2);flex-shrink:0;transition:background .13s}
.sb-item:hover .si-dot{background:var(--ink3)}
.sb-rate{font-size:10px;font-weight:700;margin-left:auto;padding:1px 5px;border-radius:4px}

/* ── PAGE HEADER ── */
.pg-hdr{margin-bottom:32px;padding-bottom:24px;border-bottom:1.5px solid var(--border)}
.pg-back{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--ink3);border:none;background:none;cursor:pointer;padding:0;margin-bottom:12px;transition:color .13s}
.pg-back:hover{color:var(--ink)}
.pg-icon{font-size:28px;margin-bottom:8px}
.pg-title{font-family:var(--font-serif);font-size:28px;font-weight:400;color:var(--ink);line-height:1.25;margin-bottom:6px}
.pg-sub{font-size:15px;color:var(--ink3);font-weight:400}
.pg-tags{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.pg-tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;letter-spacing:.3px}

/* ── SECTION CARD ── */
.s-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r2);padding:24px;margin-bottom:16px}
.s-card h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.9px;color:var(--ink3);margin-bottom:18px}
.s-card + .s-card{margin-top:0}

/* ── BULLET LIST ── */
.bl{display:grid;gap:10px}
.bl-item{display:flex;gap:12px;font-size:15px;color:var(--ink2);line-height:1.7;align-items:flex-start}
.bl-dot{width:6px;height:6px;border-radius:50%;background:var(--aws);flex-shrink:0;margin-top:9px}
.bl-item strong{color:var(--ink);font-weight:600}
.bl-item em{color:var(--aws);font-style:normal;font-weight:500}

/* ── PROPERTY LIST ── */
.pl{display:grid;gap:0}
.pl-row{display:grid;grid-template-columns:140px 1fr;gap:16px;padding:10px 0;border-bottom:1px solid var(--border);font-size:15px;align-items:baseline}
.pl-row:last-child{border-bottom:none}
.pl-k{font-size:13px;font-weight:600;color:var(--ink3)}
.pl-v{color:var(--ink2)}

/* ── TABLE ── */
.tbl-wrap{overflow-x:auto;margin:0 -2px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;padding:10px 14px;background:var(--surface2);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--ink3);border-bottom:1.5px solid var(--border)}
.tbl th:first-child{border-radius:var(--r) 0 0 0}
.tbl th:last-child{border-radius:0 var(--r) 0 0}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--border);color:var(--ink2);vertical-align:top;line-height:1.6}
.tbl td:first-child{font-weight:600;color:var(--ink);font-size:13px}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--surface2)}
.good{color:var(--green);font-weight:500}
.bad{color:var(--red);font-weight:500}
.mid{color:var(--amber);font-weight:500}
.na{color:var(--ink3);font-style:italic}

/* ── FORMULA / CODE ── */
.formula{background:var(--ink);color:#E8E4DB;border-radius:var(--r);padding:18px 20px;margin:4px 0;font-family:'SFMono-Regular',Consolas,monospace;font-size:13.5px;line-height:1.85}
.formula-lbl{font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;font-family:var(--font)}
.code-inline{font-family:'SFMono-Regular',Consolas,monospace;font-size:13px;background:var(--surface2);border:1px solid var(--border);padding:1px 6px;border-radius:4px;color:var(--blue)}

/* ── TRAP ── */
.trap{border-radius:var(--r);padding:14px 16px;margin-bottom:10px;font-size:14px;line-height:1.75;border-left:3px solid;display:flex;gap:12px;align-items:flex-start}
.trap-icon{font-size:15px;flex-shrink:0;margin-top:1px}
.trap.red{background:var(--red-bg);border-color:var(--red)}
.trap.amber{background:var(--amber-bg);border-color:var(--amber)}
.trap strong{font-weight:700;color:var(--ink);display:block;margin-bottom:3px}
.trap-freq{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;margin-left:4px;vertical-align:middle;display:inline-block}
.trap.red .trap-freq{background:var(--red-bg);color:var(--red)}
.trap.amber .trap-freq{background:var(--amber-bg);color:var(--amber)}

/* ── FLOW STEPS ── */
.flow{display:flex;flex-direction:column}
.flow-step{display:flex;gap:14px}
.flow-n{width:28px;height:28px;border-radius:50%;background:var(--aws-bg);border:2px solid var(--aws-border);color:var(--aws);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:3px}
.flow-body{padding-bottom:22px;padding-left:4px;border-left:2px dashed var(--border);margin-left:14px;flex:1;font-size:15px;color:var(--ink2);line-height:1.7}
.flow-step:last-child .flow-body{border-left-color:transparent;padding-bottom:0}
.flow-body strong{color:var(--ink)}

/* ── HOME ── */
.home-section{margin-bottom:36px}
.home-label{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.9px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.home-label::after{content:'';flex:1;height:1px;background:var(--border)}
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.svc-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r2);padding:18px 20px;cursor:pointer;transition:all .15s}
.svc-card:hover{border-color:var(--aws-border);box-shadow:0 2px 12px rgba(0,0,0,.06);transform:translateY(-1px)}
.svc-icon{font-size:22px;margin-bottom:10px}
.svc-name{font-size:15px;font-weight:700;margin-bottom:4px}
.svc-desc{font-size:13px;color:var(--ink3);line-height:1.5}
.svc-tags{display:flex;gap:5px;margin-top:12px;flex-wrap:wrap}
.svc-tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:12px}

/* ── TABS ── */
.tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--r);padding:4px}
.tab-btn{flex:1;padding:8px 12px;border-radius:7px;border:none;background:transparent;color:var(--ink3);font-size:13px;font-weight:500;cursor:pointer;transition:all .13s}
.tab-btn.active{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.tab-panel{display:none}
.tab-panel.active{display:block;animation:fadeUp .15s ease both}

/* ── QUIZ ── */
.qz-header{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.qz-prog-wrap{flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.qz-prog-fill{height:100%;background:var(--aws);border-radius:3px;transition:width .35s ease}
.qz-label{font-size:13px;color:var(--ink3);white-space:nowrap}
.qz-score{font-size:13px;font-weight:600;color:var(--ink);background:var(--surface2);border:1px solid var(--border);padding:4px 12px;border-radius:20px}

.q-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r2);padding:24px;margin-bottom:14px}
.q-meta{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.q-topic{font-size:11px;font-weight:700;padding:3px 9px;border-radius:5px;background:var(--aws-bg);color:var(--aws)}
.q-diff{font-size:12px;color:var(--ink3)}
.q-text{font-size:16px;line-height:1.8;color:var(--ink)}
.q-text em{font-style:normal;color:var(--aws);font-weight:600}
.q-text .code-inline{font-size:13.5px}

.choices{display:grid;gap:9px;margin-bottom:14px}
.choice{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:1.5px solid var(--border);border-radius:var(--r);cursor:pointer;transition:all .13s;font-size:15px;line-height:1.65;color:var(--ink2);background:var(--surface)}
.choice:hover:not(.disabled){border-color:var(--blue-border);background:var(--blue-bg);color:var(--ink)}
.choice.sel{border-color:var(--blue-border);background:var(--blue-bg);color:var(--ink)}
.choice.correct{border-color:var(--green-border);background:var(--green-bg)}
.choice.wrong{border-color:var(--red-border);background:var(--red-bg)}
.choice.reveal{border-color:var(--green-border);background:var(--green-bg)}
.choice.disabled{cursor:default}
.ck{width:26px;height:26px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--surface2);border:1px solid var(--border);color:var(--ink3);margin-top:1px;transition:all .13s}
.choice:hover:not(.disabled) .ck{background:var(--blue-bg);border-color:var(--blue-border);color:var(--blue)}
.choice.sel .ck{background:var(--blue-bg);border-color:var(--blue-border);color:var(--blue)}
.choice.correct .ck{background:var(--green-bg);border-color:var(--green-border);color:var(--green)}
.choice.wrong .ck{background:var(--red-bg);border-color:var(--red-border);color:var(--red)}
.choice.reveal .ck{background:var(--green-bg);border-color:var(--green-border);color:var(--green)}

.exp-box{border-radius:var(--r);padding:16px 18px;margin-bottom:14px;font-size:14px;line-height:1.8}
.exp-box.c{background:var(--green-bg);border:1.5px solid var(--green-border)}
.exp-box.w{background:var(--red-bg);border:1.5px solid var(--red-border)}
.exp-title{font-size:15px;font-weight:700;margin-bottom:8px}
.exp-box.c .exp-title{color:var(--green)}
.exp-box.w .exp-title{color:var(--red)}
.exp-body{color:var(--ink2)}
.exp-body strong{color:var(--ink);font-weight:600}
.exp-rule-box{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:10px 14px;margin-top:10px;font-size:13px;color:var(--ink3)}
.exp-rule-box::before{content:'📌  ';font-size:13px}
.why-wrong-box{background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:7px;padding:10px 14px;margin-top:8px;font-size:13px;color:var(--ink2);line-height:1.7}
.why-wrong-box::before{content:'其他选项为何错：';display:block;font-size:11px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .13s}
.btn-primary{background:var(--aws);color:#fff}.btn-primary:hover{filter:brightness(1.08)}
.btn-sec{background:var(--surface);color:var(--ink);border:1.5px solid var(--border)}.btn-sec:hover{border-color:var(--border2);background:var(--surface2)}
.btn-ghost{background:transparent;color:var(--ink3);padding:10px 14px}.btn-ghost:hover{color:var(--ink);background:var(--surface2)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn:disabled{opacity:.4;cursor:default;pointer-events:none}

/* ── RESULT ── */
.res-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r2);padding:36px;text-align:center;margin-bottom:20px}
.res-num{font-family:var(--font-serif);font-size:64px;line-height:1;margin-bottom:6px}
.res-num.p{color:var(--green)}.res-num.g{color:var(--blue)}.res-num.a{color:var(--amber)}.res-num.r{color:var(--red)}
.res-pct{font-size:16px;color:var(--ink3);margin-bottom:10px}
.res-msg{font-size:15px;color:var(--ink2)}
.wi{background:var(--surface);border:1.5px solid var(--red-border);border-radius:8px;padding:12px 16px;font-size:14px;color:var(--ink2);margin-bottom:8px;line-height:1.55}
.wi-t{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;background:var(--red-bg);color:var(--red);margin-right:6px;vertical-align:middle}

/* ── TOPIC PICKER ── */
.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:20px}
.topic-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:16px;cursor:pointer;text-align:left;transition:all .13s}
.topic-btn:hover{border-color:var(--aws-border);background:var(--aws-bg)}
.tb-name{font-size:15px;font-weight:700;margin-bottom:4px}
.tb-count{font-size:12px;color:var(--ink3)}
.tb-bar{height:3px;background:var(--border);border-radius:2px;margin-top:10px;overflow:hidden}
.tb-fill{height:100%;border-radius:2px;transition:width .5s}

/* ── COMPARE ── */
.compare-hero{background:linear-gradient(135deg,#1C1A17 0%,#2D2A24 100%);color:#F5F3EE;border-radius:var(--r2);padding:28px;margin-bottom:20px}
.compare-hero h2{font-family:var(--font-serif);font-size:22px;font-weight:400;margin-bottom:6px}
.compare-hero p{font-size:14px;opacity:.7}

/* ── KEYWORD BADGE ── */
.kw-box{background:linear-gradient(135deg,#0F172A,#1E293B);border-radius:var(--r);padding:16px 18px;margin:12px 0;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.kw-box::before{content:'🔑 考试关键词';font-size:10px;font-weight:700;color:#94A3B8;text-transform:uppercase;letter-spacing:1px;display:block;width:100%;margin-bottom:6px}
.kw{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;background:#1E3A5F;color:#93C5FD;border:1px solid #1D4ED840}
.kw.green{background:#14532D;color:#86EFAC;border-color:#16653140}
.kw.amber{background:#451A03;color:#FCD34D;border-color:#78350F40}
.kw.red{background:#450A0A;color:#FCA5A5;border-color:#7F1D1D40}
.kw.purple{background:#2E1065;color:#C4B5FD;border-color:#4C1D9540}

/* ── DASHBOARD STATS ── */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:28px}
.stat-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r2);padding:18px 16px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.stat-card.blue::before{background:var(--blue)}
.stat-card.green::before{background:var(--green)}
.stat-card.aws::before{background:var(--aws)}
.stat-card.amber::before{background:var(--amber)}
.stat-num{font-family:var(--font-serif);font-size:36px;font-weight:400;line-height:1;margin-bottom:4px}
.stat-label{font-size:12px;color:var(--ink3);font-weight:500}
.stat-sub{font-size:11px;color:var(--ink3);margin-top:3px}

/* ── STUDY PATH ── */
.path-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--r);font-size:14px;cursor:pointer;transition:all .13s;border:1.5px solid var(--border);background:var(--surface);margin-bottom:6px}
.path-item:hover{border-color:var(--aws-border);background:var(--aws-bg)}
.path-status{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.path-status.done{background:var(--green-bg);color:var(--green);border:2px solid var(--green-border)}
.path-status.next{background:var(--aws-bg);color:var(--aws);border:2px solid var(--aws-border)}
.path-status.todo{background:var(--surface2);color:var(--ink3);border:2px solid var(--border)}
.path-name{flex:1;font-weight:600;color:var(--ink)}
.path-rate{font-size:12px;font-weight:700}

/* ── EXAM TIP CARD ── */
.tip-card{background:linear-gradient(135deg,var(--purple-bg),#EEF2FF);border:1.5px solid #C4B5FD;border-radius:var(--r2);padding:20px 22px;margin-bottom:20px}
.tip-label{font-size:10px;font-weight:700;color:var(--purple);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.tip-text{font-size:15px;color:var(--ink2);line-height:1.8}

/* ── PROGRESS RING ── */
.prog-ring-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.prog-ring-label{font-size:12px;color:var(--ink3);font-weight:500;text-align:center}

/* ── KEYBOARD HINT ── */
.kbd-hint{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ink3);background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:2px 7px}
.kbd-hint kbd{font-family:var(--font);font-size:10px;font-weight:700;color:var(--ink2)}

/* ── SIDEBAR PROGRESS ── */
.sb-prog{height:3px;background:var(--border);border-radius:2px;margin-top:5px;overflow:hidden;margin-left:16px;width:calc(100% - 28px)}
.sb-prog-fill{height:100%;border-radius:2px;transition:width .5s}

/* ── CHEATSHEET ── */
.cheat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cheat-item{background:var(--surface2);border-radius:8px;padding:10px 12px;font-size:13px}
.cheat-q{color:var(--ink3);font-size:12px;margin-bottom:3px}
.cheat-a{color:var(--ink);font-weight:700}

/* ── MOBILE NAV (bottom bar) ── */
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1.5px solid var(--border);padding:8px 0 env(safe-area-inset-bottom,8px);z-index:100}
.mobile-nav-inner{display:flex;justify-content:space-around}
.mobile-nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 16px;border:none;background:none;color:var(--ink3);font-size:10px;font-weight:600;cursor:pointer}
.mobile-nav-btn.active{color:var(--aws)}
.mobile-nav-btn .mni{font-size:20px}

/* Responsive grid utility classes */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g2-sm{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3-sm{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px;text-align:center}

@media(max-width:720px){
  .sidebar{display:none}
  .view{padding:20px 16px 80px}

<script>
/* ═══════════════ QUIZ DATA ═══════════════ */
const QS=[
/* ── IAM ── */
{id:'iam_01',topic:'IAM',diff:'high',
text:'EC2 实例需要每天从 S3 读取配置文件。安全团队要求<em>不得将任何长期凭证存储在实例上</em>。哪种方案最符合要求？',
en:'An EC2 instance needs to read from S3 daily. The security team requires <em>no long-term credentials stored on the instance</em>. Which solution is correct?',
ch:['创建 IAM User，生成 Access Key，通过环境变量注入 EC2','创建 IAM Role 附加 S3 读取权限，通过 Instance Profile 绑定到 EC2','将 Access Key 加密后存在 EC2 的系统文件中','在 S3 Bucket Policy 中允许该 EC2 公网 IP 访问'],
ench:['Create IAM User, generate Access Key, inject via env variable','Create IAM Role with S3 read, attach via Instance Profile','Store encrypted Access Key in EC2 system files','Allow EC2 public IP in S3 Bucket Policy'],
ans:1,exp:'IAM Role 通过 <strong>Instance Profile</strong> 绑定后，AWS SDK 自动从 IMDS 获取<strong>临时凭证</strong>，自动轮换，无需存储任何长期 Key。',ww:'A/C 需要在实例上存储长期 Key，违反要求。D 用 IP 授权不稳定且不安全。',rule:'EC2 访问 AWS 服务 → IAM Role + Instance Profile，永远不是 Access Key。'},

{id:'iam_02',topic:'IAM',diff:'high',
text:'某 IAM User 附加了 <span class="code-inline">Allow s3:*</span> 策略。另一条策略添加了 <span class="code-inline">Deny s3:DeleteObject</span>。该用户删除 S3 对象，结果是？',
en:'An IAM User has <span class="code-inline">Allow s3:*</span> policy. Another policy adds <span class="code-inline">Deny s3:DeleteObject</span>. What happens when the user tries to delete an object?',
ch:['删除成功，Allow s3:* 覆盖所有操作','删除失败，Explicit Deny 永远优先于任何 Allow','取决于两条策略的创建时间','取决于策略附加顺序'],
ench:['Delete succeeds — Allow s3:* covers all operations','Delete fails — Explicit Deny always overrides any Allow','Depends on which policy was created first','Depends on policy attachment order'],
ans:1,exp:'IAM 权限求值：默认 Deny → 检查 <strong>Explicit Deny</strong>（若存在立即终止）→ 检查 Allow。Explicit Deny 永远优先，与顺序时间无关。',ww:'没有"后创建优先"或"后附加优先"规则（C/D 均错）。',rule:'有 Explicit Deny → 直接拒绝，无论 Allow 多宽泛。'},

{id:'iam_03',topic:'IAM',diff:'mid',
text:'公司在东京运行服务，需要创建 IAM Role 授权 EC2 访问 DynamoDB。这个 Role 应在哪个 Region 创建？',
en:'A company runs services in Tokyo. They need to create an IAM Role granting EC2 access to DynamoDB. Which Region should the Role be created in?',
ch:['ap-northeast-1，因为 EC2 在东京','us-east-1，AWS 默认主区域','IAM 是全局服务，不属于任何 Region，直接创建即可','需要在每个使用的 Region 各创建一次'],
ench:['ap-northeast-1, because EC2 is in Tokyo','us-east-1, the default AWS Region','IAM is a global service — not tied to any Region','Must create once per Region used'],
ans:2,exp:'IAM 是 AWS 的 <strong>全局服务（Global Service）</strong>。User、Role、Group、Policy 在所有 Region 均可使用，不受 Region 限制。',ww:'IAM 没有 Region 属性，A/B/D 反映了对 IAM 全局性质的误解。',rule:'Global：IAM、Route 53、CloudFront。Regional：EC2、RDS、EBS、S3 Bucket。'},

{id:'iam_04',topic:'IAM',diff:'high',
text:'管理员为 IAM User 设置了 Permission Boundary 允许 <span class="code-inline">s3:*</span>，但 Identity Policy 中<em>没有任何 S3 权限</em>。该用户能访问 S3 吗？',
en:'An admin set a Permission Boundary allowing <span class="code-inline">s3:*</span> for an IAM User, but the Identity Policy has <em>no S3 permissions</em>. Can the user access S3?',
ch:['可以，Boundary 允许 S3 即可访问','不可以，有效权限 = Identity Policy ∩ Boundary，缺少 Identity Policy 授权则无权限','取决于 SCP 的额外限制','可以，Boundary 优先级高于 Identity Policy'],
ench:['Yes — Boundary allows S3, so access is granted','No — Effective permissions = Identity Policy ∩ Boundary; missing Identity Policy means no access','Depends on SCP restrictions','Yes — Boundary overrides Identity Policy'],
ans:1,exp:'Permission Boundary 只是<strong>限制上限</strong>，不是授权。有效权限 = <strong>Identity Policy ∩ Boundary</strong>。Boundary 允许但 Identity Policy 没有 → 最终无权限。',ww:'Boundary 不能独立授权（A/D 错）。',rule:'有效权限 = Identity Policy ∩ Permission Boundary（两者都要有才行）。'},

{id:'iam_05',topic:'IAM',diff:'mid',
text:'账号 A 的 Lambda 需要读取账号 B 的 DynamoDB 表。哪种方案是最佳实践？',
en:'Account A\'s Lambda needs to read DynamoDB tables in Account B. What is the best practice?',
ch:['在账号 B 创建 IAM User，把 Access Key 提供给账号 A','在账号 B 创建 IAM Role（Trust Policy 信任账号 A），账号 A 通过 STS AssumeRole 获取临时凭证','将两个账号合并','在账号 A 创建 Role 直接访问账号 B 资源'],
ench:['Create IAM User in Account B, share Access Key with Account A','Create Role in Account B (Trust Policy trusts Account A), Account A uses STS AssumeRole','Merge both accounts','Create Role in Account A to directly access Account B resources'],
ans:1,exp:'跨账号标准模式：① 资源账号（B）建 Role，Trust Policy 信任来源账号（A）；② 来源账号（A）调用 STS AssumeRole 获取<strong>临时凭证</strong>访问资源。',ww:'A 需要共享长期 Key，安全风险高。C/D 架构上不可行。',rule:'cross-account → Role + Trust Policy + STS AssumeRole。'},

{id:'iam_06',topic:'IAM',diff:'mid',
text:'需要为 50 个 IAM User 赋予相同权限，且未来可能统一调整。哪种方式最符合最佳实践？',
en:'50 IAM Users need the same permissions, which may be updated together in the future. Which approach is best practice?',
ch:['为每个 User 分别创建 Inline Policy','创建 IAM Group，将 Managed Policy 附加到 Group，再将所有 User 加入 Group','创建 50 个 IAM Role','在 S3 Bucket Policy 中逐一列出 50 个 User'],
ench:['Create individual Inline Policy for each User','Create IAM Group, attach Managed Policy, add all Users to the Group','Create 50 IAM Roles','List all 50 Users in the S3 Bucket Policy'],
ans:1,exp:'<strong>Group + Managed Policy</strong>：Group 集中管理；Managed Policy 可复用，修改一处同步更新所有 User。',ww:'Inline Policy 只绑定单一实体（A 无法复用）。Role 不适合日常 User（C 错）。Bucket Policy 冗长（D 错）。',rule:'批量管理权限 → Group + Managed Policy，不是 Inline Policy。'},

{id:'iam_07',topic:'IAM',diff:'mid',
text:'公司在 AWS Organizations 中设置 SCP 禁止成员账号在 us-west-2 创建资源。成员账号管理员给自己创建了 <span class="code-inline">Allow *</span> 策略。该用户能在 us-west-2 创建 EC2 吗？',
en:'An SCP in AWS Organizations blocks member accounts from creating resources in us-west-2. The member account admin has an <span class="code-inline">Allow *</span> policy. Can the user create EC2 in us-west-2?',
ch:['可以，Identity Policy Allow * 覆盖所有限制','不可以，SCP 对所有主体（包括 Root）生效，无法被 Identity Policy 覆盖','取决于该用户是否是管理员','可以，SCP 只影响 Root User'],
ench:['Yes — Identity Policy Allow * overrides everything','No — SCP applies to all principals (including Root) and cannot be overridden by Identity Policy','Depends on whether the user is an admin','Yes — SCP only affects Root User'],
ans:1,exp:'SCP 是 Organizations 级别的<strong>权限护栏</strong>，限制成员账号内<strong>所有主体</strong>（Root/IAM User/Role）的最大可用权限。SCP Deny 不可被 Identity Policy 的 Allow 覆盖。<br><br>有效权限 = <strong>SCP ∩ Identity Policy</strong>',ww:'SCP 不只限制 Root（D 错）。Identity Policy Allow * 无法绕过 SCP（A 错）。',rule:'SCP 是上限护栏，账号内任何主体都受约束，Identity Policy 无法越权。'},

{id:'iam_08',topic:'IAM',diff:'mid',
text:'关于 IAM Group，以下哪种说法<em>正确</em>？',
en:'Which statement about IAM Groups is <em>correct</em>?',
ch:['IAM Group 支持嵌套，Group 里可以包含另一个 Group','IAM Group 不能作为 Resource Policy 的 Principal，一个 User 可以属于多个 Group','每个 User 只能属于一个 Group','IAM Group 可以像 Role 一样被 EC2 Assume'],
ench:['IAM Groups support nesting — a Group can contain another Group','IAM Groups cannot be a Principal in Resource Policies; a User can belong to multiple Groups','Each User can only belong to one Group','IAM Groups can be assumed by EC2 like a Role'],
ans:1,exp:'IAM Group：① <strong>不支持嵌套</strong>；② <strong>不能作为 Principal</strong>（Resource Policy 中不能写 Group ARN）；③ 一个 User 可加入<strong>多个 Group</strong>（最多 10 个）；④ Group 不能被服务 Assume。',ww:'A（嵌套）、C（只能一个）、D（可以 Assume）均错。',rule:'Group 三不：不嵌套、不作 Principal、不可 Assume。'},

/* ── EC2 实例类型 ── */
{id:'itype_01',topic:'EC2 实例类型',diff:'mid',
text:'公司需要运行<em>高性能科学建模</em>应用，需要尽可能快的 CPU 速度。应选哪种实例类型？',
en:'A company needs to run a <em>high-performance scientific modeling</em> app requiring maximum CPU speed. Which instance type?',
ch:['通用型（General Purpose，如 m5）','计算优化型（Compute Optimized，如 C 系列）','内存优化型（Memory Optimized，如 R 系列）','存储优化型（Storage Optimized，如 I3）'],
ench:['General Purpose (e.g. m5)','Compute Optimized (e.g. C-series)','Memory Optimized (e.g. R-series)','Storage Optimized (e.g. I3)'],
ans:1,exp:'<strong>Compute Optimized</strong> 配备高性能处理器，适合：批处理、媒体转码、HPC、科学建模、ML 推理、游戏服务器。代表：C5、C6g、C6i。',ww:'通用型均衡无特别 CPU 优化（A）。内存型优化 RAM 不是 CPU（C）。存储型优化本地磁盘 IOPS（D）。',rule:'科学建模/HPC/批处理/游戏服务器 → Compute Optimized（C 系列）。'},

{id:'itype_02',topic:'EC2 实例类型',diff:'mid',
text:'公司运行<em>高频 OLTP 数据库</em>，需要对本地存储有极高的顺序读写性能。应选哪种实例类型？',
en:'A company runs a <em>high-frequency OLTP database</em> requiring extremely high sequential read/write on local storage. Which instance type?',
ch:['Compute Optimized（计算优化型）','Memory Optimized（内存优化型）','Storage Optimized（存储优化型）','General Purpose（通用型）'],
ench:['Compute Optimized','Memory Optimized','Storage Optimized','General Purpose'],
ans:2,exp:'<strong>Storage Optimized</strong> 为本地存储高速顺序读写设计，提供数万 IOPS。适合 OLTP、关系型/NoSQL 数据库、Redis 磁盘缓存、数据仓库、分布式文件系统。代表：I3、D2、H1。',ww:'Compute 优化 CPU（A 错）。Memory 优化 RAM 大小（B 错）。通用型均衡不是最优（D 错）。',rule:'OLTP/NoSQL/分布式文件系统/本地高速存储 → Storage Optimized（I3 系列）。'},

{id:'itype_03',topic:'EC2 实例类型',diff:'mid',
text:'公司需要运行<em>大型内存数据库（如 Redis）</em>，数据完全存放在 RAM 中以实现亚毫秒响应。应选哪种实例类型？',
en:'A company needs to run a <em>large in-memory database (e.g. Redis)</em> with data fully in RAM for sub-millisecond responses. Which instance type?',
ch:['Compute Optimized（计算优化型）','Storage Optimized（存储优化型）','Memory Optimized（内存优化型）','General Purpose（通用型）'],
ench:['Compute Optimized','Storage Optimized','Memory Optimized','General Purpose'],
ans:2,exp:'<strong>Memory Optimized</strong> 提供超大 RAM 容量，专为在内存中处理大型数据集的场景设计。适合：内存数据库（Redis/Memcached）、实时大数据分析、大型 SAP 系统、高性能关系型数据库。代表：R6g、X1e、z1d。',ww:'Compute 优化 CPU 计算（A 错）。Storage 优化本地磁盘（B 错）。通用型 RAM 不够大（D 错）。',rule:'内存数据库/实时大数据/SAP/大型数据集完全在 RAM → Memory Optimized（R 系列）。'},

/* ── Security Groups ── */
{id:'sg_01',topic:'Security Groups',diff:'high',
text:'EC2 实例无法被访问，客户端一直处于<em>连接超时（timeout）</em>状态。最可能的原因是？',
en:'An EC2 instance is unreachable and clients receive a <em>connection timeout</em>. What is the most likely cause?',
ch:['应用程序崩溃或未正常启动','Security Group Inbound 规则阻止了流量','实例操作系统防火墙配置错误','EC2 IAM Role 权限不足'],
ench:['Application crashed or not launched','Security Group Inbound rule is blocking traffic','OS firewall misconfiguration','EC2 IAM Role lacks permissions'],
ans:1,exp:'<strong>Timeout（超时）</strong>= 数据包在网络层被拦截，EC2 看不到请求，是 <strong>Security Group 阻止</strong>的典型症状。<br><br>对比：<strong>Connection Refused</strong> = 数据包到了 EC2，但应用程序没有响应，是应用层问题。',ww:'应用崩溃显示 Connection Refused（A 是应用层问题）。IAM 权限与网络连通无关（D 错）。',rule:'Timeout → Security Group 问题。Connection Refused → 应用程序问题。'},

{id:'sg_02',topic:'Security Groups',diff:'high',
text:'关于 Security Groups 的默认行为，哪种说法<em>正确</em>？',
en:'Which statement correctly describes the <em>default behavior</em> of Security Groups?',
ch:['所有 Inbound 允许，所有 Outbound 拒绝','所有 Inbound 拒绝，所有 Outbound 允许','Inbound 和 Outbound 都允许','Inbound 和 Outbound 都拒绝'],
ench:['All inbound allowed; all outbound blocked','All inbound blocked; all outbound allowed','Both inbound and outbound allowed','Both inbound and outbound blocked'],
ans:1,exp:'SG 默认规则：<br>• <strong>Inbound</strong>：默认全部 ❌ 拒绝，需手动添加 Allow 规则<br>• <strong>Outbound</strong>：默认全部 ✅ 允许，EC2 可主动访问任何地址<br><br>符合「最小权限原则」：外部不能主动进来，内部可以主动出去。',ww:'A 把 Inbound/Outbound 搞反了。C/D 都不对。',rule:'SG 默认：Inbound 全拒 / Outbound 全放。新建实例记得手动开放 22、80、443 等。'},

{id:'sg_03',topic:'Security Groups',diff:'mid',
text:'Security Group 规则可以<em>引用另一个 Security Group</em> 作为来源（Source）。这样做的主要好处是？',
en:'A Security Group rule can <em>reference another Security Group</em> as the source. What is the main benefit?',
ch:['减少网络延迟','不需要关心具体 IP，被引用 SG 内的实例自动被允许访问','可以跨 Region 使用','自动同步两个 SG 的规则'],
ench:['Reduces network latency','No need to track IPs — all instances in the referenced SG are automatically allowed','Enables cross-region use','Automatically syncs rules between two SGs'],
ans:1,exp:'引用另一个 SG 时，<strong>所有附加该 SG 的实例，无论 IP 如何变化，都自动获得访问权限</strong>。Auto Scaling 场景最实用——实例 IP 不固定，用 SG 引用替代写死 IP。',ww:'与延迟无关（A 错）。SG 是 Region/VPC 级别（C 错）。引用不会同步规则（D 错）。',rule:'SG 引用另一个 SG = 动态 IP 白名单，Auto Scaling 互访首选。'},

{id:'sg_04',topic:'Security Groups',diff:'mid',
text:'关于 Security Group 和 NACL 的区别，以下哪项<em>正确</em>？',
en:'Which statement correctly describes the difference between Security Groups and NACLs?',
ch:['两者都是 Stateful（有状态）的','Security Group 是 Stateful，NACL 是 Stateless（无状态）','两者都是 Stateless 的','Security Group 是 Stateless，NACL 是 Stateful'],
ench:['Both are Stateful','Security Group is Stateful; NACL is Stateless','Both are Stateless','Security Group is Stateless; NACL is Stateful'],
ans:1,exp:'<strong>Security Group（Stateful）</strong>：入站允许 → 响应自动出站，无需配置 Outbound。<br><strong>NACL（Stateless）</strong>：入站和出站规则必须分别配置，还需放行临时端口（1024-65535）。<br><br>另：SG 只有 Allow 规则；NACL 有 Allow 和 <strong>Deny</strong> 规则，按编号顺序求值。',ww:'两者特性完全不同（A/C/D 均错）。',rule:'SG = Stateful（只有 Allow）；NACL = Stateless（有 Allow + Deny，按顺序求值）。'},

/* ── 购买模式 ── */
{id:'purchasing_01',topic:'购买模式',diff:'high',
text:'公司打算运行 MySQL 数据库，<em>需要 24/7 稳定运行，计划使用 3 年</em>，希望成本最低。应选哪种购买方式？',
en:'A company wants to run MySQL 24/7 for 3 years with minimum cost. Which purchasing option?',
ch:['On-Demand Instance','3 年期 Reserved Instance（All Upfront）','Spot Instance','Dedicated Host'],
ench:['On-Demand Instance','3-year Reserved Instance (All Upfront)','Spot Instance','Dedicated Host'],
ans:1,exp:'<strong>Reserved Instance</strong> 承诺 1 或 3 年使用，折扣最高 <strong>72%</strong>（vs On-Demand）。全额预付（All Upfront）折扣最大。数据库是最典型的「稳定状态工作负载」——全天运行、可预测、不能中断。',ww:'On-Demand 灵活但贵（A 成本高）。Spot 可被中断，数据库绝对不能用（C 错）。Dedicated Host 成本最高且不必要（D 错）。',rule:'稳定 + 长期（1-3 年）→ Reserved（All Upfront 折扣最大）。'},

{id:'purchasing_02',topic:'购买模式',diff:'high',
text:'公司有<em>可以随时中断的批处理任务</em>，对成本极度敏感。哪种购买方式最合适？',
en:'A company has <em>batch jobs that can be interrupted anytime</em> and is extremely cost-sensitive. Which option?',
ch:['On-Demand','Reserved Instance（1 年期）','Spot Instance','Savings Plans'],
ench:['On-Demand','1-year Reserved Instance','Spot Instance','Savings Plans'],
ans:2,exp:'<strong>Spot Instance</strong> 利用 AWS 闲置算力，价格最便宜最多 <strong>90%</strong>。可能被中断（提前 2 分钟通知），只适合容错能力强的工作负载：批处理、数据分析、图像处理、分布式任务。',ww:'On-Demand 最贵（A 错）。Reserved 适合稳定长期，不是批处理（B 错）。Savings Plans 是长期承诺（D 错）。',rule:'可中断 + 成本最低 → Spot。不适合数据库和关键业务！'},

{id:'purchasing_03',topic:'购买模式',diff:'high',
text:'Reserved Instance 和 Convertible Reserved Instance 最主要的区别是什么？',
en:'What is the key difference between Reserved Instance and Convertible Reserved Instance?',
ch:['Reserved 可以中途更改实例类型，Convertible 不可以','Convertible 可以更改实例类型/OS/Scope，但折扣略低（最高 66% vs 72%）','Convertible 可以跨 Region 使用','两者完全相同'],
ench:['Reserved allows changing instance type; Convertible does not','Convertible allows changing instance type/OS/scope, but lower discount (up to 66% vs 72%)','Convertible can be used across Regions','They are identical'],
ans:1,exp:'<strong>Standard RI</strong>：固定实例类型/Region/OS，折扣约 72%，适合配置完全固定的场景。<br><strong>Convertible RI</strong>：可随时更改实例类型、家族、OS、Scope、Tenancy，折扣约 66%，适合未来需求可能调整的场景。',ww:'A 说反了，是 Convertible 可以改。两者都是 Region 级别（C 错）。',rule:'需要灵活 → Convertible RI。配置固定 → Standard RI（折扣更大）。'},

{id:'purchasing_04',topic:'购买模式',diff:'mid',
text:'Dedicated Hosts 和 Dedicated Instances 的主要区别是？',
en:'What is the main difference between Dedicated Hosts and Dedicated Instances?',
ch:['两者完全相同','Dedicated Host 提供对物理主机的完全可见性和控制权，支持 BYOL；Dedicated Instance 只是物理隔离但无主机控制权','Dedicated Instance 比 Dedicated Host 更贵','Dedicated Instance 支持 BYOL，Dedicated Host 不支持'],
ench:['They are identical','Dedicated Host gives full visibility/control of physical server, supports BYOL; Dedicated Instance only provides physical isolation','Dedicated Instance is more expensive','Dedicated Instance supports BYOL; Dedicated Host does not'],
ans:1,exp:'<strong>Dedicated Host</strong>：租整台物理服务器，可看到 Socket/Core 数，支持 <strong>BYOL</strong>，成本最高。<br><strong>Dedicated Instance</strong>：物理隔离（不与其他客户共享硬件），但看不到底层物理主机，不支持 BYOL。',ww:'两者本质不同（A 错）。Dedicated Host 最贵（C 反了）。BYOL 是 Host 的特性（D 反了）。',rule:'BYOL / 需要看到物理机 → Dedicated Host。只需物理隔离 → Dedicated Instance。'},

{id:'purchasing_05',topic:'购买模式',diff:'mid',
text:'Capacity Reservations 和 Reserved Instances 最关键的区别是？',
en:'What is the key difference between Capacity Reservations and Reserved Instances?',
ch:['Capacity Reservations 有折扣，Reserved Instances 没有','Capacity Reservations 没有折扣但可随时创建/取消，确保特定 AZ 的容量始终可用','Capacity Reservations 只能配合 Spot 使用','Reserved Instances 可以预留特定 AZ 的容量，Capacity Reservations 不行'],
ench:['Capacity Reservations offer discounts; Reserved Instances do not','Capacity Reservations have no discounts but can be created/cancelled anytime, ensuring AZ capacity','Capacity Reservations can only be used with Spot','Reserved Instances can reserve AZ capacity; Capacity Reservations cannot'],
ans:1,exp:'<strong>Capacity Reservations</strong>：无折扣，按 On-Demand 价计费（不管实例有没有运行），无时间承诺，可随时创建/取消，<strong>确保特定 AZ 有容量可用</strong>。<br>可配合 Regional RI 或 Savings Plans 获取折扣。',ww:'Capacity Reservations 本身没有折扣（A 错）。不限配合 Spot（C 错）。',rule:'Capacity Reservations = 保证容量（无折扣，随时取消）。Reserved = 承诺用量（有折扣，时间锁定）。'},

/* ── EBS ── */
{id:'ebs_01',topic:'EBS',diff:'high',
text:'EC2 实例被 <em>Terminate</em> 后，Root 卷数据消失了。如何防止这种情况？',
en:'After an EC2 instance is <em>terminated</em>, the Root volume data is gone. How do you prevent this?',
ch:['将 Root 卷改为 Instance Store 类型','在启动实例时，将 Root Volume 的 Delete on Termination 设为 disabled','将 Root 卷类型从 gp2 改为 io2','EC2 终止前手动创建 AMI'],
ench:['Change Root volume to Instance Store type','Set Root Volume Delete on Termination to disabled when launching','Change Root volume type from gp2 to io2','Manually create AMI before terminating'],
ans:1,exp:'<strong>Delete on Termination</strong>：Root Volume 默认 ✅ 随实例删除（enabled）。将其设为 disabled，Terminate 后 EBS 卷保留。',ww:'Instance Store 没有持久性（A 更差）。卷类型不影响删除行为（C 错）。建 AMI 是备份不是解决问题（D 绕远了）。',rule:'Root Volume 默认随 Terminate 删除 → 手动设 Delete on Termination = disabled 来保留。'},

{id:'ebs_02',topic:'EBS',diff:'high',
text:'需要将 us-east-1a 的 EBS 卷迁移到 us-east-1b 使用。正确的操作流程是？',
en:'You need to migrate an EBS volume from us-east-1a to us-east-1b. What is the correct process?',
ch:['直接卸载 EBS 再挂载到 us-east-1b 的 EC2','对 EBS 创建 Snapshot，在 us-east-1b 从该 Snapshot Restore 出新 EBS','将 EBS 类型改为 gp3 即可跨 AZ 挂载','使用 AWS DataSync 同步数据'],
ench:['Detach and re-attach the EBS to us-east-1b EC2','Create a Snapshot of the EBS, then Restore it in us-east-1b as a new volume','Change EBS type to gp3 to enable cross-AZ mounting','Use AWS DataSync to sync the data'],
ans:1,exp:'EBS 绑定特定 AZ，无法直接跨 AZ。<strong>Snapshot → 在目标 AZ Restore 出新 EBS</strong>是唯一标准方式。Snapshot 存于 Region 级别 S3，可在同 Region 任意 AZ 还原。',ww:'EBS 不能直接跨 AZ 挂载（A 错）。卷类型不影响 AZ 限制（C 错）。DataSync 用于文件迁移（D 错）。',rule:'EBS 跨 AZ → Snapshot → 目标 AZ Restore。'},

{id:'ebs_03',topic:'EBS',diff:'high',
text:'数据库应用需要超过 <em>16,000 IOPS</em> 的持续性能，IOPS 要求与存储容量<em>独立调整</em>。应选哪种 EBS 类型？',
en:'A database needs more than <em>16,000 IOPS</em> sustained, and IOPS must be <em>adjustable independently</em> from storage size. Which EBS type?',
ch:['gp3（支持独立调整 IOPS）','io1 或 io2（IOPS 上限更高且支持独立调整）','st1（高性能 HDD）','gp2（IOPS 随容量自动增加）'],
ench:['gp3 (supports independent IOPS adjustment)','io1 or io2 (higher IOPS ceiling and independent adjustment)','st1 (high-throughput HDD)','gp2 (IOPS scales automatically with size)'],
ans:1,exp:'<strong>io1/io2</strong> 是 Provisioned IOPS SSD，专为 >16,000 IOPS 的关键数据库设计，IOPS 与容量完全独立调整。io2 Block Express 最高 256,000 IOPS。<br><br>gp3 虽支持独立调整，但最高只有 16,000 IOPS，不满足本题。',ww:'gp3 上限 16,000 IOPS 不满足（A 错）。st1 是 HDD 不适合高 IOPS 数据库（C 错）。gp2 IOPS 与容量绑定（D 错）。',rule:'>16,000 IOPS → io1/io2。gp3 上限 = 16,000。'},

{id:'ebs_04',topic:'EBS',diff:'mid',
text:'公司希望节省<em>不常用旧 Snapshot</em> 的存储费，可以接受等待 1–3 天才能还原。应用哪个功能？',
en:'A company wants to reduce costs of <em>rarely-used old Snapshots</em> and can accept 1–3 days to restore. Which feature?',
ch:['开启 Fast Snapshot Restore（FSR）','将 Snapshot 移至 EBS Snapshot Archive','为 Snapshot 启用 Recycle Bin','定期手动删除旧 Snapshot'],
ench:['Enable Fast Snapshot Restore (FSR)','Move Snapshots to EBS Snapshot Archive','Enable Recycle Bin for Snapshots','Periodically delete old Snapshots manually'],
ans:1,exp:'<strong>Snapshot Archive</strong>：移至归档层，比标准存储便宜 <strong>75%</strong>。还原需要 24–72 小时。题目说"可接受等待 1–3 天"，完全符合。',ww:'FSR 是加速还原（额外付费），方向相反（A 错）。Recycle Bin 是防误删，不降存储费（C 错）。',rule:'省钱 + 不急用 → Archive（便宜75%，还原24-72h）。需要立即还原 → FSR（额外付费）。'},

{id:'ebs_05',topic:'EBS',diff:'mid',
text:'需要多台 Linux EC2 在<em>同一 AZ 内同时读写同一个高性能 EBS 卷</em>（集群数据库场景）。哪种方案可行？',
en:'Multiple Linux EC2s in the <em>same AZ need to simultaneously read/write the same high-performance EBS volume</em>. Which solution works?',
ch:['使用 gp3 EBS，IOPS 调最高后同时挂载到多台 EC2','使用 io1 或 io2 EBS 并启用 Multi-Attach，最多可挂 16 台 EC2','改用 EFS','将数据放在 S3，多台 EC2 通过 API 并发访问'],
ench:['Use gp3 EBS at max IOPS attached to multiple EC2s','Use io1 or io2 EBS with Multi-Attach enabled (up to 16 EC2s)','Switch to EFS','Put data on S3, accessed by multiple EC2s via API'],
ans:1,exp:'<strong>EBS Multi-Attach</strong> 仅支持 <strong>io1/io2</strong>，允许同一 EBS 同时挂载到同 AZ 内最多 <strong>16 台 EC2</strong>，每台有完整读写权限。需使用 cluster-aware 文件系统。',ww:'gp3 不支持 Multi-Attach（A 错）。EFS 是文件存储，不是块存储（C 场景不同）。S3 是对象存储（D 错）。',rule:'多 EC2 同时挂同一 EBS → io1/io2 Multi-Attach（同 AZ，最多 16 台）。'},

{id:'ebs_06',topic:'EBS',diff:'high',
text:'你刚刚终止了 us-east-1a 的 EC2，其 EBS 卷变为可用状态。同事尝试将该卷挂到 us-east-1b 的 EC2 上但失败了。最可能的原因是？',
en:'You terminated an EC2 in us-east-1a; its EBS is now available. Your teammate fails to attach it to us-east-1b. The most likely cause?',
ch:['同事缺少 IAM 权限','EBS 卷锁定在 AWS Region 层级','EBS 卷锁定在 Availability Zone（AZ）层级，不能跨 AZ 直接挂载','需要先升级 EBS 卷类型'],
ench:['Missing IAM permissions','EBS volumes are locked to an AWS Region','EBS volumes are locked to an Availability Zone — cannot be attached cross-AZ','The EBS type must be upgraded first'],
ans:2,exp:'EBS 绑定特定 <strong>AZ</strong>。us-east-1a 的 EBS 无法直接挂载到 us-east-1b 的 EC2，即使同一 Region 也不行。跨 AZ 唯一方式：<strong>Snapshot → 目标 AZ Restore → 新 EBS → 挂载</strong>。',ww:'IAM 权限问题会显示授权错误（A 错）。EBS 是 AZ 级别，不是 Region 级别（B 范围错误）。卷类型不影响 AZ 绑定（D 错）。',rule:'EBS = AZ 级别绑定。跨 AZ 必须 Snapshot → Restore。'},

{id:'ebs_07',topic:'EBS',diff:'high',
text:'你启动了带 Root 卷和额外 EBS 数据卷的 EC2。一个月后 Terminate 该实例。<em>默认情况下</em>，两个卷会怎样？',
en:'You launched EC2 with a Root volume and an extra EBS data volume. A month later you Terminate the instance. <em>By default</em>, what happens to each volume?',
ch:['两个卷都被删除','Root 卷被删除，额外 EBS 卷不被删除','Root 卷不被删除，额外 EBS 卷被删除','两个卷都不被删除'],
ench:['Both volumes are deleted','Root volume is deleted; additional EBS is NOT deleted','Root volume is NOT deleted; additional EBS is deleted','Neither volume is deleted'],
ans:1,exp:'<strong>Delete on Termination 默认值</strong>：<br>• Root Volume：默认 ✅ enabled（随实例删除）<br>• 额外 EBS 卷：默认 ❌ disabled（实例终止后保留）<br><br>可在启动时修改此设置。',ww:'两个都删（A）忽略了额外卷的默认保留。Root 不删/额外删（C）完全搞反了。两个都不删（D）也不对。',rule:'Root Volume 默认随 Terminate 删除；额外 EBS 卷默认保留。记住这个"不对称"！'},

{id:'ebs_08',topic:'EBS',diff:'mid',
text:'以下哪些 EBS 卷类型可用作 Boot Volume（启动盘）？',
en:'Which of the following EBS volume types can be used as Boot Volumes?',
ch:['gp2、gp3、st1、sc1','gp2、gp3、io1、io2','io1、io2、st1、sc1','只有 gp2 和 gp3'],
ench:['gp2, gp3, st1, sc1','gp2, gp3, io1, io2','io1, io2, st1, sc1','Only gp2 and gp3'],
ans:1,exp:'只有 <strong>SSD 类型</strong>可以作为启动盘：<strong>gp2、gp3、io1、io2</strong>。<br><br>HDD（st1/sc1）❌ 不支持，因为系统启动需要快速随机读写，HDD 的随机 IOPS 上限（500）无法满足。',ww:'st1/sc1（HDD）不支持 Boot Volume（A/C 错）。仅 gp2/gp3 遗漏了 io1/io2（D 不完整）。',rule:'Boot Volume 只能用 SSD：gp2/gp3/io1/io2。HDD ❌ 不支持。'},

{id:'ebs_09',topic:'EBS',diff:'high',
text:'EBS Multi-Attach 的正确定义是？',
en:'What is the correct definition of EBS Multi-Attach?',
ch:['将同一 EBS 卷挂到多个 AZ 的多台 EC2','将多个 EBS 卷挂到同一 AZ 的同一台 EC2','将同一 EBS 卷挂到同一 AZ 的多台 EC2','将多个 EBS 卷跨多个 AZ 挂到同一台 EC2'],
ench:['Attach the same EBS to multiple EC2s across multiple AZs','Attach multiple EBS volumes in the same AZ to the same EC2','Attach the same EBS to multiple EC2s in the same AZ','Attach multiple EBS volumes across AZs to the same EC2'],
ans:2,exp:'Multi-Attach：同一个 EBS 卷同时挂载到<strong>同一 AZ 内</strong>最多 <strong>16 台</strong> EC2，每台有完整读写权限。<br>限制：仅 io1/io2，同 AZ，需 cluster-aware 文件系统（不能用 XFS/EXT4）。',ww:'Multi-Attach 不跨 AZ（A/D 错）。Multi-Attach 是一个卷挂多台，不是多个卷挂一台（B 描述反了）。',rule:'Multi-Attach = 同一 io1/io2 EBS → 同 AZ 最多 16 台 EC2，各自有完整读写权限。'},

{id:'ebs_10',topic:'EBS',diff:'high',
text:'你有一个现有的<em>未加密 EBS 卷</em>挂在 EC2 上，需要对其加密。正确操作步骤是？',
en:'You have an existing <em>unencrypted EBS volume</em> attached to EC2 and need to encrypt it. What are the correct steps?',
ch:['在 EBS 控制台选该卷，点 Edit Attributes 勾选 Encrypt','对该 EBS 创建 Snapshot，复制 Snapshot 时启用加密，再用加密 Snapshot 创建新 EBS','直接用 OS 命令加密磁盘','创建新的加密 EBS 卷，用 dd 命令复制数据'],
ench:['Select volume in console, click Edit Attributes and tick Encrypt','Create Snapshot, copy with encryption enabled, then create new EBS from the encrypted Snapshot','Use OS-level disk encryption commands','Create new encrypted EBS and copy data using dd'],
ans:1,exp:'EBS 加密<strong>不能原地启用</strong>，必须通过 Snapshot 中转：<br>① 创建 Snapshot（未加密）<br>② Copy Snapshot 时勾选加密<br>③ 用加密 Snapshot Restore 出新 EBS<br>④ 挂载新 EBS 替换旧卷',ww:'EBS 控制台没有"直接启用加密"按钮（A 不可行）。OS 层加密 ≠ AWS EBS 原生加密（C 概念混淆）。dd 非 AWS 推荐方式（D 非最佳实践）。',rule:'加密现有 EBS → Snapshot → 复制时加密 → Restore 新卷。不能原地加密！'},

/* ── EBS Snapshot ── */
{id:'snap_01',topic:'EBS',diff:'mid',
text:'EBS Snapshot 的 Recycle Bin 功能主要解决什么问题？',
en:'What problem does the EBS Snapshot Recycle Bin feature primarily solve?',
ch:['降低 Snapshot 的存储成本','防止误删 Snapshot 后无法恢复','加快 Snapshot 的还原速度','自动定期创建 Snapshot'],
ench:['Reduces Snapshot storage costs','Prevents permanent loss of accidentally deleted Snapshots','Speeds up Snapshot restore','Automatically creates Snapshots periodically'],
ans:1,exp:'<strong>Recycle Bin</strong> 可以设定规则：Snapshot 被删除后先进入回收桶，保留 1 天到 1 年，在保留期内可以恢复。防止手滑误删导致数据无法恢复的场景。',ww:'降低存储成本是 Archive 的功能（A 错）。加快还原是 FSR 的功能（C 错）。自动创建是 AWS Backup 或 DLM 的功能（D 错）。',rule:'防误删 → Recycle Bin。省钱 → Archive。立即全速 → FSR。'},

/* ── Instance Store ── */
{id:'istore_01',topic:'Instance Store',diff:'high',
text:'EC2 上需要<em>高性能本地缓存</em>，实例终止时缓存丢失可接受。推荐哪种存储？',
en:'An EC2 needs a <em>high-performance local cache</em>. Losing cache data on termination is acceptable. Which storage?',
ch:['EBS gp3','Amazon EFS','EC2 Instance Store','EBS io2'],
ench:['EBS gp3','Amazon EFS','EC2 Instance Store','EBS io2'],
ans:2,exp:'两个关键线索：① <strong>高性能本地缓存</strong>→ 极低延迟/极高 IOPS；② <strong>终止后数据丢失可接受</strong>→ 不需要持久化。Instance Store 物理直连宿主机，I/O 远超 EBS（数百万 IOPS），且临时性与需求完全吻合。',ww:'EBS 有网络延迟，按 GB 计费（A/D 非最优）。EFS 是共享文件系统，不适合本地高性能缓存（B 错）。',rule:'高性能 + 本地 + 数据可以丢失 = Instance Store 的完美使用场景。'},

{id:'istore_02',topic:'Instance Store',diff:'high',
text:'你在运行高性能数据库，底层存储需要 <em>310,000 IOPS</em>。应推荐哪种存储方案？',
en:'You run a high-performance database requiring <em>310,000 IOPS</em> for underlying storage. What do you recommend?',
ch:['EBS gp2（通用 SSD）','EBS io1（Provisioned IOPS SSD）','EC2 Instance Store','EBS io2 Block Express'],
ench:['EBS gp2','EBS io1','EC2 Instance Store','EBS io2 Block Express'],
ans:2,exp:'各类型 IOPS 上限：<br>• gp2/gp3：16,000 ❌<br>• io1：64,000（Nitro EC2）❌<br>• io2 Block Express：256,000 ❌<br>• <strong>Instance Store（i3 系列）：可达 3,300,000 ✅</strong><br><br>310,000 超过所有 EBS 上限，只有 Instance Store 能满足。',ww:'gp2 最高 16K（A 差太多）。io1 最高 64K（B 不够）。io2 最高 256K < 310K（D 差一点但还是不够）。',rule:'IOPS > 256,000（io2 上限）→ 只能用 Instance Store。记住 io2 上限是 256K！'},

{id:'istore_03',topic:'Instance Store',diff:'high',
text:'EC2 实例执行了 <em>Reboot（重启）</em>操作。Instance Store 中的数据状态是？',
en:'An EC2 instance is <em>Rebooted</em>. What happens to data in Instance Store?',
ch:['数据全部丢失，Reboot 和 Stop 一样会重置存储','数据完整保留，Reboot 不会迁移物理主机','数据部分保留，取决于重启原因','数据保留，但需要手动重新挂载'],
ench:['All data lost — Reboot resets storage like Stop','Data is fully preserved — Reboot does not migrate the physical host','Data partially preserved depending on reason for reboot','Data preserved but must be manually re-mounted'],
ans:1,exp:'<strong>Reboot</strong> = 在同一台物理主机上重启，实例不迁移，Instance Store 磁盘连接不断开，<strong>数据完整保留</strong>。<br><br>对比：Stop → 可能迁移到新物理主机 → 数据丢失。Terminate → 资源被回收 → 数据丢失。',ww:'Reboot 和 Stop 行为完全不同（A 错）。不需要重新挂载（D 错）。',rule:'Instance Store：Reboot ✅ 保留。Stop/Terminate ❌ 丢失。这个区别必须记住！'},

/* ── EFS ── */
{id:'efs_01',topic:'EFS',diff:'high',
text:'公司部署了跨 3 个 AZ 的 WordPress 网站，需要所有 EC2 实例<em>共享同一份媒体文件</em>，要求高可用。应选哪种存储？',
en:'A company deploys WordPress across 3 AZs. All EC2 instances need to <em>share the same media files</em> with high availability. Which storage?',
ch:['为每个 AZ 的 EC2 分别挂独立 EBS 卷并定期同步','使用 Amazon EFS，跨 AZ 挂载同一文件系统','使用 EBS Multi-Attach 将同一 EBS 挂到所有 EC2','使用 Instance Store，性能最高'],
ench:['Attach separate EBS volumes and sync periodically','Use Amazon EFS — mount the same file system across AZs','Use EBS Multi-Attach across all EC2s','Use Instance Store for highest performance'],
ans:1,exp:'<strong>EFS</strong> 是托管 NFS，原生支持<strong>多 AZ 数百台 EC2 同时挂载</strong>，每个 AZ 通过 Mount Target 连接到同一文件系统，完美适合 WordPress 共享媒体文件场景。',ww:'EBS 分别挂载无法共享（A 需额外同步机制）。EBS Multi-Attach 仅限同一 AZ（C 错）。Instance Store 无持久性且无法共享（D 错）。',rule:'多 AZ 多实例共享文件 → EFS。WordPress/CMS 共享媒体是 EFS 的典型场景。'},

{id:'efs_02',topic:'EFS',diff:'mid',
text:'公司使用 EFS，部分文件<em>超过 60 天未被访问</em>，希望降低成本但不想手动管理。哪种方案最合适？',
en:'Files in EFS have <em>not been accessed for 60+ days</em>. The company wants to reduce cost without manual management. Best approach?',
ch:['手动将旧文件迁移到 S3','在 EFS 设置 Lifecycle Policy，将 N 天未访问的文件自动移至 EFS-IA','将整个 EFS 切换到 EFS One Zone','删除超过 60 天的文件，需要时重新上传'],
ench:['Manually migrate old files to S3','Set EFS Lifecycle Policy to automatically move files not accessed for N days to EFS-IA','Switch entire EFS to EFS One Zone','Delete files older than 60 days and re-upload when needed'],
ans:1,exp:'<strong>EFS Lifecycle Policy</strong> 自动将 N 天未访问的文件移至 <strong>EFS-IA（Infrequent Access）</strong>层，成本大幅降低，文件仍可访问（读取时自动从 IA 层取出），无需手动操作。',ww:'手动迁移到 S3 改变存储类型（A 太麻烦）。EFS One Zone 降低可用性（C 有风险）。删除文件风险太大（D 错）。',rule:'EFS 降成本 → Lifecycle Policy 自动移至 EFS-IA。'},

{id:'efs_03',topic:'EFS',diff:'high',
text:'以下关于 EFS 的说法，哪项<em>正确</em>？',
en:'Which statement about Amazon EFS is <em>correct</em>?',
ch:['EFS 支持 Linux 和 Windows EC2','EFS 只支持 Linux（POSIX），不支持 Windows EC2','EFS 按预置容量计费，需要提前规划存储大小','EFS 是块存储（Block Storage），与 EBS 相同'],
ench:['EFS supports both Linux and Windows EC2','EFS only supports Linux (POSIX), not Windows EC2','EFS is billed per provisioned capacity and requires pre-planning storage size','EFS is block storage, same as EBS'],
ans:1,exp:'EFS 使用 <strong>NFS v4.1 协议</strong>，是 <strong>POSIX-compatible</strong> 文件系统，<strong>仅支持 Linux</strong>。Windows EC2 需要使用 <strong>Amazon FSx for Windows File Server</strong>。<br><br>EFS 是文件存储（File Storage），不是块存储（Block Storage），且按实际用量计费（Pay-per-use），无需预置。',ww:'EFS 不支持 Windows（A 错）。EFS 按用量计费，无需预置（C 错）。EFS 是文件存储，不是块存储（D 错）。',rule:'EFS 仅 Linux（POSIX）。Windows 共享文件 → FSx for Windows。'},

/* ── AMI ── */
{id:'ami_01',topic:'AMI',diff:'high',
text:'公司需要在东京（ap-northeast-1）批量部署与 us-east-1 中相同环境的 EC2 实例。最高效的方法是？',
en:'A company needs to deploy EC2 instances in Tokyo (ap-northeast-1) with the same environment as us-east-1. Most efficient approach?',
ch:['在东京手动启动 EC2，用 User Data 脚本重新安装软件','将 us-east-1 的 Custom AMI 复制（Copy AMI）到 ap-northeast-1，再用该 AMI 启动','在东京直接使用 us-east-1 的 AMI ID 启动','使用 CloudFormation 模板在东京重新部署'],
ench:['Manually launch EC2 in Tokyo and reinstall via User Data','Copy the Custom AMI from us-east-1 to ap-northeast-1, then launch from it','Directly use the us-east-1 AMI ID to launch in Tokyo','Use CloudFormation to redeploy in Tokyo'],
ans:1,exp:'AMI 是 <strong>Region 级别</strong>资源。跨 Region 必须先 <strong>Copy AMI</strong> 到目标 Region，会生成新 AMI ID（东京版本）。从 AMI 启动的实例立即拥有完整预配置环境，比 User Data 脚本快得多。',ww:'User Data 需等待安装，速度慢（A 不是最高效）。直接用其他 Region 的 AMI ID 会报错（C 错）。CloudFormation 可以用但不如 AMI 直接（D 繁琐）。',rule:'AMI 是 Region 级别，跨 Region → 先 Copy AMI → 用新 AMI ID 启动。'},

{id:'ami_02',topic:'AMI',diff:'high',
text:'判断对错：可以直接使用 N.Virginia（us-east-1）的 AMI，在<em>任意其他 AWS Region</em> 启动 EC2，无需任何额外操作。',
en:'True or False: You can directly use an AMI from us-east-1 to launch EC2 in <em>any other AWS Region</em> without any additional steps.',
ch:['True（正确）','False（错误）'],
ench:['True','False'],
ans:1,exp:'<strong>False。</strong> AMI 绑定创建它的 Region，每个 AMI ID 只在该 Region 有效。跨 Region 使用必须先 <strong>Copy AMI</strong>，复制后产生目标 Region 的新 AMI ID，再用此 ID 启动实例。',ww:'AMI 不是全局资源（True 错）。',rule:'AMI 跨 Region → 必须先 Copy AMI，不能直接用原 AMI ID。'},

/* ── EC2 核心补充题 ── */
{id:'ec2f_01',topic:'Security Groups',diff:'mid',
text:'应该使用什么来控制 EC2 实例的<em>入站和出站流量</em>？',
en:'What should you use to control traffic <em>in and out of EC2 instances</em>?',
ch:['Network Access Control List（NACL）','Security Groups','IAM Policies','VPC Route Tables'],
ench:['Network Access Control List (NACL)','Security Groups','IAM Policies','VPC Route Tables'],
ans:1,exp:'<strong>Security Groups</strong> 运行在 EC2 实例级别，是控制 EC2 入站/出站流量的防火墙。它只包含 Allow 规则，有状态（Stateful）。<br><br>NACL 运行在子网级别，适合控制整个子网的流量，而不是单个实例。',ww:'NACL 是子网级别的无状态防火墙，不是实例级别（A 范围不对）。IAM 控制 AWS API 权限，不控制网络流量（C 完全无关）。Route Tables 控制路由，不是流量过滤（D 错）。',rule:'控制 EC2 实例级别的进出流量 → Security Groups（不是 NACL）。'},

{id:'ec2f_02',topic:'购买模式',diff:'mid',
text:'EC2 Reserved Instance 的<em>预留期限</em>可以是多长时间？',
en:'How long can you reserve an EC2 Reserved Instance?',
ch:['6 个月或 1 年','1 年或 3 年','2 年或 4 年','任意时长，按月计费'],
ench:['6 months or 1 year','1 year or 3 years','2 years or 4 years','Any duration, billed monthly'],
ans:1,exp:'EC2 Reserved Instance <strong>只能选择 1 年或 3 年</strong>两种预留期限。<br><br>• 1 年：折扣较少，灵活性稍高<br>• 3 年：折扣最大（最高 72%），但锁定时间更长<br><br>没有 6 个月、2 年等其他选项。',ww:'没有 6 个月的 Reserved Instance（A 错）。没有 2 年或 4 年（C 错）。Reserved 不支持按月计费（D 是 On-Demand 的特性）。',rule:'Reserved Instance：只有 1 年 或 3 年，没有其他选项。3 年折扣更大。'},

{id:'ec2f_03',topic:'EC2 实例类型',diff:'high',
text:'你需要在 EC2 上部署 <em>High-Performance Computing（HPC）</em>应用。应选哪种实例类型？',
en:'You want to deploy a <em>High-Performance Computing (HPC)</em> application on EC2. Which instance type should you choose?',
ch:['Storage Optimized（存储优化型）','Compute Optimized（计算优化型）','Memory Optimized（内存优化型）','General Purpose（通用型）'],
ench:['Storage Optimized','Compute Optimized','Memory Optimized','General Purpose'],
ans:1,exp:'<strong>Compute Optimized</strong> 实例配备高性能处理器，非常适合需要高算力的任务：<br>• HPC 高性能计算<br>• 批处理任务<br>• 媒体转码<br>• 科学建模 & 机器学习<br>• 游戏服务器<br><br>代表型号：C5、C6g、C6i 系列。',ww:'Storage Optimized 优化的是本地磁盘 IOPS（A 错方向）。Memory Optimized 优化的是 RAM 容量（C 错）。通用型没有特别的 CPU 优化（D 错）。',rule:'HPC / 批处理 / 科学建模 / 媒体转码 → Compute Optimized（C 系列）。'},

{id:'ec2f_04',topic:'购买模式',diff:'mid',
text:'你计划运行一个应用，<em>需要在服务器上持续稳定运行 1 年</em>。应选哪种购买方式来节省成本？',
en:'You plan to run an application <em>continuously on a server for 1 year</em>. Which purchasing option saves the most cost?',
ch:['Spot Instances','Reserved Instances','On-Demand Instances','Dedicated Instances'],
ench:['Spot Instances','Reserved Instances','On-Demand Instances','Dedicated Instances'],
ans:1,exp:'<strong>Reserved Instances</strong> 专为长期稳定运行的工作负载设计，承诺使用 1 年或 3 年，折扣最高可达 72%（相比 On-Demand）。<br><br>适合：24/7 稳定运行的应用、数据库、持续运行的 Web 服务。',ww:'Spot 可以被中断（A 不适合需要持续稳定的应用）。On-Demand 灵活但最贵（C 成本最高）。Dedicated Instances 成本高，且用于物理隔离场景（D 不必要）。',rule:'持续稳定 + 长期（1-3年）→ Reserved Instance。这是最省钱的选择。'},

{id:'ec2f_05',topic:'EC2 核心',diff:'mid',
text:'你准备启动一批 EC2 实例，需要在<em>首次启动时自动安装软件并更新 OS 包</em>。最佳方式是？',
en:'You are launching EC2 instances and need to <em>automatically install software and update OS packages on first launch</em>. What is the best approach?',
ch:['通过 SSH 逐台连接，手动安装软件','联系 AWS Support，让他们在启动时运行脚本','写好 bash 脚本，在启动 EC2 时通过 <strong>EC2 User Data</strong> 传入执行','使用 AMI，提前将所有软件预装到镜像里'],
ench:['SSH into each instance and manually install software','Contact AWS Support to run scripts at launch','Write a bash script and pass it via <strong>EC2 User Data</strong> at launch','Use an AMI with all software pre-installed'],
ans:2,exp:'<strong>EC2 User Data</strong> 是专门用于实例首次启动时自动执行脚本的功能。你可以放入 bash 脚本，它会在实例<strong>首次启动时以 root 权限自动执行</strong>，完成软件安装、OS 更新、环境配置等操作。<br><br>特点：<br>• 默认只在首次启动执行一次<br>• 以 root 权限运行<br>• 大小上限 16 KB',ww:'手动 SSH 安装不可扩展（A 效率极低）。AWS Support 不负责运行用户脚本（B 不可能）。AMI 适合预先打包固定软件，但比 User Data 灵活性低（D 不是最佳）。',rule:'首次启动自动初始化（安装软件/配置环境）→ EC2 User Data（bash 脚本，以 root 执行一次）。'},

{id:'ec2f_06',topic:'EC2 实例类型',diff:'mid',
text:'你有一个关键业务应用，使用<em>内存数据库（in-memory database）</em>。应选哪种 EC2 实例类型？',
en:'You have a critical application using an <em>in-memory database</em>. Which EC2 instance type should you choose?',
ch:['Compute Optimized（计算优化型）','Storage Optimized（存储优化型）','Memory Optimized（内存优化型）','General Purpose（通用型）'],
ench:['Compute Optimized','Storage Optimized','Memory Optimized','General Purpose'],
ans:2,exp:'<strong>Memory Optimized</strong> 实例提供超大 RAM 容量，专为需要在内存中处理大型数据集的场景设计。内存数据库（Redis、Memcached、SAP HANA 等）的数据完全存放在 RAM 中，因此需要尽量大的内存。<br><br>代表型号：R6g、R6i、X1e、z1d 系列。',ww:'Compute 优化 CPU 计算，不是 RAM（A 错）。Storage 优化本地磁盘 IOPS，不是内存（B 错）。通用型 RAM 不够大（D 错）。',rule:'内存数据库 / 大型数据集全在 RAM / 实时大数据分析 → Memory Optimized（R 系列）。'},

{id:'ec2f_07',topic:'EC2 实例类型',diff:'high',
text:'你有一个电商应用，其 OLTP 数据库运行在本地（on-premises），每秒处理数千个请求。你想把数据库迁移到 EC2 实例。应选哪种实例类型来处理这个<em>高频 OLTP 数据库</em>？',
en:'You have an e-commerce app with an OLTP database running on-premises, handling thousands of requests per second. You want to migrate to EC2. Which instance type handles this <em>high-frequency OLTP database</em>?',
ch:['Compute Optimized（计算优化型）','Storage Optimized（存储优化型）','Memory Optimized（内存优化型）','General Purpose（通用型）'],
ench:['Compute Optimized','Storage Optimized','Memory Optimized','General Purpose'],
ans:1,exp:'<strong>Storage Optimized</strong> 专为需要对<strong>本地存储高速顺序读写</strong>的场景设计，能提供每秒数万 IOPS 的低延迟 I/O 操作，非常适合高频 OLTP 数据库。<br><br>适用：OLTP 系统、关系型 & NoSQL 数据库、Redis 磁盘缓存、数据仓库、分布式文件系统。代表：I3、I3en、D2、H1。',ww:'Compute 优化 CPU 算力（A 错）。Memory 优化 RAM 大小（C 错方向）。通用型性能均衡，不是最优（D 错）。',rule:'高频 OLTP / 本地存储顺序读写 / 分布式文件系统 → Storage Optimized（I3 系列）。'},

{id:'ec2f_08',topic:'Security Groups',diff:'mid',
text:'判断对错：Security Groups 只能附加到<em>一台</em> EC2 实例上。',
en:'True or False: Security Groups can be attached to only <em>one</em> EC2 instance.',
ch:['True（正确，每个 SG 只能附加一台实例）','False（错误，一个 SG 可以附加到同一 Region/VPC 内的多台实例）'],
ench:['True — each SG can only be attached to one instance','False — a Security Group can be attached to multiple EC2 instances within the same Region/VPC'],
ans:1,exp:'<strong>False。</strong> Security Group 可以同时附加到<strong>同一 AWS Region/VPC 内的多台 EC2 实例</strong>上。<br><br>反过来也一样：一台 EC2 实例可以同时附加多个 Security Group，规则取所有 SG 的并集（任何一个 SG 允许就允许）。',ww:'SG 不是一对一关系，可以多对多（True 错）。',rule:'SG 是多对多关系：一个 SG → 多台实例；一台实例 → 多个 SG。规则取所有 SG 的并集。'},

{id:'ec2f_09',topic:'购买模式',diff:'high',
text:'你计划将本地应用迁移到 AWS。公司有严格的<em>合规要求</em>，需要在专用服务器上运行。同时你需要使用自己的<em>服务器绑定软件许可证（BYOL）</em>来降低成本。应选哪种购买方式？',
en:'You plan to migrate on-premises apps to AWS. Your company has strict <em>compliance requirements</em> requiring dedicated servers. You also need to use your own <em>server-bound software license (BYOL)</em>. Which option suits you?',
ch:['Convertible Reserved Instances','Dedicated Hosts','Spot Instances','On-Demand Instances'],
ench:['Convertible Reserved Instances','Dedicated Hosts','Spot Instances','On-Demand Instances'],
ans:1,exp:'<strong>Dedicated Hosts</strong> 提供对整台物理服务器的完全可见性和控制权，满足：<br>• <strong>合规要求</strong>：物理隔离，只有你使用整台服务器<br>• <strong>BYOL 支持</strong>：可以看到 Socket 数和物理 Core 数，满足 per-socket/per-core 许可证绑定需求<br><br>这是 AWS 成本最高的购买选项，但在 BYOL 场景下反而可以节省许可证费用。',ww:'Convertible Reserved 是灵活型预留，不能满足 BYOL 和合规的物理隔离要求（A 错）。Spot 可被中断，不适合生产合规场景（C 错）。On-Demand 没有物理隔离（D 错）。',rule:'合规要求 + BYOL 许可证 → Dedicated Hosts（不是 Dedicated Instances，不是 Reserved）。'},

{id:'ec2f_10',topic:'购买模式',diff:'high',
text:'你需要在 EC2 上部署数据库，供应商许可证基于<em>物理核心数（physical cores）和网络 Socket 可见性</em>计费。哪种购买选项可以让你看到这些信息？',
en:'You are deploying a database on EC2. The vendor license bills based on <em>physical cores and underlying network socket visibility</em>. Which purchasing option gives you visibility into these?',
ch:['Spot Instances','On-Demand Instances','Dedicated Hosts','Reserved Instances'],
ench:['Spot Instances','On-Demand Instances','Dedicated Hosts','Reserved Instances'],
ans:2,exp:'<strong>Dedicated Hosts</strong> 是唯一一种提供对物理服务器完全可见性的选项，你可以看到：<br>• <strong>物理 Socket 数量</strong><br>• <strong>物理 Core 数量</strong><br>• 服务器的硬件配置详情<br><br>这使它成为需要 per-socket 或 per-core 软件许可证（如 Oracle、Windows Server 等）场景的首选。',ww:'Spot/On-Demand/Reserved 都无法提供物理主机的可见性（A/B/D 错）。',rule:'需要看到物理 Socket 数 / Core 数 → Dedicated Hosts。这是 BYOL 许可证场景的唯一选择。'},

{id:'ec2f_11',topic:'购买模式',diff:'mid',
text:'Spot Fleet 是一组 Spot Instances 加上可选的 .............. 的组合。',
en:'Spot Fleet is a set of Spot Instances and optionally ...............',
ch:['Reserved Instances','On-Demand Instances','Dedicated Hosts','Dedicated Instances'],
ench:['Reserved Instances','On-Demand Instances','Dedicated Hosts','Dedicated Instances'],
ans:1,exp:'<strong>Spot Fleet = Spot Instances + （可选）On-Demand Instances</strong><br><br>Spot Fleet 会尝试在满足价格约束的前提下达到目标容量：<br>• 定义多个启动池（实例类型 + OS + AZ 的组合）<br>• Fleet 自动从最优池启动 Spot，当 Spot 容量不足时可以补充 On-Demand<br>• 当达到目标容量或最大成本时停止启动<br><br>分配策略：lowestPrice、diversified、capacityOptimized、priceCapacityOptimized（推荐）',ww:'Spot Fleet 不包含 Reserved Instances（A 错）。Dedicated Hosts/Instances 是物理隔离选项，不在 Spot Fleet 的组合中（C/D 错）。',rule:'Spot Fleet = Spot Instances + 可选的 On-Demand Instances。推荐策略：priceCapacityOptimized。'},

/* ── EC2 网络 IP ── */
{id:'ip_01',topic:'EC2 网络',diff:'mid',
text:'EC2 实例在 <em>Stop 后再 Start</em>，其 Public IP 会怎样？如何保留固定的公网 IP？',
en:'An EC2 instance is <em>stopped and then started</em>. What happens to its Public IP? How do you keep a fixed public IP?',
ch:['Public IP 不变，停止重启也保持不变','Public IP 会改变，需要使用 Elastic IP 来保留固定公网 IP','Public IP 会变成 Private IP','Public IP 自动变为 Elastic IP'],
ench:['Public IP remains the same after stop/start','Public IP changes on stop/start — use Elastic IP to have a fixed public IP','Public IP becomes a Private IP','Public IP automatically becomes an Elastic IP'],
ans:1,exp:'EC2 实例被 Stop 再 Start 后，<strong>Public IP 会改变</strong>（重新分配）。Private IP 不变。<br><br>如果你需要一个<strong>固定不变的公网 IP</strong>，需要申请 <strong>Elastic IP</strong>：<br>• Elastic IP 是你拥有的 IPv4 地址，只要不释放就一直保留<br>• 可以快速重新映射到账号内的其他实例（用于故障转移）<br>• 每个账号默认最多 5 个（可申请增加）',ww:'Stop/Start 后 Public IP 会变（A 错）。Public IP 不会变成 Private IP（C 错）。不会自动变成 Elastic IP（D 错）。',rule:'EC2 Stop/Start → Public IP 改变，Private IP 不变。需要固定公网 IP → 使用 Elastic IP。'},

{id:'ip_02',topic:'EC2 网络',diff:'mid',
text:'关于 Elastic IP，以下哪项说法<em>正确</em>？',
en:'Which statement about Elastic IP is <em>correct</em>?',
ch:['Elastic IP 是私有 IP，只能在 VPC 内使用','每个账号最多 5 个 Elastic IP，Elastic IP 只要不释放就一直属于你','Elastic IP 会随 EC2 实例一起自动删除','Elastic IP 是免费的，不产生任何费用'],
ench:['Elastic IP is a private IP only usable within a VPC','Each account gets up to 5 Elastic IPs — they remain yours as long as you do not release them','Elastic IP is deleted automatically when EC2 is terminated','Elastic IP is completely free with no charges'],
ans:1,exp:'<strong>Elastic IP</strong> 的核心特性：<br>• 是<strong>公网 IPv4 地址</strong>（不是私有 IP）<br>• 只要你不主动释放（Release），就一直属于你<br>• 每个 AWS 账号默认最多 <strong>5 个</strong>（可联系 AWS 申请增加）<br>• 可以快速重新映射到同一账号内的另一台实例（用于故障转移）<br><br>⚠️ 注意：Elastic IP <strong>未关联实例时会产生收费</strong>，关联并使用中的 Elastic IP 免费。',ww:'Elastic IP 是公网 IP，不是私有 IP（A 错）。Elastic IP 与 EC2 独立，不会随实例删除（C 错）。未关联实例时会收费（D 错）。',rule:'Elastic IP = 固定公网 IP，最多 5 个/账号，不释放就一直属于你。未关联实例时收费！'},

{id:'ip_03',topic:'EC2 网络',diff:'mid',
text:'关于 Public IP 和 Private IP 的区别，以下哪项<em>正确</em>？',
en:'Which statement correctly describes the difference between Public IP and Private IP?',
ch:['两台不同公司的机器可以有相同的 Public IP','Public IP 在整个互联网上必须唯一；Private IP 在私有网络内唯一，但不同的私有网络可以有相同的 Private IP','Private IP 可以直接访问互联网','Public IP 和 Private IP 没有区别'],
ench:['Two machines from different companies can share the same Public IP','Public IP must be globally unique; Private IP is unique within a private network, but different private networks can share the same Private IPs','Private IP can directly access the internet','Public IP and Private IP are the same'],
ans:1,exp:'<strong>Public IP</strong>：<br>• 在整个互联网上<strong>全局唯一</strong>，任何两台机器不能有相同的 Public IP<br>• 可以被互联网直接访问<br>• 可以被地理定位<br><br><strong>Private IP</strong>：<br>• 只在私有网络内唯一<br>• 不同公司/VPC 可以有<strong>相同</strong>的 Private IP（如 Company A 和 Company B 都可以用 192.168.1.1）<br>• 需要通过 Internet Gateway（代理）才能访问互联网',ww:'Public IP 全局唯一，不同机器不能共享（A 错）。Private IP 不能直接访问互联网，需要通过 Internet Gateway（C 错）。两者有本质区别（D 错）。',rule:'Public IP：全局唯一，可直接上网。Private IP：网络内唯一，不同私有网络可重复，上网需经 Internet Gateway。'},

/* ── 可扩展性 & 高可用性 ── */
{id:'ha_01',topic:'可扩展性与高可用',diff:'mid',
text:'<em>垂直扩展（Vertical Scalability）</em>和<em>水平扩展（Horizontal Scalability）</em>的核心区别是什么？',
en:'What is the core difference between <em>Vertical Scalability</em> and <em>Horizontal Scalability</em>?',
ch:['垂直扩展 = 增加实例数量；水平扩展 = 增大实例规格','垂直扩展 = 增大实例规格（scale up）；水平扩展 = 增加实例数量（scale out）','两者都是增加实例规格','两者都是增加实例数量'],
ench:['Vertical = add more instances; Horizontal = increase instance size','Vertical = increase instance size (scale up); Horizontal = increase number of instances (scale out)','Both increase instance size','Both increase number of instances'],
ans:1,exp:'<strong>垂直扩展（Vertical / Scale Up/Down）</strong>：增大单台实例的规格，如从 t2.micro → t2.large。<br>• 有硬件上限，不能无限扩<br>• 常用于非分布式系统，如数据库（RDS、ElastiCache）<br><br><strong>水平扩展（Horizontal / Scale Out/In）</strong>：增加实例数量，如从 1 台 → 10 台。<br>• 需要分布式系统支持<br>• Web 应用/现代应用常见<br>• AWS 通过 Auto Scaling Group 和 Load Balancer 实现',ww:'A 搞反了垂直和水平的定义。',rule:'垂直 = 变大（1台更强）；水平 = 变多（更多台）。数据库常用垂直，Web 应用常用水平。'},

{id:'ha_02',topic:'可扩展性与高可用',diff:'high',
text:'<em>高可用性（High Availability）</em>的核心目标是什么？它与水平扩展有什么关系？',
en:'What is the core goal of <em>High Availability</em>? How does it relate to horizontal scaling?',
ch:['让应用运行得更快，提升性能','让应用在至少 2 个 AZ 运行，即使某个 AZ（数据中心）故障也能存活','减少成本，用更少实例服务更多请求','让应用只在一个数据中心内运行'],
ench:['Make the application run faster and improve performance','Run the application in at least 2 AZs so it survives a data center failure','Reduce cost by serving more requests with fewer instances','Run the application in a single data center'],
ans:1,exp:'<strong>High Availability（高可用性）</strong>的核心目标：在<strong>至少 2 个 Availability Zones（数据中心）</strong>运行应用，这样即使一个 AZ 完全故障（停电、灾难等），另一个 AZ 的实例仍然可以正常服务。<br><br>它通常配合水平扩展使用：<br>• <strong>被动高可用</strong>（Passive）：如 RDS Multi-AZ，主库故障自动切换到备库<br>• <strong>主动高可用</strong>（Active）：如 Load Balancer + 多 AZ 的 Auto Scaling Group',ww:'高可用目标是"生存"，不是"更快"（A 错）。单一数据中心无法做到高可用（D 错）。',rule:'高可用 = 跨 ≥ 2 个 AZ 运行，目的是在数据中心故障时不中断服务。'},

{id:'ha_03',topic:'可扩展性与高可用',diff:'mid',
text:'在 EC2 的架构中，实现<em>水平扩展（Horizontal Scaling）</em>需要使用哪些 AWS 服务？',
en:'In EC2 architecture, which AWS services are used to achieve <em>Horizontal Scaling</em>?',
ch:['增大实例规格（如 t2.micro → t2.xlarge）','Auto Scaling Group（ASG）+ Load Balancer','Reserved Instances + Savings Plans','Dedicated Hosts + Spot Instances'],
ench:['Increase instance size (e.g. t2.micro → t2.xlarge)','Auto Scaling Group (ASG) + Load Balancer','Reserved Instances + Savings Plans','Dedicated Hosts + Spot Instances'],
ans:1,exp:'EC2 的水平扩展工具：<br>• <strong>Auto Scaling Group（ASG）</strong>：自动根据负载增加/减少实例数量（Scale Out/In）<br>• <strong>Load Balancer</strong>：将流量均匀分配到多台实例，并支持跨 AZ 部署<br><br>配合 Multi-AZ 部署，同时实现水平扩展 + 高可用。',ww:'增大规格是垂直扩展，不是水平扩展（A 错）。Reserved/Savings Plans 是计费方式，不是扩展工具（C 错）。',rule:'水平扩展 = Auto Scaling Group + Load Balancer。高可用 = 跨 AZ 的 ASG + Load Balancer。'},

/* ── Load Balancer ── */
{id:'elb_01',topic:'Load Balancer',diff:'mid',
text:'使用 Load Balancer 的主要好处有哪些？（选最完整的描述）',
en:'What are the main benefits of using a Load Balancer? (Choose the most complete description)',
ch:['仅用于提高网络速度','将流量分散到多台实例、暴露单一访问入口（DNS）、健康检查、SSL 终止、跨 AZ 高可用','只用于保存用户 Session','仅用于加密流量'],
ench:['Only for improving network speed','Spread load across instances, expose single DNS entry point, health checks, SSL termination, HA across AZs','Only for storing user sessions','Only for encrypting traffic'],
ans:1,exp:'Load Balancer 提供的核心功能：<br>① <strong>分散负载</strong>：将请求均匀分配到多台下游实例<br>② <strong>单一入口</strong>：暴露一个 DNS 名称（而不是暴露实例 IP）<br>③ <strong>健康检查</strong>：自动检测不健康实例并停止向其发送流量<br>④ <strong>SSL 终止</strong>：为网站提供 HTTPS<br>⑤ <strong>Stickiness</strong>：通过 Cookie 让用户固定连接到同一实例<br>⑥ <strong>高可用</strong>：跨 AZ 分布实例<br>⑦ <strong>流量隔离</strong>：公网流量 → LB → 私网流量 → 实例',ww:'只列出部分功能的选项（A/C/D）都不完整。',rule:'Load Balancer 七大功能：分散负载、单一DNS入口、健康检查、SSL终止、Stickiness、跨AZ高可用、公私网隔离。'},

{id:'elb_02',topic:'Load Balancer',diff:'mid',
text:'关于 <em>Elastic Load Balancer（ELB）</em>，为什么选择 AWS 托管的 ELB 而不是自建负载均衡器？',
en:'Regarding <em>Elastic Load Balancer (ELB)</em>, why choose AWS managed ELB over self-managed load balancer?',
ch:['ELB 免费，自建负载均衡器收费','ELB 是 AWS 托管服务，AWS 负责保证可用性、升级维护，并与 EC2、ECS、ACM、Route 53 等深度集成','ELB 性能比自建负载均衡器差','ELB 只能用于 EC2，不支持其他服务'],
ench:['ELB is free; self-managed load balancers cost money','ELB is a managed service — AWS guarantees availability, handles upgrades/maintenance, and integrates deeply with EC2, ECS, ACM, Route 53, etc.','ELB has worse performance than self-managed','ELB only works with EC2 and not other services'],
ans:1,exp:'<strong>Elastic Load Balancer</strong> 是 AWS 的<strong>托管</strong>负载均衡服务，AWS 负责：<br>• 保证它一直正常工作（高可用）<br>• 自动处理升级和维护<br>• 只需少量配置<br><br>集成的 AWS 服务包括：EC2、EC2 Auto Scaling Groups、Amazon ECS、AWS Certificate Manager（ACM）、CloudWatch、Route 53、AWS WAF、Global Accelerator。<br><br>自建虽然成本低一些，但运维复杂度高很多。',ww:'ELB 不是免费的（A 错）。ELB 和自建都可以有好性能（C 错）。ELB 支持多种服务（D 错）。',rule:'选 ELB 原因：托管（AWS 保证可用），与其他 AWS 服务深度集成，省运维成本。'},

{id:'elb_03',topic:'Load Balancer',diff:'high',
text:'健康检查（Health Check）的作用是什么？ELB 如何判断实例是否健康？',
en:'What is the purpose of Health Checks? How does ELB determine if an instance is healthy?',
ch:['用于监控 CPU 使用率，不影响流量路由','ELB 向实例的特定端口和路径发送请求，如果收到 200（OK）响应则认为健康，不健康的实例不会收到流量','用于备份实例数据','用于检测实例的 RAM 用量'],
ench:['Used to monitor CPU usage without affecting traffic routing','ELB sends a request to a specific port and path on each instance; a 200 (OK) response means healthy — unhealthy instances stop receiving traffic','Used to back up instance data','Used to detect RAM usage on instances'],
ans:1,exp:'<strong>Health Check</strong> 的工作原理：<br>• ELB 定期向实例的指定<strong>端口 + 路径</strong>发送 HTTP 请求（常用 <code>/health</code>）<br>• 如果响应是 <strong>200 OK</strong> → 实例健康，继续接收流量<br>• 如果响应<strong>不是 200</strong> → 实例不健康，ELB 自动停止向其发流量<br><br>例如：Protocol: HTTP，Port: 4567，Endpoint: /health',ww:'Health Check 直接影响流量路由，不健康的实例会被剔除（A 错）。不用于备份或内存监控（C/D 错）。',rule:'Health Check：ELB 发 HTTP 请求 → 返回 200 = 健康。不健康的实例自动被踢出流量池。'},

{id:'elb_04',topic:'Load Balancer',diff:'high',
text:'AWS 有哪 4 种托管 Load Balancer？分别适用于什么协议/场景？',
en:'AWS has 4 types of managed Load Balancers. What protocols/scenarios does each support?',
ch:['只有 1 种：ALB（应用负载均衡器）','ALB（HTTP/HTTPS/WebSocket）、NLB（TCP/UDP）、GWLB（IP 层网络安全）、CLB（旧代，HTTP/TCP）','只有 ALB 和 NLB 两种','ALB（UDP）、NLB（HTTP）、GWLB（WebSocket）、CLB（IP）'],
ench:['Only 1 type: ALB','ALB (HTTP/HTTPS/WebSocket), NLB (TCP/UDP), GWLB (IP layer network security), CLB (old gen, HTTP/TCP)','Only ALB and NLB','ALB (UDP), NLB (HTTP), GWLB (WebSocket), CLB (IP)'],
ans:1,exp:'AWS 的 4 种负载均衡器：<br><br>① <strong>CLB（Classic LB）</strong>：2009年，v1 旧代，支持 HTTP/HTTPS/TCP/SSL，不推荐使用<br>② <strong>ALB（Application LB）</strong>：2016年，v2 新代，支持 HTTP/HTTPS/WebSocket，可基于 URL 路径、域名、Query String 做路由，适合微服务和容器<br>③ <strong>NLB（Network LB）</strong>：2017年，v2 新代，支持 TCP/TLS/UDP，超低延迟，适合高性能需求<br>④ <strong>GWLB（Gateway LB）</strong>：2020年，运行在网络层（Layer 3，IP 协议），用于部署防火墙、入侵检测等网络安全设备',ww:'AWS 有 4 种，不是 1 种（A 错）。协议对应关系 D 全部搞混了。',rule:'ALB = HTTP（第7层，可按 URL 路由）。NLB = TCP/UDP（第4层，超低延迟）。GWLB = IP（第3层，安全设备）。CLB = 旧代，不推荐。'},

{id:'elb_05',topic:'Load Balancer',diff:'high',
text:'应用需要根据 URL 路径路由到不同后端服务（如 /users → 用户服务，/search → 搜索服务）。应选哪种 Load Balancer？',
en:'Your app needs to route traffic to different backends based on URL path (/users → user service, /search → search service). Which Load Balancer should you use?',
ch:['Network Load Balancer（NLB）','Application Load Balancer（ALB）','Classic Load Balancer（CLB）','Gateway Load Balancer（GWLB）'],
ench:['Network Load Balancer (NLB)','Application Load Balancer (ALB)','Classic Load Balancer (CLB)','Gateway Load Balancer (GWLB)'],
ans:1,exp:'<strong>ALB（Application Load Balancer）</strong>运行在 HTTP 层（第 7 层），可以根据以下内容做<strong>智能路由</strong>：<br>• URL <strong>路径</strong>（/users，/search，/api）<br>• URL <strong>域名</strong>（one.example.com，other.example.com）<br>• <strong>Query String / Header</strong>（?platform=mobile）<br><br>非常适合微服务架构和容器化应用（Docker/ECS），可以一个 ALB 后面挂多个 Target Group。',ww:'NLB 工作在 TCP/UDP 层，不支持基于 URL 路径路由（A 错）。CLB 是旧代，功能有限（C 错）。GWLB 用于网络安全设备（D 错）。',rule:'需要基于 URL/域名/Query String 路由 → ALB。需要超低延迟 TCP/UDP → NLB。'},

{id:'elb_06',topic:'Load Balancer',diff:'high',
text:'使用 ALB 后，EC2 实例<em>看不到客户端的真实 IP</em>。如何获取客户端的真实 IP？',
en:'After using an ALB, EC2 instances <em>cannot see the client\'s real IP</em> directly. How do you get the client\'s real IP?',
ch:['直接从 EC2 的网络接口获取','查看 HTTP 请求头中的 <strong>X-Forwarded-For</strong> 字段','ALB 会自动把客户端 IP 写入响应体','无法获取客户端真实 IP'],
ench:['Get it directly from the EC2 network interface','Check the <strong>X-Forwarded-For</strong> header in the HTTP request','ALB automatically writes the client IP into the response body','The real client IP cannot be retrieved'],
ans:1,exp:'ALB 在转发请求时会<strong>终止（terminate）</strong>客户端的 TCP 连接，然后以 ALB 的私有 IP 向 EC2 发起新的连接。因此 EC2 看到的是 ALB 的 IP，不是客户端的 IP。<br><br>客户端的真实 IP 被放入 HTTP 请求头：<br>• <strong>X-Forwarded-For</strong>：客户端真实 IP<br>• <strong>X-Forwarded-Port</strong>：客户端端口<br>• <strong>X-Forwarded-Proto</strong>：协议（HTTP 或 HTTPS）',ww:'EC2 收到的请求来自 ALB 的 IP（A 错）。ALB 不写入响应体（C 错）。通过 X-Forwarded-For 可以获取（D 错）。',rule:'ALB 后面获取客户端真实 IP → 读 HTTP 请求头 X-Forwarded-For 字段。'},

{id:'elb_07',topic:'Load Balancer',diff:'high',
text:'客户需要将流量发送到一个<em>固定的、可预测的 IP 地址</em>，并且需要支持 TCP/UDP 协议。应该选择哪种 Load Balancer？',
en:'A client needs to send traffic to a <em>fixed, predictable IP address</em> and requires TCP/UDP protocol support. Which Load Balancer should you use?',
ch:['Application Load Balancer（ALB）—— 它有固定 DNS 名称','Network Load Balancer（NLB）—— 每个 AZ 有一个静态 IP，支持绑定 Elastic IP','Gateway Load Balancer（GWLB）—— 专为固定 IP 设计','Classic Load Balancer（CLB）—— 最古老，IP 最稳定'],
ench:['Application Load Balancer (ALB) — it has a fixed DNS name','Network Load Balancer (NLB) — one static IP per AZ, supports assigning Elastic IP','Gateway Load Balancer (GWLB) — designed for fixed IP','Classic Load Balancer (CLB) — oldest, most stable IP'],
ans:1,exp:'<strong>NLB（Network Load Balancer）</strong> 的关键特性：<br>• 每个 AZ 分配一个<strong>静态 IP（Static IP per AZ）</strong><br>• 支持绑定 <strong>Elastic IP</strong>（适合需要 IP 白名单 Whitelisting 的场景）<br>• 工作在第 4 层（Layer 4 / Transport Layer），支持 TCP/TLS/UDP<br>• 超低延迟（~100ms，vs ALB ~400ms）<br><br>ALB 只有 DNS 名称，没有固定 IP（A 错）。GWLB 用于安全设备（C 错）。CLB 是旧代（D 错）。',ww:'ALB 是 DNS-based，没有固定 IP。需要固定 IP 或 IP 白名单 → NLB。',rule:'需要固定静态 IP（Static IP）或 Elastic IP → NLB。需要 URL 路由 → ALB。'},

{id:'elb_08',topic:'Load Balancer',diff:'high',
text:'关于 NLB 的 Target Group，以下哪项<em>不是</em> NLB 支持的目标类型？',
en:'Regarding NLB Target Groups, which of the following is <em>NOT</em> a supported target type for NLB?',
ch:['EC2 Instances','IP Addresses（必须是私有 IP）','Application Load Balancer（ALB）','Lambda Functions'],
ench:['EC2 Instances','IP Addresses (must be private IPs)','Application Load Balancer (ALB)','Lambda Functions'],
ans:3,exp:'NLB 的 Target Group 支持三种类型：<br>① <strong>EC2 Instances</strong><br>② <strong>IP Addresses</strong>（必须是私有 IP）<br>③ <strong>Application Load Balancer</strong>（NLB + ALB 组合——先用 NLB 获得静态 IP，再用 ALB 做 URL 路由）<br><br><strong>Lambda Functions</strong> 是 ALB 支持的，NLB 不支持。<br><br>NLB Health Check 支持的协议：<strong>TCP、HTTP、HTTPS</strong>。',ww:'Lambda 是 ALB 的 Target Group 类型，不是 NLB 的。NLB + ALB 组合是一个重要的考点。',rule:'NLB Target Group：EC2 / IP / ALB（三种）。Lambda 只属于 ALB。'},

{id:'elb_09',topic:'Load Balancer',diff:'high',
text:'关于 <em>Cross-Zone Load Balancing（跨可用区负载均衡）</em>，ALB 的默认行为是什么？费用如何？',
en:'Regarding <em>Cross-Zone Load Balancing</em>, what is the default behavior for ALB? What are the charges?',
ch:['ALB 默认关闭，开启后跨 AZ 传输收费','ALB 默认开启，跨 AZ 传输不收费','ALB 默认开启，跨 AZ 传输收费','ALB 默认关闭，开启后跨 AZ 传输不收费'],
ench:['ALB: disabled by default, charged for inter-AZ data if enabled','ALB: enabled by default, no charge for inter-AZ data','ALB: enabled by default, charged for inter-AZ data','ALB: disabled by default, no charge for inter-AZ data if enabled'],
ans:1,exp:'<strong>Cross-Zone Load Balancing</strong> 各类型默认值对比：<br><br>| LB 类型 | 默认状态 | 跨 AZ 费用 |<br>|---------|---------|------------|<br>| <strong>ALB</strong> | 默认<strong>开启</strong> | <strong>免费</strong>（可在 Target Group 级别关闭）|<br>| <strong>NLB & GWLB</strong> | 默认<strong>关闭</strong> | 开启后<strong>收费</strong> |<br>| <strong>CLB</strong> | 默认关闭 | 开启后免费 |<br><br>Cross-Zone Load Balancing 开启后：每个 LB 节点把流量平均分配到<strong>所有 AZ 的所有实例</strong>，而不是只分配给本 AZ 的实例。',ww:'不同 LB 类型的默认值不同，ALB 默认开启且免费是重要考点。',rule:'Cross-Zone：ALB=默认ON/免费。NLB&GWLB=默认OFF/收费。CLB=默认OFF/免费。'},

{id:'elb_10',topic:'Load Balancer',diff:'high',
text:'用户配置了 Sticky Sessions（Session Affinity）。这可能带来什么<em>副作用</em>？',
en:'A user configured Sticky Sessions (Session Affinity). What is a potential <em>side effect</em>?',
ch:['会导致请求延迟增加，因为需要查找 Cookie','可能造成后端 EC2 实例之间负载不均衡（Load Imbalance）','Sticky Sessions 只在 ALB 有效，NLB 不支持','会导致 HTTPS 证书失效'],
ench:['Increases request latency due to cookie lookup','May cause load imbalance among backend EC2 instances','Sticky Sessions only works with ALB, not NLB','Causes HTTPS certificate invalidation'],
ans:1,exp:'<strong>Sticky Sessions（Session Affinity / 粘性会话）</strong>：通过 Cookie 确保同一客户端每次都路由到<strong>同一台后端实例</strong>。<br><br>副作用：<strong>负载不均衡（Load Imbalance）</strong>——如果某些客户端流量特别大，它们绑定的那台实例会过载，而其他实例轻载。<br><br>支持情况：<strong>CLB、ALB、NLB</strong> 均支持。<br>Cookie 有过期时间（Expiration Date），由你控制。<br>使用场景：确保用户 Session 数据不丢失（如购物车、登录状态）。',ww:'Sticky Sessions 增加的延迟可忽略（A 错）。ALB 和 NLB 都支持（C 错）。和证书无关（D 错）。',rule:'Sticky Sessions → 同一客户端总是路由到同一实例 → 可能造成负载不均衡（Load Imbalance）。'},

{id:'elb_11',topic:'Load Balancer',diff:'high',
text:'考试看到"在端口 6081 使用 GENEVE 协议"，这对应的是哪种 AWS Load Balancer？',
en:'In an exam question you see "uses GENEVE protocol on port 6081". Which AWS Load Balancer does this correspond to?',
ch:['Application Load Balancer（ALB）','Network Load Balancer（NLB）','Gateway Load Balancer（GWLB）','Classic Load Balancer（CLB）'],
ench:['Application Load Balancer (ALB)','Network Load Balancer (NLB)','Gateway Load Balancer (GWLB)','Classic Load Balancer (CLB)'],
ans:2,exp:'<strong>Gateway Load Balancer（GWLB）</strong> 的关键识别特征：<br>• 使用 <strong>GENEVE 协议，端口 6081</strong><br>• 工作在第 3 层（Layer 3 / Network Layer），处理 IP 数据包（IP Packets）<br>• 用途：在流量到达应用之前，先经过<strong>第三方网络安全虚拟设备</strong>（防火墙 Firewall、入侵检测系统 IDS/IPS、深度包检测 DPI 等）<br>• 结合了两个功能：<strong>Transparent Network Gateway</strong>（单一出入口）+ <strong>Load Balancer</strong>（分发到安全设备群）',ww:'GENEVE/6081 是 GWLB 的专属标志，考试见到这个关键词直接选 GWLB。',rule:'GENEVE 协议 / 端口 6081 / 第三方网络安全设备 / 流量透明检测 → Gateway Load Balancer（GWLB）。'},

{id:'elb_12',topic:'Load Balancer',diff:'mid',
text:'关于 Sticky Sessions 的 Cookie，ALB 的 Duration-based Cookie（持续时间型 Cookie）名称是什么？',
en:'Regarding Sticky Sessions cookies, what is the cookie name for ALB\'s Duration-based Cookie?',
ch:['AWSALBAPP','AWSALB','AWSELB','AWSALBTG'],
ench:['AWSALBAPP','AWSALB','AWSELB','AWSALBTG'],
ans:1,exp:'Sticky Sessions Cookie 类型总结：<br><br><strong>① Application-based Cookie（应用型 Cookie）</strong><br>• Custom Cookie：由 Target（应用）生成，名称自定义（但不能用 AWSALB、AWSALBAPP、AWSALBTG 这几个保留名）<br>• Application Cookie：由 LB 生成，名称固定为 <strong>AWSALBAPP</strong><br><br><strong>② Duration-based Cookie（持续时间型 Cookie）</strong><br>• 由 LB 生成<br>• ALB 的名称：<strong>AWSALB</strong><br>• CLB 的名称：<strong>AWSELB</strong>',ww:'AWSALBAPP 是 Application Cookie（由 LB 生成的应用型）。AWSALB 是 Duration-based Cookie（持续时间型）。AWSELB 是 CLB 的持续时间型。',rule:'记忆口诀：ALB Duration = AWSALB。ALB Application = AWSALBAPP。CLB Duration = AWSELB。'},

{id:'elb_13',topic:'Load Balancer',diff:'high',
text:'架构需要在流量到达 Web 应用之前，先经过<em>第三方防火墙和入侵检测系统</em>进行过滤。应选择哪种 Load Balancer？',
en:'An architecture requires traffic to pass through <em>third-party firewalls and intrusion detection systems</em> before reaching the web application. Which Load Balancer should you use?',
ch:['Application Load Balancer（ALB）—— 支持 WAF 集成','Network Load Balancer（NLB）—— 超低延迟，性能最好','Gateway Load Balancer（GWLB）—— 专为透明地将流量路由通过第三方安全虚拟设备而设计','Classic Load Balancer（CLB）—— 最老、最稳定'],
ench:['Application Load Balancer (ALB) — supports WAF integration','Network Load Balancer (NLB) — ultra-low latency, best performance','Gateway Load Balancer (GWLB) — designed to transparently route traffic through 3rd-party security virtual appliances','Classic Load Balancer (CLB) — oldest, most stable'],
ans:2,exp:'<strong>Gateway Load Balancer（GWLB）</strong> 是专为此场景设计的：<br><br>• 在流量到达应用之前，<strong>透明地</strong>将所有流量路由到第三方网络安全虚拟设备（防火墙、IDS/IPS、DPI 等）<br>• 检查完毕后再将流量发回 GWLB，最终转发到应用<br>• 工作在 Layer 3（IP Packets），使用 GENEVE 协议/端口 6081<br>• Target Group：EC2（安全设备实例）或 私有 IP<br><br>注：ALB 的 WAF 是 AWS 自己的 Web 应用防火墙，不是第三方设备（A 错）。',ww:'第三方网络安全虚拟设备（3rd-party virtual appliances）→ GWLB。AWS 自己的 WAF → ALB+WAF 集成。',rule:'关键词"第三方安全设备 / Firewall / IDS / IPS / Deep Packet Inspection" → Gateway Load Balancer（GWLB）。'},

/* ── ASG ── */
{id:'asg_01',topic:'Auto Scaling Group',diff:'mid',
